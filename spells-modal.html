<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Incantesimi attivi</title>
  <link rel="stylesheet" href="/ui-typography.css" />
  <link rel="stylesheet" href="/popover-glass.css" />
  <style>
    :root { --obrt-text:#fff; --obrt-muted:rgba(255,255,255,.66); --obrt-line:rgba(148,163,184,.20); --obrt-hover:rgba(255,255,255,.06); }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; color:var(--obrt-text); }
    body { font-size:var(--obrt-type-body); line-height:1.25; }
    * { box-sizing:border-box; scrollbar-width:thin; scrollbar-color:rgba(148,163,184,.55) transparent; }
    .glass-shell { width:100%; height:100%; min-height:0 !important; display:flex; flex-direction:column; overflow:hidden; }
    .panel { flex:1 1 auto; min-height:0; padding:12px; position:relative; overflow-y:auto; }
    .title { margin:0 40px 12px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; font-size:var(--obrt-type-panel-title); font-weight:var(--obrt-weight-bold); letter-spacing:-.01em; }
    .close {
      position:fixed; top:9px; right:12px; width:30px; height:30px; padding:0;
      border:1px solid transparent; border-radius:9px; background:transparent; color:inherit;
      font:inherit; font-size:15px; cursor:pointer;
    }
    .close:hover { background:rgba(255,255,255,.08); }
    .wrap {
      display:grid; grid-template-columns:94px minmax(0,1fr) 84px 64px;
      gap:8px; align-items:center; padding:8px;
      border:1px solid var(--obrt-line); border-radius:11px; background:rgba(15,23,42,.72);
    }
    label { font-weight:var(--obrt-weight-medium); opacity:.9; }
    .wrap > label {
      margin:0; color:var(--obrt-muted); font-size:var(--obrt-type-caption);
      font-weight:var(--obrt-weight-bold); letter-spacing:.07em; text-transform:uppercase;
    }
    input[type="text"], input[type="number"], select {
      width:100%; min-width:0; min-height:32px; padding:6px 8px; border-radius:10px;
      border:1px solid rgba(148,163,184,.28); background:#0f172a;
      color:inherit; font:inherit; line-height:1.2;
    }
    input:disabled { background:#374151; color:rgba(255,255,255,.62); }
    input[type="number"] { -moz-appearance:textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
    .spell-combobox { position:relative; min-width:0; width:100%; }
    .spell-combobox #name { padding-right:40px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .spell-menu-toggle {
      position:absolute; top:1px; right:1px; width:34px; height:calc(100% - 2px); min-height:0; padding:0;
      border:0; border-radius:0 9px 9px 0; background:transparent; color:#fff; font-size:0;
    }
    .spell-menu-toggle:hover { background:rgba(255,255,255,.06); }
    .spell-menu {
      position:absolute; z-index:20; top:calc(100% + 5px); left:0; right:0;
      max-height:min(300px,48vh); padding:4px; overflow-y:auto;
      border:1px solid rgba(148,163,184,.36); border-radius:11px;
      background:#172033; box-shadow:0 16px 32px rgba(0,0,0,.42);
    }
    .spell-menu-group + .spell-menu-group { margin-top:3px; }
    .spell-menu-level {
      padding:6px 8px 4px;
      background:#172033; color:rgba(255,255,255,.56);
      font-size:var(--obrt-type-caption); font-weight:var(--obrt-weight-bold);
      letter-spacing:.07em; text-transform:uppercase;
    }
    .spell-menu-option {
      display:block; width:100%; min-width:0; min-height:0; padding:7px 9px;
      overflow:hidden; border:0; border-radius:7px; background:transparent;
      color:rgba(255,255,255,.9); text-align:left; text-overflow:ellipsis; white-space:nowrap;
    }
    .spell-menu-option:hover,
    .spell-menu-option.active { background:rgba(59,130,246,.24); color:#fff; }
    .spell-menu-empty { padding:10px; color:var(--obrt-muted); text-align:center; }
    .spell-menu-filters {
      position:sticky; top:-4px; z-index:3; display:flex; gap:4px; padding:4px;
      background:#172033; border-bottom:1px solid rgba(148,163,184,.20);
    }
    .spell-menu-filter {
      flex:1 1 auto; min-width:0; min-height:24px; padding:3px 5px;
      border-radius:6px; font-size:10px; white-space:nowrap;
    }
    .spell-menu-filter.active {
      background:rgba(37,99,235,.42); border-color:rgba(96,165,250,.72);
    }
    select:disabled { cursor:not-allowed; opacity:.6; }
    button {
      min-height:32px; padding:7px 12px; border-radius:9px;
      border:1px solid var(--obrt-line); background:rgba(255,255,255,.055);
      color:inherit; cursor:pointer; font:inherit; font-weight:var(--obrt-weight-medium);
    }
    button:hover { background:rgba(255,255,255,.12); }
    .primary { background:#2563eb; border-color:rgba(96,165,250,.55); font-weight:var(--obrt-weight-bold); }
    .blockbtn { grid-column:1 / -1; width:100%; }
    .row { grid-column:1 / -1; display:flex; gap:6px; align-items:center; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip {
      display:inline-flex; align-items:center; gap:6px; padding:5px 6px;
      border-radius:8px; background:rgba(255,255,255,.055);
      border:1px solid var(--obrt-line); white-space:nowrap; user-select:none;
    }
    .automation {
      align-items:flex-start; flex-direction:column; padding:8px;
      border:1px solid var(--obrt-line); border-radius:9px;
      background:rgba(15,23,42,.58);
    }
    .automation-line { display:flex; gap:8px; align-items:flex-start; font-weight:400; }
    .automation-line[hidden] { display:none; }
    .automation-line input { margin-top:2px; }
    .targets { margin-top:10px; }
    .targets-header { display:grid; grid-template-columns:1fr auto; gap:7px 8px; align-items:center; margin-bottom:7px; }
    .targets-title { color:var(--obrt-muted); font-size:var(--obrt-type-caption); font-weight:var(--obrt-weight-bold); letter-spacing:.07em; }
    .target-selection-count { color:#60a5fa; font-size:var(--obrt-type-body); }
    .target-actions { grid-column:1 / -1; display:flex; width:100%; gap:5px; }
    .target-name-filter {
      flex:1 1 auto; width:auto; min-width:0; min-height:28px; padding:4px 8px; border:1px solid var(--obrt-line); border-radius:8px;
      background:rgba(15,23,42,.9); color:inherit; font:inherit; font-size:11px; outline:none;
    }
    .faction-toggle { min-height:28px; padding:0 7px; background:#0f172a; font-size:var(--obrt-type-caption); font-weight:var(--obrt-weight-semibold); }
    .faction-toggle.active { background:rgba(37,99,235,.42); border-color:rgba(96,165,250,.72); }
    .target-list {
      display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:32px; gap:5px;
      height:194px; max-height:194px; overflow-y:auto; padding:6px; border-radius:11px;
      border:1px solid var(--obrt-line); background:rgba(15,23,42,.58);
    }
    .spell-target {
      display:flex; align-items:center; gap:8px; min-width:0; min-height:32px;
      padding:5px 8px; border-radius:9px; border:1px solid rgba(148,163,184,.14);
      cursor:pointer; background:rgba(15,23,42,.72);
    }
    .spell-target.selected { background:rgba(30,64,175,.24); border-color:rgba(96,165,250,.62); }
    .spell-target input { flex:0 0 auto; margin:0; }
    .spell-target-faction { width:8px; height:8px; flex:0 0 8px; border-radius:50%; box-shadow:0 0 8px currentColor; }
    .spell-target-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--obrt-type-body); font-weight:var(--obrt-weight-semibold); letter-spacing:0; }
    .overview { margin-top:10px; }
    .overview-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
    .overview-title { color:var(--obrt-muted); font-size:var(--obrt-type-caption); font-weight:var(--obrt-weight-bold); letter-spacing:.07em; }
    .overview-count {
      min-width:22px; padding:3px 7px; border-radius:10px; text-align:center;
      background:#0f172a; border:1px solid var(--obrt-line);
    }
    .overview-list { display:grid; gap:5px; max-height:245px; overflow-x:hidden; overflow-y:auto; padding:6px; border:1px solid var(--obrt-line); border-radius:11px; background:rgba(15,23,42,.58); }
    .spell-overview-row {
      display:flex; align-items:center; gap:10px; min-width:0; padding:8px 9px;
      border-radius:9px; border:1px solid rgba(148,163,184,.14);
      background:rgba(15,23,42,.72);
    }
    .spell-overview-content { flex:1 1 auto; min-width:0; display:grid; gap:3px; }
    .spell-overview-heading { display:flex; align-items:center; gap:6px; min-width:0; }
    .spell-overview-heading strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
    .spell-overview-heading > button,
    .overview-badge {
      flex:0 0 18px !important; width:18px !important; min-width:18px !important;
      height:18px !important; min-height:18px !important; padding:0 !important;
      display:inline-grid; place-items:center; border-radius:6px !important; font-size:10px !important;
      background:rgba(37,99,235,.28); border:1px solid rgba(96,165,250,.40);
    }
    .overview-badge:not(.concentration) {
      flex:0 0 auto !important; width:auto !important; min-width:0 !important; padding:0 5px !important;
    }
    .overview-badge.concentration {
      border-radius:50% !important; font-weight:700; background:rgba(14,165,233,.48);
    }
    .spell-overview-meta { color:rgba(255,255,255,.82); }
    .spell-overview-targets { display:flex; align-items:center; gap:3px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:rgba(255,255,255,.68); }
    .spell-overview-target { display:inline-flex; align-items:center; gap:2px; min-width:0; }
    .spell-overview-target > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .terminate-spell-target { min-height:18px; padding:0 4px; border-radius:5px; color:rgba(248,113,113,.95); border-color:rgba(248,113,113,.34); font-size:11px; line-height:1; }
    .terminate-spell-target:hover { background:rgba(220,38,38,.32); }
    .terminate-spell-target:disabled { opacity:.55; cursor:default; }
    .terminate-spell {
      flex:0 0 auto; min-height:28px; padding:5px 10px; border-radius:8px;
      background:rgba(220,38,38,.28); border-color:rgba(248,113,113,.42);
    }
    .terminate-spell:hover { background:rgba(220,38,38,.46); }
    .terminate-spell:disabled { opacity:.55; cursor:default; }
    .spell-overview-actions { flex:0 0 auto; display:flex; gap:5px; align-items:center; }
    .spell-overview-row--multi-action {
      display:grid; grid-template-columns:minmax(0,1fr); align-items:start; gap:7px;
    }
    .spell-overview-actions--grid {
      width:100%; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)) auto;
      gap:5px; align-items:stretch;
    }
    .spell-overview-actions--grid .activate-spell {
      min-width:0; padding-right:7px; padding-left:7px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .spell-overview-actions--grid .terminate-spell {
      grid-column:3; grid-row:1 / span 2; align-self:stretch;
    }
    .resolve-spell,
    .activate-spell {
      min-height:28px; padding:5px 10px; border-radius:8px;
      background:rgba(37,99,235,.38); border-color:rgba(96,165,250,.58);
    }
    .resolve-spell:hover,
    .activate-spell:hover { background:rgba(37,99,235,.56); }
    .resolve-spell:disabled,
    .activate-spell:disabled { opacity:.48; cursor:not-allowed; }
    .active-spell-choice { width:auto; max-width:132px; min-height:28px; padding:4px 7px; }
    .overview-empty { padding:18px 10px; text-align:center; color:rgba(255,255,255,.68); }
    @media (max-width:520px) {
      .panel { padding:10px; }
      .wrap { grid-template-columns:1fr; }
      .wrap > label, .wrap > input, .wrap > select, .wrap > .spell-combobox { grid-column:1; }
      .blockbtn { grid-column:1; }
      .target-actions { flex-wrap:wrap; }
      .target-name-filter { flex-basis:100%; }
      .target-list { grid-template-columns:1fr; }
      .spell-overview-row { align-items:flex-start; flex-wrap:wrap; }
      .spell-overview-actions { width:100%; }
      .spell-overview-actions > button { flex:1 1 auto; }
      .spell-overview-actions--grid {
        display:grid; grid-template-columns:repeat(2,minmax(0,1fr)) auto;
      }
    }
  </style>
</head>
<body>
  <div class="glass-shell" data-glass-popover="1" data-popover-id="com.thebigpicture.initiative/spells-modal">
  <main class="panel">
    <div class="title" id="modalTitle">Incantesimi</div>
    <button class="close" type="button" id="modalClose" title="Chiudi">X</button>
    <form id="f" class="wrap" autocomplete="off">
      <label for="name">Incantesimo</label>
      <div class="spell-combobox">
        <input id="name" name="spellName" type="text" placeholder="Velocità"
               role="combobox" aria-autocomplete="list" aria-controls="spellMenu" aria-expanded="false"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <button class="spell-menu-toggle obrt-select-caret-toggle" id="spellMenuToggle" type="button"
                aria-label="Mostra tutti gli incantesimi" aria-controls="spellMenu" aria-expanded="false">▾</button>
        <div class="spell-menu" id="spellMenu" role="listbox" hidden></div>
      </div>

      <label for="dur">Durata (in round)</label>
      <input id="dur" name="dur" type="number" min="1" step="1" value="10" required />

      <label for="caster">Caster</label>
      <select id="caster" name="caster" disabled><option value="">—</option></select>

      <label for="slotLevel" id="slotLevelLabel">Slot</label>
      <input id="slotLevel" name="slotLevel" type="number" min="1" max="9" step="1" value="1" />

      <label for="conc">Concentrazione</label>
      <input id="conc" type="checkbox" style="justify-self:start;width:auto;height:auto" />
      <div class="row automation" id="automationWrap" style="display:none">
        <label class="automation-line">
          <input id="applyConditions" type="checkbox" />
          <span id="automationText"></span>
        </label>
        <label class="automation-line" id="mobileAuraWrap" hidden>
          <input id="createMobileAura" type="checkbox" checked />
          <span>Crea e collega l'aura mobile al caster</span>
        </label>
        <select id="conditionChoice" aria-label="Variante dell'incantesimo" style="display:none"></select>
      </div>

      <button class="blockbtn primary" type="submit" id="submit">Applica a 1 bersaglio</button>

    </form>
    <section class="targets" aria-labelledby="spellTargetsTitle">
      <div class="targets-header">
        <div class="targets-title" id="spellTargetsTitle">BERSAGLI</div>
        <div class="target-selection-count" id="spellTargetSelectionCount">1 selezionato</div>
        <div class="target-actions">
          <input class="target-name-filter" id="spellTargetNameFilter" type="search" placeholder="Cerca nome…" aria-label="Filtra bersagli per nome" />
          <button class="faction-toggle" type="button" data-spell-faction="pc" aria-pressed="false">PG</button>
          <button class="faction-toggle" type="button" data-spell-faction="ally" aria-pressed="false">Alleati</button>
          <button class="faction-toggle" type="button" data-spell-faction="neutral" aria-pressed="false">Neutrali</button>
          <button class="faction-toggle" type="button" data-spell-faction="enemy" aria-pressed="false">Nemici</button>
        </div>
      </div>
      <div class="target-list" id="spellTargetList"></div>
    </section>
    <section class="overview" aria-labelledby="spellOverviewTitle">
      <div class="overview-header">
        <div class="overview-title" id="spellOverviewTitle">INCANTESIMI ATTIVI SUL CAMPO</div>
        <span class="overview-count" id="spellOverviewCount">0</span>
      </div>
      <div class="overview-list" id="spellOverviewList"></div>
    </section>
  </main>
  </div>
  <script type="module" src="/src/popoverDrag.js"></script>
  <script type="module" src="/src/spells-panel.js"></script>
</body>
</html>
