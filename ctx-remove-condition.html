<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/ui-typography.css" />
  <style>
    :root {

      --obrt-text: #fff;
      --obrt-hover: rgba(255,255,255,.06);
    }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--obrt-text);
      font-size: var(--obrt-type-body);
      line-height: 1.25;
    }
    #app {
      display: grid;
      gap: 6px;
      max-height: 270px;
      overflow-y: auto;
      padding: 8px;
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: rgba(148,163,184,.55) transparent;
    }
    .condition-row {
      width: 100%;
      min-width: 0;
      display: grid;
      gap: 4px;
      padding: 8px 10px;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 10px;
      background: rgba(255,255,255,.07);
      color: var(--obrt-text);
      text-align: left;
      cursor: pointer;
      font: inherit;
      font-weight: var(--obrt-weight-medium);
      transition: background-color .12s ease, border-color .12s ease;
    }
    .condition-row:hover {
      background: rgba(220,38,38,.24);
      border-color: rgba(248,113,113,.42);
    }
    .condition-row:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
    .condition-row:disabled { opacity: .6; cursor: default; }
    .condition-name, .condition-target {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .condition-name { font-weight: var(--obrt-weight-semibold); }
    .condition-target { color: rgba(255,255,255,.75); font-size: var(--obrt-type-secondary); font-weight: var(--obrt-weight-regular); }
    .empty { padding: 14px 8px; text-align: center; color: rgba(255,255,255,.75); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/ctx-remove-condition.ts"></script>
</body>
</html>
