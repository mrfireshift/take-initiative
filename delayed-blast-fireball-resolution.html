<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detonazione · Palla di fuoco ritardata</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 0; margin: 0; overflow: hidden; background: transparent; color: #f8fafc; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      [hidden] { display: none !important; }
      #app {
        --accent: #a78bfa;
        display: flex; flex-direction: column; gap: 8px;
        width: calc(100% - 8px); height: auto; min-height: 0; margin: 4px;
        padding: 11px 12px; border: 1px solid rgba(196,181,253,.72);
        border-radius: 10px;
        background: linear-gradient(135deg, rgba(76,29,149,.32), rgba(30,41,59,.18) 62%), rgba(15,23,42,.14);
        -webkit-backdrop-filter: blur(6px) saturate(120%);
        backdrop-filter: blur(6px) saturate(120%);
        box-shadow: 0 0 0 1px rgba(15,23,42,.9), 0 8px 24px rgba(0,0,0,.48), 0 0 18px rgba(139,92,246,.28);
      }
      .top, .row, .footer { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .top { justify-content: space-between; }
      .eyebrow { color: #c4b5fd; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 0; overflow: hidden; font: 800 17px/1.1 Georgia, "Times New Roman", serif; text-overflow: ellipsis; white-space: nowrap; }
      .close { min-width: 25px; min-height: 25px; padding: 1px 5px; border: 0; background: transparent; color: #ede9fe; font-size: 22px; line-height: 1; cursor: pointer; }
      .hint, .status { color: rgba(226,232,240,.74); font-size: 11px; line-height: 1.25; }
      .targets { display: flex; flex-direction: column; gap: 5px; min-height: 0; max-height: 205px; overflow: auto; padding-right: 2px; }
      .target { display: grid; grid-template-columns: minmax(0, 1fr) repeat(2, auto); align-items: center; gap: 4px; padding: 5px; border: 1px solid rgba(196,181,253,.2); border-radius: 6px; background: rgba(15,23,42,.66); }
      .target-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
      button, input { min-height: 28px; border: 1px solid rgba(196,181,253,.4); border-radius: 6px; background: rgba(15,23,42,.9); color: #f8fafc; font: 700 11px system-ui, sans-serif; }
      button { padding: 4px 8px; cursor: pointer; }
      button:hover:not(:disabled) { filter: brightness(1.14); }
      .target button { min-width: 31px; padding: 3px 4px; font-size: 9px; }
      .target button.active { border-color: #f5d0fe; background: rgba(126,34,206,.85); }
      .footer { justify-content: flex-start; margin-top: 0; border-top: 1px solid rgba(196,181,253,.2); padding-top: 7px; }
      .footer label { flex: 1 1 auto; min-width: 0; color: rgba(226,232,240,.78); font-size: 11px; }
      input { width: 88px; padding: 4px 7px; }
      .primary { border-color: #ddd6fe; background: linear-gradient(#8b5cf6,#6d28d9) !important; }
      button:disabled { cursor: default; opacity: .45; }
      @media (max-width: 300px) {
        .target { grid-template-columns: minmax(0, 1fr); }
        .target button { width: 100%; }
        .footer { flex-wrap: wrap; }
        .footer label { flex-basis: 100%; }
        input { flex: 1 1 70px; }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="top"><div><div class="eyebrow">Detonazione terminale</div><h1 id="title">Palla di fuoco ritardata</h1></div><button id="close" class="close" type="button" aria-label="Chiudi">×</button></div>
      <div id="hint" class="hint">TS Destrezza · danno da fuoco</div>
      <div id="status" class="status" hidden></div>
      <div id="targets" class="targets"></div>
      <div class="footer"><label for="damage">Danno · <span id="formula">12d6</span></label><input id="damage" type="number" min="0" step="1" inputmode="numeric" /><button id="apply" class="primary" type="button">Detona</button></div>
    </main>
    <script type="module" src="/src/delayed-blast-fireball-resolution.js"></script>
  </body>
</html>
