<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detonazione · Palla di fuoco ritardata</title>
    <link rel="stylesheet" href="/ui-typography.css" />
    <link rel="stylesheet" href="/popover-glass.css" />
    <link rel="stylesheet" href="/console-shell.css" />
    <link rel="stylesheet" href="/console-panel.css" />
    <link rel="stylesheet" href="/spell-popover.css" />
  </head>
  <body>
    <main id="app" class="glass-shell" data-glass-popover="1">
      <header class="header heading" data-drag-handle draggable="true" title="Trascina per spostare">
        <div class="heading-title-group">
          <h1 id="title" class="title">Palla di fuoco ritardata</h1>
          <div id="subtitle" class="subtitle" hidden></div>
        </div>
        <span class="drag-grip" aria-hidden="true"></span>
        <div class="heading-actions">
          <button id="close" class="icon-button" type="button" title="Chiudi" aria-label="Chiudi">×</button>
        </div>
      </header>
      <div class="panel"><div class="view">
        <p id="facts" class="action-facts"></p>
        <div id="damageField" class="field" hidden><label id="damageLabel" for="damage">Fuoco</label><input id="damage" type="number" min="0" step="1" inputmode="numeric" placeholder="Totale" /></div>
        <div id="bulkOutcomes" class="section-head" role="group" aria-label="Imposta tutti" hidden>
          <span class="caption">Creature colpite</span>
          <span class="area-tools">
            <button class="area-tool" type="button" data-bulk-outcome="passed">Tutti superati</button>
            <button class="area-tool" type="button" data-bulk-outcome="failed">Tutti falliti</button>
          </span>
        </div>
        <div id="targets" class="targets"></div>
      </div></div>
      <div class="apply-row"><button id="apply" class="apply" type="button" disabled>Detona</button><span id="summary" class="total" hidden></span><div id="damageDefenses" class="defense-chips" hidden></div></div>
      <footer class="status-bar"><p id="status" class="status" role="status" aria-live="polite" hidden></p></footer>
    </main>
    <script type="module" src="/src/delayed-blast-fireball-resolution.js"></script>
  </body>
</html>
