<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiro di Concentrazione</title>
    <link rel="stylesheet" href="/ui-scrollbars.css" />
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; background: transparent; }
      * { box-sizing: border-box; }
      body {
        position: relative;
        overflow: hidden;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        pointer-events: none;
      }
      .warning {
        --accent: #fb923c;
        --accent-soft: rgba(251, 146, 60, .42);
        --accent-deep: rgba(104, 39, 20, .95);
        position: absolute;
        top: 4px;
        left: 4px;
        width: calc(100% - 8px);
        min-height: 126px;
        max-height: calc(100% - 8px);
        overflow: hidden;
        padding: 14px 62px 14px 106px;
        border: 2px solid #080b10;
        border-radius: 8px;
        background:
          linear-gradient(115deg, var(--accent-deep) 0%, rgba(27, 20, 18, .97) 48%, rgba(10, 11, 14, .98) 100%);
        box-shadow:
          0 0 0 2px var(--accent),
          0 0 22px 5px var(--accent-soft),
          0 18px 48px rgba(0, 0, 0, .68),
          inset 0 0 0 1px rgba(255, 255, 255, .12),
          inset 0 -28px 44px rgba(0, 0, 0, .25);
      }
      .warning::before {
        position: absolute;
        top: 6px;
        right: 8px;
        bottom: 6px;
        left: 8px;
        border: 1px solid rgba(255,255,255,.10);
        border-radius: 4px;
        content: "";
        pointer-events: none;
      }
      .portrait {
        position: absolute;
        top: 50%;
        left: 13px;
        width: 83px;
        height: 83px;
        overflow: hidden;
        border: 2px solid #080b10;
        border-radius: 50%;
        background: rgba(4, 7, 11, .96);
        box-shadow:
          0 0 0 2px var(--accent),
          0 0 14px 3px var(--accent-soft),
          inset 0 0 0 1px rgba(255,255,255,.18);
        transform: translateY(-50%);
      }
      .portrait img { width: 100%; height: 100%; display: block; object-fit: cover; }
      .portrait-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 35% 30%, var(--accent-deep), #090d13 72%);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 35px;
        font-weight: 800;
        text-shadow: 0 2px 4px #000;
      }
      .copy { position: relative; min-width: 0; z-index: 1; }
      .eyebrow {
        color: var(--accent);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .8px;
        text-transform: uppercase;
      }
      .title {
        margin-top: 3px;
        overflow: hidden;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(18px, 3.5vw, 23px);
        font-weight: 800;
        line-height: 1.05;
        text-overflow: ellipsis;
        text-shadow: 0 2px 3px rgba(0,0,0,.9);
        white-space: nowrap;
      }
      .save-badge {
        position: absolute;
        top: 14px;
        right: 15px;
        width: 38px;
        height: 38px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 2px solid #080b10;
        border-radius: 50%;
        background: rgba(5, 9, 14, .88);
        box-shadow: 0 0 0 1px var(--accent), inset 0 0 12px var(--accent-soft);
        line-height: 1;
        z-index: 1;
      }
      .save-badge span { color: var(--accent); font-size: 7px; font-weight: 900; letter-spacing: .4px; }
      .save-badge strong { margin-top: 2px; font-family: Georgia, "Times New Roman", serif; font-size: 16px; }
      .list {
        position: relative;
        display: grid;
        gap: 5px;
        max-height: calc(100% - 48px);
        margin-top: 8px;
        padding-top: 6px;
        overflow-y: auto;
        border-top: 1px solid rgba(251,146,60,.42);
        z-index: 1;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto auto;
        gap: 6px;
        align-items: center;
        padding: 4px 6px;
        border: 1px solid rgba(255,255,255,.10);
        border-radius: 4px;
        background: rgba(0,0,0,.24);
      }
      .warning-single .row { grid-template-columns: minmax(0, 1fr) auto auto; }
      .identity { min-width: 0; }
      .name { overflow: hidden; font-family: Georgia, "Times New Roman", serif; font-size: 12px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
      .spell-name { margin-top: 1px; overflow: hidden; color: rgba(255,255,255,.62); font-size: 8px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
      .damage { color: rgba(255,255,255,.68); font-size: 9px; }
      .dc { color: var(--accent); font-size: 10px; font-weight: 900; }
      .resolution {
        display: flex;
        gap: 3px;
        pointer-events: auto;
      }
      .resolution button {
        min-height: 18px;
        padding: 3px 5px;
        border: 1px solid rgba(255,255,255,.26);
        border-radius: 4px;
        background: rgba(4, 8, 13, .82);
        color: #fff;
        cursor: pointer;
        font: 700 8px/1 system-ui, sans-serif;
        pointer-events: auto;
      }
      .resolution button:hover { border-color: var(--accent); }
      .resolution button:disabled { cursor: default; opacity: .52; }
      .resolution-status {
        grid-column: 1 / -1;
        color: var(--accent);
        font-size: 8px;
        font-weight: 800;
      }
      .timer {
        position: absolute;
        right: 0;
        bottom: -2px;
        left: 0;
        height: 4px;
        overflow: hidden;
        border-radius: 0 0 6px 6px;
        background: rgba(255,255,255,.07);
      }
      .timer::after {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        content: "";
        transform-origin: left;
        animation: expire 6s linear forwards;
      }
      @keyframes expire { to { transform: scaleX(0); } }
      @media (max-width: 520px) {
        .warning { padding: 13px 54px 12px 88px; min-height: 114px; }
        .portrait { left: 11px; width: 66px; height: 66px; }
        .title { font-size: 18px; }
        .save-badge { top: 12px; right: 12px; width: 36px; height: 36px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/concentration-warning.ts"></script>
  </body>
</html>
