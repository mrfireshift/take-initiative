<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambio Turno</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; background: transparent; }
      * { box-sizing: border-box; }
      body {
        position: relative;
        overflow: hidden;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        pointer-events: none;
      }
      .notice {
        --accent: #60a5fa;
        --accent-soft: rgba(96, 165, 250, .42);
        --accent-deep: rgba(15, 62, 112, .92);
        position: absolute;
        top: 9vh;
        left: 50%;
        width: min(620px, calc(100vw - 32px));
        min-height: 158px;
        overflow: visible;
        padding: 18px 78px 17px 132px;
        border: 2px solid #080b10;
        border-radius: 8px;
        background:
          linear-gradient(115deg, var(--accent-deep) 0%, rgba(18, 24, 34, .97) 48%, rgba(8, 12, 18, .98) 100%);
        box-shadow:
          0 0 0 2px var(--accent),
          0 0 22px 5px var(--accent-soft),
          0 18px 48px rgba(0, 0, 0, .68),
          inset 0 0 0 1px rgba(255, 255, 255, .12),
          inset 0 -28px 44px rgba(0, 0, 0, .25);
        opacity: 0;
        transform: translate(-50%, -8px) scale(.78);
        transform-origin: top center;
        transition: opacity 180ms ease, transform 220ms ease;
        will-change: opacity, transform;
      }
      .notice.is-visible { opacity: 1; transform: translate(-50%, 0) scale(.8); }
      .notice.is-leaving { opacity: 0; transform: translate(-50%, 5px) scale(.79); }
      .notice[data-attitude="enemy"] {
        --accent: #ef4444;
        --accent-soft: rgba(239, 68, 68, .43);
        --accent-deep: rgba(105, 24, 30, .94);
      }
      .notice[data-attitude="ally"] {
        --accent: #22c55e;
        --accent-soft: rgba(34, 197, 94, .38);
        --accent-deep: rgba(17, 83, 49, .94);
      }
      .notice[data-attitude="neutral"] {
        --accent: #f59e0b;
        --accent-soft: rgba(245, 158, 11, .38);
        --accent-deep: rgba(95, 61, 14, .94);
      }
      .notice::before {
        position: absolute;
        top: 8px;
        right: 10px;
        bottom: 8px;
        left: 10px;
        border: 1px solid rgba(255,255,255,.10);
        border-radius: 4px;
        content: "";
      }
      .portrait {
        position: absolute;
        top: 50%;
        left: 16px;
        width: 104px;
        height: 104px;
        overflow: hidden;
        border: 3px solid #080b10;
        border-radius: 50%;
        background: rgba(4, 7, 11, .96);
        box-shadow:
          0 0 0 3px var(--accent),
          0 0 18px 4px var(--accent-soft),
          inset 0 0 0 1px rgba(255,255,255,.18);
        transform: translateY(-50%);
      }
      .portrait img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      .portrait-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 35% 30%, var(--accent-deep), #090d13 72%);
        color: #fff;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 44px;
        font-weight: 800;
        text-shadow: 0 2px 4px #000;
      }
      .copy { position: relative; min-width: 0; z-index: 1; }
      .eyebrow {
        color: var(--accent);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .8px;
        text-transform: uppercase;
      }
      .title {
        margin-top: 3px;
        overflow: hidden;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(22px, 3.5vw, 29px);
        font-weight: 800;
        line-height: 1.05;
        text-overflow: ellipsis;
        text-shadow: 0 2px 3px rgba(0,0,0,.9);
        white-space: nowrap;
      }
      .round-badge {
        position: absolute;
        top: 18px;
        right: 19px;
        width: 48px;
        height: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 2px solid #080b10;
        border-radius: 50%;
        background: rgba(5, 9, 14, .88);
        box-shadow: 0 0 0 1px var(--accent), inset 0 0 12px var(--accent-soft);
        color: #fff;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        z-index: 1;
      }
      .round-badge span { color: var(--accent); font-size: 8px; font-weight: 900; letter-spacing: .5px; }
      .round-badge strong { margin-top: 3px; font-family: Georgia, "Times New Roman", serif; font-size: 18px; }
      .next {
        position: relative;
        margin-top: 18px;
        padding-top: 11px;
        border-top: 1px solid color-mix(in srgb, var(--accent) 48%, transparent);
        color: rgba(255,255,255,.68);
        font-size: 12px;
        z-index: 1;
      }
      .next span { margin-right: 5px; color: var(--accent); font-weight: 800; letter-spacing: .3px; text-transform: uppercase; }
      .next strong { color: #fff; font-family: Georgia, "Times New Roman", serif; font-size: 14px; }
      .timer {
        position: absolute;
        right: 0;
        bottom: -2px;
        left: 0;
        height: 4px;
        overflow: hidden;
        border-radius: 0 0 6px 6px;
        background: rgba(255,255,255,.07);
      }
      .timer::after {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        content: "";
        transform-origin: left;
        animation: expire 4.5s linear forwards;
      }
      @keyframes expire { to { transform: scaleX(0); } }
      @media (max-width: 520px) {
        .notice { padding: 16px 64px 15px 104px; min-height: 140px; }
        .portrait { left: 13px; width: 78px; height: 78px; }
        .title { font-size: 21px; }
        .round-badge { top: 15px; right: 14px; width: 42px; height: 42px; }
        .next { margin-top: 15px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/turn-notice.ts"></script>
  </body>
</html>
