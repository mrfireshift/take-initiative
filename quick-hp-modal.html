<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console effetti manuali</title>
  <link rel="stylesheet" href="/ui-typography.css" />
  <link rel="stylesheet" href="/popover-glass.css" />
  <style>
    :root {
      --text: var(--obrt-text, #fff);
      --muted: var(--obrt-muted, rgba(255, 255, 255, .66));
      --line: var(--obrt-line, rgba(148, 163, 184, .20));
      --surface: var(--obrt-surface, #0f172a);
      --surface-soft: var(--obrt-surface-soft, rgba(15, 23, 42, .58));
      --surface-row: var(--obrt-surface-row, rgba(15, 23, 42, .72));
      --disabled: #374151;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { color: var(--text); font-family: var(--obrt-font-ui); font-size: var(--obrt-type-body); line-height: var(--obrt-leading-snug); }
    button, input, select { font: inherit; }
    .glass-shell { width: 100%; height: 100%; min-height: 0 !important; display: flex; flex-direction: column; overflow: hidden; }
    .panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: var(--obrt-space-lg, 10px); padding: 10px 12px 12px; overflow: hidden; }
    .header, .target-header, .target-heading, .bulk-row, .footer, .target-actions, .bulk-actions, .footer-actions { display: flex; align-items: center; }
    .header, .target-header, .bulk-row, .footer { justify-content: space-between; gap: var(--obrt-space-md); }
    .target-header { align-items: flex-start; }
    .header { flex: 0 0 auto; min-height: var(--obrt-h-header, 44px); padding: var(--obrt-space-md, 8px) var(--obrt-space-xl, 12px); border-bottom: 1px solid var(--line); background: rgba(15, 23, 42, .24); cursor: grab; user-select: none; }
    .header.is-dragging, .header[data-drag-handle].is-dragging { cursor: grabbing; }
    .title { min-width: 0; margin: 0; overflow: hidden; color: var(--text); font-size: var(--obrt-type-panel-title, 16px); font-weight: var(--obrt-weight-bold, 700); letter-spacing: var(--obrt-tracking-tight, -.01em); line-height: var(--obrt-leading-snug, 1.25); text-overflow: ellipsis; white-space: nowrap; }
    .close { display: inline-flex; align-items: center; justify-content: center; width: var(--obrt-h-control-sm, 28px); height: var(--obrt-h-control-sm, 28px); min-height: var(--obrt-h-control-sm, 28px); padding: 0; border: 1px solid transparent; border-radius: var(--obrt-radius-md, 8px); background: transparent; color: inherit; font-size: 18px; line-height: 1; cursor: pointer; transition: background-color .12s ease; }
    .close:hover { background: var(--obrt-hover, rgba(255, 255, 255, .08)); }
    .small:hover { background: var(--obrt-hover, rgba(255, 255, 255, .08)); }
    .controls { display: grid; grid-template-columns: minmax(0, 1fr) 118px; gap: var(--obrt-space-md); align-items: end; }
    .mode-group { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--obrt-space-xs); padding: var(--obrt-space-xs); border: 1px solid var(--line); border-radius: var(--obrt-radius-lg); background: var(--surface-row); }
    .mode, .factor { min-height: var(--obrt-h-control-md); padding: 5px 8px; border: 1px solid transparent; border-radius: var(--obrt-radius-md); background: transparent; color: rgba(255, 255, 255, .78); font-size: var(--obrt-type-body); cursor: pointer; transition: background-color .12s ease, color .12s ease; }
    .mode.active { font-weight: var(--obrt-weight-bold); }
    .mode.active[data-mode=damage] { color: #fecaca; background: rgba(185, 28, 28, .34); }
    .mode.active[data-mode=heal] { color: #bbf7d0; background: rgba(21, 128, 61, .34); }
    .mode.active[data-mode=temp] { color: #bfdbfe; background: rgba(29, 78, 216, .34); }
    .mode.active[data-mode=save] { color: #fde68a; background: rgba(161, 98, 7, .28); }
    .amount-wrap { display: grid; gap: var(--obrt-space-xs); }
    .caption { color: var(--muted); font-size: var(--obrt-type-caption); font-weight: var(--obrt-weight-bold); letter-spacing: var(--obrt-tracking-wide); text-transform: uppercase; line-height: var(--obrt-leading-snug); }
    .amount { width: 100%; height: 42px; padding: 5px 10px; border: 1px solid rgba(148, 163, 184, .28); border-radius: var(--obrt-radius-lg); outline: none; background: var(--surface); color: #fff; font-size: 22px; font-weight: var(--obrt-weight-bold); text-align: center; font-variant-numeric: tabular-nums; }
    .amount:focus { border-color: rgba(96, 165, 250, .7); box-shadow: 0 0 0 2px rgba(37, 99, 235, .18); }
    .save-options { display: grid; gap: 0; padding: 0; border: 0; border-radius: 0; background: transparent; }
    .condition-card { display: flex; flex-direction: column; gap: var(--obrt-space-sm); padding: 0; border: 0; border-radius: 0; background: transparent; }
    .condition-details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--obrt-space-sm); }
    .condition-details label { display: grid; gap: 3px; min-width: 0; }
    .condition-details select, .condition-details input { width: 100%; min-height: var(--obrt-h-control-md); padding: 4px 7px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); color: inherit; outline: none; }
    .condition-details label[hidden], [hidden] { display: none !important; }
    .target-section { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: var(--obrt-space-sm); overflow: hidden; }
    .target-header { display: flex; flex-direction: column; gap: var(--obrt-space-xs); width: 100%; }
    .target-heading { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 20px; }
    .target-count { color: #60a5fa; font-size: var(--obrt-type-body); font-weight: var(--obrt-weight-medium); }
    .target-actions { display: flex; align-items: center; gap: var(--obrt-space-xs); width: 100%; }
    .target-actions, .bulk-actions, .footer-actions { gap: 5px; }
    .small { min-height: 27px; padding: 4px 9px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); color: inherit; cursor: pointer; }
    .target-name-filter { flex: 1 1 auto; min-width: 0; width: auto; min-height: var(--obrt-h-control-sm); padding: 4px var(--obrt-space-md); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); color: inherit; font-size: var(--obrt-type-secondary); outline: none; }
    .faction-toggle { min-height: var(--obrt-h-control-sm); padding: 0 var(--obrt-space-md); font-size: var(--obrt-type-caption); font-weight: var(--obrt-weight-semibold); border-radius: var(--obrt-radius-md); }
    .faction-toggle.active { background: rgba(37, 99, 235, .42); border-color: rgba(96, 165, 250, .72); }
    .faction-toggle.active[data-hp-faction=pc] { background: rgba(56, 189, 248, .30); border-color: rgba(56, 189, 248, .60); color: #bae6fd; }
    .faction-toggle.active[data-hp-faction=ally] { background: rgba(34, 197, 94, .30); border-color: rgba(34, 197, 94, .60); color: #bbf7d0; }
    .faction-toggle.active[data-hp-faction=neutral] { background: rgba(234, 179, 8, .30); border-color: rgba(234, 179, 8, .60); color: #fef08a; }
    .faction-toggle.active[data-hp-faction=enemy] { background: rgba(239, 68, 68, .30); border-color: rgba(239, 68, 68, .60); color: #fecaca; }
    .target-list { flex: 1 1 0; min-height: 0; display: grid; align-content: start; gap: 5px; padding: var(--obrt-space-md); overflow-y: auto; border: 1px solid var(--line); border-radius: var(--obrt-radius-lg); background: var(--surface-soft); scrollbar-width: thin; }
    .target { display: grid; grid-template-columns: 20px minmax(105px, 1fr) minmax(104px, auto) minmax(145px, auto); align-items: center; gap: 7px; min-height: 46px; padding: 6px 8px; border: 1px solid rgba(148, 163, 184, .14); border-radius: var(--obrt-radius-md); background: var(--surface-row); cursor: pointer; transition: border-color .12s ease, background-color .12s ease; }
    .target.selected { border-color: rgba(96, 165, 250, .62); background: rgba(30, 64, 175, .24); }
    .target.disabled { opacity: .46; cursor: default; }
    .target input { accent-color: #2563eb; }
    .identity { min-width: 0; display: flex; align-items: center; gap: 7px; }
    .faction { width: 8px; height: 8px; flex: 0 0 auto; border-radius: var(--obrt-radius-pill); box-shadow: 0 0 7px currentColor; }
    .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--obrt-type-body); font-weight: var(--obrt-weight-semibold); }
    .hp-preview { min-width: 104px; text-align: right; font-size: var(--obrt-type-body); font-weight: var(--obrt-weight-medium); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .before { color: var(--muted); }
    .delta.damage { color: #fca5a5; }
    .delta.heal { color: #86efac; }
    .delta.temp { color: #93c5fd; }
    .factor-group, .outcome-group { width: 100%; display: grid; gap: var(--obrt-space-xs); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); overflow: hidden; }
    .factor-group { grid-template-columns: repeat(4, minmax(32px, 1fr)); }
    .outcome-group { grid-template-columns: repeat(3, minmax(54px, 1fr)); }
    .factor, .outcome { min-width: 0; min-height: var(--obrt-h-control-sm); padding: 0 5px; border: 0; border-right: 1px solid rgba(148, 163, 184, .18); border-radius: 0; background: transparent; color: rgba(255, 255, 255, .78); cursor: pointer; font-size: var(--obrt-type-caption); font-weight: var(--obrt-weight-semibold); }
    .factor:last-child, .outcome:last-child { border-right: 0; }
    .factor.active { color: #fff; background: rgba(161, 98, 7, .38); }
    .outcome.active[data-outcome=passed] { color: #bbf7d0; background: rgba(21, 128, 61, .38); }
    .outcome.active[data-outcome=failed] { color: #fecaca; background: rgba(185, 28, 28, .38); }
    .outcome.active[data-outcome=immune] { color: #cbd5e1; background: rgba(71, 85, 105, .5); }
    .empty { padding: 20px; text-align: center; color: var(--muted); }
    .bulk-panel { flex: 0 0 auto; border: 1px solid var(--line); border-radius: var(--obrt-radius-lg); background: var(--surface-soft); overflow: hidden; }
    .bulk-row { min-height: 42px; padding: var(--obrt-space-md); }
    .bulk-actions { margin-left: auto; }
    .bulk-actions .small { min-width: 0; color: #bfdbfe; font-size: var(--obrt-type-secondary); }
    .bulk-panel > .status { min-height: 30px; padding: var(--obrt-space-md); border-top: 1px solid rgba(148, 163, 184, .14); color: #bfdbfe; font-size: var(--obrt-type-secondary); }
    .footer { flex: 0 0 auto; min-height: 42px; padding-top: 9px; border-top: 1px solid var(--line); }
    .summary { min-width: 0; flex: 1 1 auto; color: var(--muted); font-size: var(--obrt-type-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .footer-actions { flex: 0 0 auto; }
    .apply { min-width: 150px; min-height: var(--obrt-h-control-lg); padding: 7px 14px; border: 1px solid rgba(255, 255, 255, .18); border-radius: var(--obrt-radius-md); background: #2563eb; color: #fff; font-size: var(--obrt-type-body); font-weight: var(--obrt-weight-bold); cursor: pointer; transition: background-color .12s ease; }
    .apply.damage { background: #dc2626; }
    .apply.heal { background: #15803d; }
    .apply.temp { background: #1d4ed8; }
    .apply:disabled, .small:disabled { opacity: .48; cursor: default; background: var(--disabled); color: rgba(255, 255, 255, .62); }
    @media(max-width:760px){.panel{padding:12px;gap:10px}.controls{grid-template-columns:minmax(0,1fr) 94px}.mode{min-height:38px;padding:5px 6px;font-size:var(--obrt-type-body)}.amount{height:42px}.target-header{align-items:center}.target-actions{gap:5px}.target-name-filter{flex:1 1 auto;width:auto}.target{grid-template-columns:20px minmax(80px,1fr) minmax(98px,auto) minmax(180px,auto);min-height:46px;padding:5px 7px}.identity{grid-column:2}.hp-preview{grid-column:3;min-width:0}.factor-group{grid-column:4}.target.save-target .outcome-group{grid-column:4}.footer{gap:8px}.footer-actions{gap:5px}}
    @media(max-width:520px){.mode-group{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{grid-template-columns:1fr}.target-header{align-items:flex-start;flex-direction:column}.target-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.target-name-filter{grid-column:1/-1;width:100%}.faction-toggle{padding-inline:7px}.condition-details{grid-template-columns:1fr}.target{grid-template-columns:20px minmax(0,1fr);padding-inline:7px}.identity{grid-column:2;grid-row:1}.hp-preview{grid-column:2;grid-row:2;text-align:left}.factor-group,.outcome-group{grid-column:2;grid-row:3}.bulk-row{align-items:flex-start;flex-direction:column;gap:6px}.bulk-actions{width:100%;margin-left:0}.footer{align-items:flex-end;flex-direction:column}.summary{width:100%;white-space:normal}.footer-actions{width:100%;justify-content:flex-end}.apply{min-width:0}}
  </style>
</head>
<body>
  <div class="glass-shell" data-glass-popover="1" data-popover-id="com.thebigpicture.initiative/quick-hp-modal">
    <header class="header" data-drag-handle draggable="true" title="Trascina per spostare"><div class="title">Console effetti manuali</div><button class="close" id="close" type="button" title="Chiudi">&times;</button></header>
    <main class="panel">
      <section class="controls">
        <div class="mode-group" role="tablist" aria-label="Tipo di operazione">
          <button class="mode active" data-mode="save" type="button">Effetti</button>
          <button class="mode" data-mode="damage" type="button">Danno</button>
          <button class="mode" data-mode="heal" type="button">Cura</button>
          <button class="mode" data-mode="temp" type="button">HP temp.</button>
        </div>
        <label class="amount-wrap"><span class="caption">Valore</span><input class="amount" id="amount" type="text" inputmode="numeric" pattern="[0-9]*" value="0" autocomplete="off" /></label>
      </section>
      <section class="save-options" id="saveOptions" hidden>
        <div class="condition-card">
          <div class="condition-details" id="conditionDetails">
            <label id="manualConditionWrap"><span class="caption">Condizione</span><select id="conditionSelect" aria-label="Condizione da applicare ai falliti"></select></label>
            <label id="conditionSourceWrap"><span class="caption">Fonte</span><select id="conditionSource" aria-label="Fonte della condizione"><option value="">Nessuna fonte</option></select></label>
            <label><span class="caption">Scadenza</span><select id="conditionExpiry" aria-label="Scadenza della condizione"><option value="manual">Manuale</option><option value="rounds">N round</option><option value="turn-start">Inizio turno</option><option value="turn-end">Fine turno</option><option value="concentration">Fine concentrazione</option></select></label>
            <label id="conditionActorWrap"><span class="caption">Turno di</span><select id="conditionActor" aria-label="Turno di bersaglio o fonte"><option value="target">Bersaglio</option><option value="source">Fonte</option></select></label>
            <label id="conditionDurationWrap"><span class="caption">Occorrenze</span><input id="conditionDuration" type="number" min="1" step="1" value="1" inputmode="numeric" /></label>
          </div>
        </div>
      </section>
      <section class="target-section">
        <div class="target-header">
          <div class="target-heading"><span class="caption">Bersagli</span><span class="target-count" id="targetCount">0 selezionati</span></div>
          <div class="target-actions"><input class="target-name-filter" id="targetNameFilter" type="search" placeholder="Cerca nome…" aria-label="Filtra bersagli per nome" /><button class="small faction-toggle" type="button" data-hp-faction="pc" aria-pressed="false">PG</button><button class="small faction-toggle" type="button" data-hp-faction="ally" aria-pressed="false">Alleati</button><button class="small faction-toggle" type="button" data-hp-faction="neutral" aria-pressed="false">Neutrali</button><button class="small faction-toggle" type="button" data-hp-faction="enemy" aria-pressed="false">Nemici</button></div>
        </div>
        <div class="target-list" id="targetList"></div>
        <div class="bulk-panel"><div class="bulk-row"><span class="caption">Imposta selezionati</span><div class="bulk-actions" id="bulkActions"></div></div><div class="status" id="status" role="status"></div></div>
      </section>
      <footer class="footer"><div class="summary" id="summary">Nessun bersaglio selezionato</div><div class="footer-actions"><button class="apply damage" id="apply" type="button" disabled>Applica effetti</button></div></footer>
    </main>
  </div>
  <script type="module" src="/src/quick-hp-modal.js"></script>
</body>
</html>
