<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console HP rapida</title>
  <link rel="stylesheet" href="/popover-glass.css" />
  <style>
    :root{--text:#fff;--muted:rgba(255,255,255,.66);--line:rgba(148,163,184,.2)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    body{color:var(--text);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:12px}
    button,input{font:inherit}.glass-shell{width:100%;height:100%;min-height:0!important;display:flex;overflow:hidden}
    .panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px;overflow:hidden}
    .header,.target-header,.bulk-row,.footer,.target-actions,.bulk-actions,.footer-actions{display:flex;align-items:center}
    .header,.target-header,.bulk-row,.footer{justify-content:space-between;gap:8px}.header{min-height:30px}
    .title{font-size:16px;font-weight:750;letter-spacing:-.01em}
    .close{width:30px;height:30px;padding:0;border:1px solid transparent;border-radius:9px;background:transparent;color:inherit;cursor:pointer}
    .close:hover,.small:hover{background:rgba(255,255,255,.1)}
    .controls{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:8px}
    .mode-group{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border:1px solid var(--line);border-radius:11px;background:rgba(3,7,18,.3)}
    .mode,.factor{min-height:32px;padding:5px 8px;border:1px solid transparent;border-radius:8px;background:transparent;color:rgba(255,255,255,.78);cursor:pointer}
    .mode.active[data-mode=damage]{color:#fecaca;border-color:rgba(248,113,113,.55);background:rgba(185,28,28,.34)}
    .mode.active[data-mode=heal]{color:#bbf7d0;border-color:rgba(74,222,128,.55);background:rgba(21,128,61,.34)}
    .mode.active[data-mode=temp]{color:#bfdbfe;border-color:rgba(96,165,250,.58);background:rgba(29,78,216,.34)}
    .amount-wrap{display:grid;gap:4px}.caption{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
    .amount{width:100%;height:42px;padding:5px 10px;border:1px solid rgba(148,163,184,.28);border-radius:11px;outline:none;background:rgba(0,0,0,.35);color:#fff;font-size:22px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums}
    .amount:focus{border-color:rgba(96,165,250,.7);box-shadow:0 0 0 2px rgba(37,99,235,.18)}
    .target-section{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:7px}.target-actions,.bulk-actions,.footer-actions{gap:5px}
    .small{min-height:27px;padding:4px 9px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.055);color:inherit;cursor:pointer}
    .target-list{flex:1 1 auto;min-height:0;display:grid;align-content:start;gap:5px;padding:6px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;background:rgba(0,0,0,.2);scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.45) transparent}
    .target{display:grid;grid-template-columns:20px minmax(105px,1fr) minmax(104px,auto) minmax(145px,auto);align-items:center;gap:7px;min-height:46px;padding:5px 7px;border:1px solid rgba(148,163,184,.14);border-radius:9px;background:rgba(255,255,255,.025);cursor:pointer}
    .target.selected{border-color:rgba(96,165,250,.62);background:rgba(30,64,175,.24)}.target.disabled{opacity:.46;cursor:default}.target input{accent-color:#2563eb}
    .identity{min-width:0;display:flex;align-items:center;gap:7px}.faction{width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:#94a3b8;box-shadow:0 0 8px currentColor}
    .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.hp-preview{min-width:104px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
    .before{color:var(--muted)}.delta.damage{color:#fca5a5}.delta.heal{color:#86efac}.delta.temp{color:#93c5fd}
    .factor-group{width:100%;display:grid;grid-template-columns:repeat(4,minmax(32px,1fr));gap:4px}.factor{min-width:0;min-height:28px;width:auto;padding:0 5px;border-color:rgba(148,163,184,.18);background:rgba(0,0,0,.2)}
    .factor.active{color:#fff;border-color:rgba(250,204,21,.58);background:rgba(161,98,7,.38)}.empty{padding:20px;text-align:center;color:var(--muted)}
    .bulk-row{flex:0 0 auto}.footer{flex:0 0 auto;min-height:42px;padding-top:9px;border-top:1px solid var(--line)}
    .summary{min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{min-height:16px;color:#bfdbfe}
    .apply{min-width:150px;min-height:36px;padding:7px 14px;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
    .apply.damage{background:#b91c1c}.apply.heal{background:#15803d}.apply.temp{background:#1d4ed8}.apply:disabled,.small:disabled{opacity:.48;cursor:default}.undo{color:#bfdbfe;border-color:rgba(96,165,250,.42)}
    @media(max-width:520px){.controls{grid-template-columns:1fr 94px}.target{grid-template-columns:20px minmax(90px,1fr) auto}.factor-group{grid-column:2/-1;justify-self:stretch}.bulk-row{align-items:flex-start;flex-direction:column}.bulk-actions{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.bulk-actions .small{min-width:0;padding-inline:5px}.hp-preview{min-width:88px}}
  </style>
</head>
<body>
  <div class="glass-shell" data-glass-popover="1"><main class="panel">
    <header class="header"><div class="title">Console HP rapida</div><button class="close" id="close" type="button" title="Chiudi">X</button></header>
    <section class="controls">
      <div class="mode-group" aria-label="Modalita">
        <button class="mode active" data-mode="damage" type="button">Danno</button>
        <button class="mode" data-mode="heal" type="button">Cura</button>
        <button class="mode" data-mode="temp" type="button">HP temp.</button>
      </div>
      <label class="amount-wrap"><span class="caption">Valore</span><input class="amount" id="amount" type="text" inputmode="numeric" pattern="[0-9]*" value="0" autocomplete="off" /></label>
    </section>
    <section class="target-section">
      <div class="target-header"><span class="caption">Bersagli</span><div class="target-actions"><button class="small" id="selectAll" type="button">Tutti</button><button class="small" id="selectNone" type="button">Nessuno</button></div></div>
      <div class="target-list" id="targetList"></div>
      <div class="bulk-row"><span class="caption">Imposta selezionati</span><div class="bulk-actions" id="bulkActions"></div></div>
    </section>
    <div class="status" id="status" role="status"></div>
    <footer class="footer"><div class="summary" id="summary">Nessun bersaglio selezionato</div><div class="footer-actions"><button class="small undo" id="undo" type="button" hidden>Annulla</button><button class="apply damage" id="apply" type="button" disabled>Applica danno</button></div></footer>
  </main></div>
  <script type="module" src="/src/quick-hp-modal.js"></script>
</body>
</html>
