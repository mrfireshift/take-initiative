      .footer{align-items:center;flex-direction:row;min-height:42px;padding-top:9px;gap:8px}.summary{width:auto;flex:1 1 auto;white-space:nowrap;font-size:var(--obrt-type-body)}.footer-actions{width:auto;flex:0 0 auto;gap:5px}.footer-actions .small{min-height:36px;padding:7px 12px;font-size:var(--obrt-type-body)}.apply{min-width:150px;min-height:36px;padding:7px 14px;font-size:var(--obrt-type-body)}
    }
    @media(max-width:520px){.save-options{grid-template-columns:1fr}.condition-card{min-height:0}.condition-details{grid-template-columns:1fr}.condition-details label{border-right:0!important;border-bottom:1px solid rgba(148,163,184,.18)!important}.condition-details label:last-child{border-bottom:0!important}}

    /* Tema condiviso con Spells e Condizioni; la struttura del layout resta invariata. */
    .close{border-radius:9px}
    .mode-group{border-color:var(--line);border-radius:11px;background:var(--surface-row)}
    .amount,.target-name-filter,.spell-search,.condition-details input{background:var(--surface)}
    .save-options,.target-list,.bulk-panel{padding:8px;border:1px solid var(--line);border-radius:11px;background:var(--surface-soft)}
    .save-options{gap:8px}
    .condition-card,.effect-card{padding:8px;border-color:rgba(148,163,184,.14);border-radius:9px;background:var(--surface-row)}
    .condition-card,.effect-card{gap:8px}
    .spell-rule-summary{background:var(--surface-soft)}
    .condition-details{border-color:var(--line);border-radius:11px;background:var(--surface-soft)}
    .condition-details label{border-color:rgba(148,163,184,.14)}
    .target-list{gap:5px}
    .target{padding:6px 8px;border-color:rgba(148,163,184,.14);border-radius:9px;background:var(--surface-row)}
    .target.disabled{background:var(--disabled)}
    .small,.faction-toggle,.bulk-actions .small{border-color:var(--line);border-radius:8px;background:var(--surface)}
    .factor-group,.outcome-group{border-color:var(--line);border-radius:9px;background:var(--surface-soft)}
    .factor,.outcome{border-color:rgba(148,163,184,.18);background:transparent}
    .bulk-panel{padding:0}
    .bulk-row{padding:8px}
    .bulk-panel>.status{padding:8px;border-color:rgba(148,163,184,.14)}
    .footer{gap:8px;border-color:var(--line)}
    .footer-actions{gap:5px}
    .footer-actions .small,.apply{border-radius:9px}
    .apply:disabled,.small:disabled{border-color:rgba(148,163,184,.28);background:var(--disabled);color:rgba(255,255,255,.62);filter:none}
    input:disabled{background:var(--disabled);color:rgba(255,255,255,.62)}
    .area-placement{width:100%;min-height:36px;border-color:rgba(96,165,250,.62);background:#2563eb;font-weight:var(--obrt-weight-bold)}
    .area-placement:hover{background:#1d4ed8}

    /* Effetti ad area: due configurazioni alternative nello stesso spazio. */
    .controls{align-items:end}
    .mode-group{height:62px}
    .save-options{display:grid;grid-template-columns:1fr;gap:8px;padding:0;border:0;border-radius:0;background:transparent}
    .area-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border:1px solid var(--line);border-radius:11px;background:var(--surface-row)}
    .area-tab{min-width:0;min-height:34px;padding:6px 10px;overflow:hidden;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:var(--obrt-weight-bold);letter-spacing:.055em;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
    .area-tab:hover{background:rgba(255,255,255,.06);color:#fff}
    .area-tab.active{border-color:rgba(250,204,21,.5);background:rgba(161,98,7,.28);color:#fde68a}
    .area-tab-panel{display:grid;min-width:0;min-height:84px;align-content:start;gap:8px;padding:10px 12px 12px;border:1px solid rgba(148,163,184,.22);border-radius:12px;background:rgba(15,23,42,.28)}
    .area-tab-panel .caption{font-size:10px;letter-spacing:.055em}
    .area-spell-row{display:flex;align-items:flex-end;gap:8px}
    .area-spell-field,.area-spell-row .select-field,.area-condition-row label{display:grid;min-width:0;gap:6px}
    .area-spell-row .select-field{align-items:stretch;justify-content:stretch}
    .area-spell-field{width:auto;flex:1 1 300px}
    #spellCasterWrap{width:190px;flex:0 0 190px}
    .caster-select-row{display:flex;min-width:0;align-items:center;gap:6px}
    .caster-select-row select{flex:1 1 auto}
    .area-spell-row select,.area-condition-row select,.area-condition-row input{width:100%;min-width:0;min-height:48px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:inherit;outline:none}
    .area-placement{width:auto;height:48px;min-width:150px;min-height:48px;flex:0 1 225px;margin-left:0}
    .area-condition-row{display:grid;grid-template-columns:minmax(190px,1.45fr) minmax(130px,1fr) minmax(120px,.9fr) minmax(105px,.8fr) minmax(90px,.7fr);align-items:end;gap:8px}
    .area-feedback{display:grid;gap:6px}
    .area-condition-row select:disabled,.area-condition-row input:disabled,.area-spell-row select:disabled{background:var(--disabled);color:rgba(255,255,255,.62)}
    .target.save-target{min-height:34px;padding-block:2px}
    @media(max-width:760px){
      .mode-group,.mode,.amount{height:42px;min-height:42px}
      .area-tabs{gap:3px;padding:3px}.area-tab{min-height:30px;padding:5px 8px}
      .area-tab-panel{min-height:78px;padding:7px 9px 9px}
      .area-condition-row{grid-template-columns:minmax(150px,1.4fr) repeat(4,minmax(80px,1fr))}
      .area-spell-row select,.area-condition-row select,.area-condition-row input,.area-placement{height:32px;min-height:32px;padding:4px 7px}
      .area-placement{width:auto;margin-left:0}
      .target.save-target{min-height:32px;padding-block:2px}
    }
    @media(max-width:520px){
      .area-spell-row{display:grid;grid-template-columns:1fr;row-gap:8px}
      .area-condition-row{grid-template-columns:1fr}
      .area-spell-field,#spellCasterWrap{width:100%}
      .area-placement{width:100%;margin-left:0}
    }
    .outcome-group.area-inside-group{grid-template-columns:minmax(0,1fr)}
    .outcome.area-inside{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#bfdbfe;
      border-color:rgba(96,165,250,.58);
      background:rgba(30,64,175,.28);
      box-shadow:inset 0 0 0 1px rgba(96,165,250,.2);
      cursor:default;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="glass-shell" data-glass-popover="1" data-popover-id="com.thebigpicture.initiative/quick-hp-modal"><main class="panel">
    <header class="header"><div class="title">Console effetti ad area</div><button class="close" id="close" type="button" title="Chiudi">X</button></header>
    <section class="controls">
      <div class="mode-group" aria-label="Modalita">
        <button class="mode active" data-mode="damage" type="button">Danno</button>
        <button class="mode" data-mode="heal" type="button">Cura</button>
        <button class="mode" data-mode="temp" type="button">HP temp.</button>
        <button class="mode" data-mode="save" type="button">Effetti ad area</button>
      </div>
      <label class="amount-wrap"><span class="caption">Valore</span><input class="amount" id="amount" type="text" inputmode="numeric" pattern="[0-9]*" value="0" autocomplete="off" /></label>
    </section>
    <section class="save-options" id="saveOptions" hidden>
      <div class="area-tabs" role="tablist" aria-label="Configurazione effetti ad area">
        <button class="area-tab active" id="areaSpellTab" data-area-effect-tab="spell" type="button" role="tab" aria-selected="true" aria-controls="areaSpellPanel">Incantesimo ad area</button>
        <button class="area-tab" id="areaConditionTab" data-area-effect-tab="condition" type="button" role="tab" aria-selected="false" aria-controls="conditionDetails">Condizione su fallimento TS</button>
      </div>
      <section class="area-tab-panel" id="areaSpellPanel" role="tabpanel" aria-labelledby="areaSpellTab">
          <div class="area-spell-row">
            <div class="area-spell-field">
              <span class="caption">Incantesimi</span>
              <label class="select-field">
                <div class="spell-combobox">
                  <input class="spell-search" id="spellSearch" type="text" placeholder="Cerca incantesimo..." role="combobox" aria-autocomplete="list" aria-controls="spellMenu" aria-expanded="false" aria-label="Cerca o seleziona un incantesimo ad area" autocomplete="off" />
                  <button class="spell-menu-toggle obrt-select-caret-toggle" id="spellMenuToggle" type="button" aria-label="Mostra tutti gli incantesimi ad area" aria-controls="spellMenu" aria-expanded="false">▾</button>
                  <div class="spell-menu" id="spellMenu" role="listbox" hidden></div>
                </div>
                <select id="spellSelect" aria-hidden="true" tabindex="-1" hidden><option value="">Configurazione manuale</option></select>
              </label>
            </div>
            <label class="select-field with-caption" id="spellCasterWrap"><span class="caption">Caster</span><span class="caster-select-row"><select id="spellCaster" aria-label="Caster dell'incantesimo"><option value="">Nessun caster</option></select><span class="concentration-badge" id="concentrationNotice" aria-label="Incantesimo a concentrazione" hidden>C</span></span></label>
            <button class="small area-placement" id="areaPlacement" type="button" hidden>Posiziona area</button>
          </div>
          <div class="area-feedback">
            <label class="select-field with-caption" id="spellRuleChoiceWrap" hidden><span class="caption">Effetto / variante</span><select id="spellRuleChoice" aria-label="Effetto o variante dell'incantesimo"></select></label>
            <div class="spell-rule-summary" id="spellRuleSummary" hidden></div>
          </div>
      </section>
      <section class="area-tab-panel" id="conditionDetails" role="tabpanel" aria-labelledby="areaConditionTab" hidden>
          <div class="area-condition-row">
            <label id="manualConditionWrap"><span class="caption">Condizioni</span><select id="conditionSelect" aria-label="Condizione da applicare ai falliti"><option value="">Nessuna condizione</option></select></label>
            <label id="conditionSourceWrap"><span class="caption">Fonte</span><select id="conditionSource" aria-label="Fonte della condizione"><option value="">Nessuna fonte</option></select></label>
            <label id="conditionExpiryWrap"><span class="caption">Scadenza</span><select id="conditionExpiry" aria-label="Scadenza della condizione"><option value="manual">Manuale</option><option value="rounds">N round</option><option value="turn-start">Inizio turno</option><option value="turn-end">Fine turno</option><option value="concentration">Fine concentrazione</option></select></label>
            <label id="conditionActorWrap"><span class="caption">Turno di</span><select id="conditionActor" aria-label="Turno di bersaglio o fonte"><option value="target">Bersaglio</option><option value="source">Fonte</option></select></label>
            <label id="conditionDurationWrap"><span class="caption" id="conditionDurationCaption">Occorrenze</span><input id="conditionDuration" type="number" min="1" step="1" value="1" inputmode="numeric" /></label>
          </div>
      </section>
    </section>
    <section class="target-section">
      <div class="target-header"><div class="target-heading"><span class="caption">Bersagli</span><span class="target-lock" id="targetLock" hidden>Selezione da sagoma <button id="unlockTargets" type="button" title="Consenti la modifica manuale dei bersagli">Sblocca</button></span></div><div class="target-actions"><input class="target-name-filter" id="targetNameFilter" type="search" placeholder="Cerca nome…" aria-label="Filtra bersagli per nome" /><button class="small faction-toggle" type="button" data-hp-faction="pc" aria-pressed="false">PG</button><button class="small faction-toggle" type="button" data-hp-faction="ally" aria-pressed="false">Alleati</button><button class="small faction-toggle" type="button" data-hp-faction="neutral" aria-pressed="false">Neutrali</button><button class="small faction-toggle" type="button" data-hp-faction="enemy" aria-pressed="false">Nemici</button></div></div>
      <div class="target-list" id="targetList"></div>
      <div class="bulk-panel"><div class="bulk-row"><span class="caption">Imposta selezionati</span><div class="bulk-actions" id="bulkActions"></div></div><div class="status" id="status" role="status"></div></div>
    </section>
    <footer class="footer"><div class="summary" id="summary">Nessun bersaglio selezionato</div><div class="footer-actions"><button class="small undo" id="undo" type="button" hidden>Annulla</button><button class="apply damage" id="apply" type="button" disabled>Applica danno</button></div></footer>
  </main></div>
  <script type="module" src="/src/popoverDrag.js"></script>
  <script type="module" src="/src/quick-hp-modal.js"></script>
</body>
</html>
