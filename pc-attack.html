<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attacco</title>
  <link rel="stylesheet" href="/ui-typography.css" />
  <link rel="stylesheet" href="/popover-glass.css" />
  <link rel="stylesheet" href="/console-shell.css" />
  <link rel="stylesheet" href="/rules-text.css" />
  <style>
    /* The action costs' colours (Baldur's Gate 3); the console's other colour names are console-shell.css's. */
    :root {
      --cost-action: #4ade80;
      --cost-bonus: #fb923c;
      --cost-reaction: #c084fc;
    }
    .glass-shell { position: relative; }
    /* The header says who acts, on one line: what it does is under the picker. */
    .header { min-height: 36px; padding-top: var(--obrt-space-xs); padding-bottom: var(--obrt-space-xs); padding-left: var(--obrt-space-lg); }
    /* The actor's name; an amber pill when it acts on another's turn. */
    .title-row { min-width: 0; display: flex; align-items: center; gap: 6px; }
    .turn-badge { flex: 0 0 auto; padding: 1px 6px; border: 1px solid rgba(253, 230, 138, .42); border-radius: var(--obrt-radius-pill); background: rgba(161, 98, 7, .30); color: var(--warn-text); font-size: var(--obrt-type-caption); font-weight: var(--obrt-weight-semibold); }
    /* The menu of the header's ⋯: the turn auto-open (pcAttackTurnController.js), local to this browser. */
    .more-menu { position: absolute; z-index: 20; top: 38px; right: var(--obrt-space-xl); width: 220px; display: grid; gap: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); box-shadow: 0 12px 28px rgba(0, 0, 0, .45); }
    .more-title { margin: 0; font-size: var(--obrt-type-secondary); font-weight: var(--obrt-weight-semibold); }
    .more-option { display: flex; align-items: center; gap: 6px; min-height: var(--obrt-hit-min); cursor: pointer; }
    .more-option input { width: 15px; height: 15px; margin: 0; accent-color: var(--obrt-accent); cursor: pointer; }
    .more-hint { margin: 0; color: var(--muted); font-size: var(--obrt-type-secondary); line-height: 1.3; text-wrap: pretty; }
    /* Under the header, only when there is somewhere to go: back to the turn's creature, on to the one selected on the map.
       One line: a long name is cut, and the button's tooltip says it in full. Only the bar of a turn that moved takes a line of its own. */
    .switch-row { flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 5px var(--obrt-space-xl); border-bottom: 1px solid var(--line); }
    .switch-row:not(:has(> :not([hidden]))) { display: none; }
    .switch-row:has(> .follow-bar:not([hidden]):not([data-kind="off"])) { flex-wrap: wrap; }
    .switch-row .small { min-width: 0; min-height: var(--obrt-hit-min); overflow: hidden; padding: 2px 8px; color: var(--info-text); font-size: var(--obrt-type-secondary); text-overflow: ellipsis; white-space: nowrap; }
    /* The header drags the console: six dots say so. */
    .drag-grip { flex: 0 0 auto; order: -1; width: 8px; height: 16px; margin-right: 2px; opacity: .45; background-image: radial-gradient(circle, #fff 1px, transparent 1.4px); background-size: 4px 4px; }
    .header:hover .drag-grip { opacity: .75; }
    /* Riduci: only the header stays. */
    body[data-minimized="true"] .panel, body[data-minimized="true"] .more-menu, body[data-minimized="true"] .switch-row, body[data-minimized="true"] .reaction-row, body[data-minimized="true"] .apply-row, body[data-minimized="true"] .status-bar { display: none !important; }
    /* An off-turn action with the creature selected on the map. */
    .use-selected-row { display: flex; min-width: 0; }
    .use-selected { min-width: 0; overflow: hidden; border-color: rgba(96, 165, 250, .45); text-overflow: ellipsis; }
    /* What the action is: under the picker, in full (it wraps, it is never cut). */
    .action-facts { margin: 0; color: var(--muted); font-size: var(--obrt-type-secondary); font-variant-numeric: tabular-nums; line-height: 1.3; text-wrap: pretty; }
    .action-facts:empty { display: none; }
    .picker:not([hidden]) + .action-facts { margin-top: -4px; }
    #pc-attack-multiattack { margin-top: -4px; line-height: 1.3; text-wrap: pretty; }
    /* One scroll: the console's view fills the panel, and in the spells and features tabs the list takes the height left. */
    .panel { display: flex; flex-direction: column; }
    .panel > .view { flex: 1 1 auto; min-height: 0; }
    .muted { margin: 0; color: var(--muted); font-size: var(--obrt-type-secondary); }
    /* Sections: a card for the target and one for the damage (weapon, then the extras below a rule). */
    .card { display: grid; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--obrt-radius-lg); background: var(--surface-soft); }
    .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .card-note { color: var(--muted); font-size: var(--obrt-type-caption); }
    .block { display: grid; gap: 6px; }
    /* The target card: its caption beside the select, on one line; the area, hint and Quivering Palm below, full width. */
    .target-card { grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: var(--obrt-space-md); }
    .target-card > :not(.caption):not(.target-select) { grid-column: 1 / -1; }
    /* «Creature colpite» has no menu beside it: it takes its line, and «Tiro» with its menu keeps the next one. */
    .target-card > .caption:has(+ .target-select[hidden]) { grid-column: 1 / -1; }
    .target-select { width: 100%; min-height: var(--obrt-h-control-md); padding: 3px 6px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); }
    .hint { margin: 0; color: var(--warn-text); font-size: var(--obrt-type-secondary); }
    /* Mirror Image on the target: the d20 to aim at a duplicate, and the button that destroys one. */
    .mirror-image { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; border: 1px solid rgba(167, 139, 250, .5); border-radius: var(--obrt-radius-md); background: rgba(124, 58, 237, .16); }
    .mirror-image[hidden] { display: none; }
    .mirror-image-note { margin: 0; min-width: 0; font-size: var(--obrt-type-secondary); line-height: 1.35; }
    .mirror-image .mini-button { flex: 0 0 auto; }
    /* CAP-REACTION: the target's Sanctuary, the retaliation of its shield and the reactions it can still cast. */
    .attack-reactions { display: grid; gap: 4px; }
    .attack-reactions[hidden] { display: none; }
    .attack-reaction { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1px solid rgba(251, 146, 60, .45); border-radius: var(--obrt-radius-md); background: rgba(194, 65, 12, .14); }
    .attack-reaction-note { margin: 0; flex: 1 1 auto; min-width: 0; font-size: var(--obrt-type-secondary); line-height: 1.35; }
    .attack-reactions > .attack-reaction-note { padding: 5px 8px; border: 1px solid rgba(96, 165, 250, .45); border-radius: var(--obrt-radius-md); background: rgba(37, 99, 235, .14); }
    .attack-reaction-amount { flex: 0 0 52px; width: 52px; min-height: 24px; padding: 2px 4px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); color: inherit; }
    .attack-reaction .mini-button { flex: 0 0 auto; }
    /* The picker: weapon attacks, cantrips and attack spells of the actor, one tab each, then the entry. */
    .picker { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }
    /* The list gives way down to its 132 px, never under the card below it: the tabs, the search and that much stay. */
    .picker:has(> .picker-list:not([hidden])) { flex: 0 1 auto; min-height: calc(var(--obrt-h-control-md) + 2px + 6px + 132px); }
    .picker:has(> .picker-list:not([hidden])):has(> .picker-search:not([hidden])) { min-height: calc(var(--obrt-h-control-md) + var(--obrt-h-control-sm) + 4px + 12px + 132px); }
    /* Only the list gives way: the tabs (overflow hidden) would otherwise shrink to nothing. */
    .picker > :not(.picker-list) { flex: 0 0 auto; }
    .picker-tabs button[aria-pressed="true"] { color: #fff; background: rgba(37, 99, 235, .38); }
    /* The spells tab: a list by level instead of a select (every spell in view, one click each). */
    .picker-list { flex: 0 1 auto; min-height: 132px; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 2px; overflow-y: auto; padding: 4px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
    .picker-level { padding: 4px 6px 2px; color: var(--muted); font-size: var(--obrt-type-caption); font-weight: var(--obrt-weight-bold); letter-spacing: var(--obrt-tracking-wide); text-transform: uppercase; }
    .picker-row { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 26px; padding: 3px 8px; border: 1px solid transparent; border-radius: var(--obrt-radius-md); background: transparent; text-align: left; cursor: pointer; }
    .picker-row:hover { background: var(--obrt-hover); }
    .picker-row[aria-pressed="true"] { border-color: rgba(96, 165, 250, .55); background: rgba(37, 99, 235, .28); }
    .picker-row:disabled { cursor: default; opacity: .6; }
    /* The attacks' and cantrips' dropdown: the entry in use with its cost on the right; its menu, the list's rows. */
    .picker-dropdown { position: relative; }
    .picker-dropdown-button { width: 100%; display: flex; align-items: center; gap: 8px; min-height: var(--obrt-h-control-md); padding: 0 10px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); text-align: left; cursor: pointer; }
    .picker-dropdown-button .picker-row-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .picker-dropdown-button[aria-expanded="true"] { border-color: rgba(96, 165, 250, .7); }
    .picker-dropdown-button:disabled { cursor: default; opacity: .6; }
    .picker-dropdown-caret { flex: 0 0 auto; width: 12px; height: 8px; background: var(--obrt-select-caret-image) no-repeat center / 12px 8px; }
    .picker-menu { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; max-height: 264px; overflow-y: auto; padding: 4px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); box-shadow: 0 12px 28px rgba(0, 0, 0, .45); }
    .picker-search { width: 100%; min-height: var(--obrt-h-control-sm); padding: 4px var(--obrt-space-md); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); outline: none; background: var(--surface); font-size: var(--obrt-type-secondary); }
    .picker-search:focus { border-color: rgba(96, 165, 250, .7); }
    /* The features to read, folded under their header (the number of entries, an arrow that turns when open). */
    .picker-level[data-count] { display: flex; justify-content: space-between; gap: 8px; cursor: pointer; border-radius: var(--obrt-radius-sm); }
    .picker-level[data-count]:hover { color: var(--text); }
    .picker-level[data-count]::after { content: attr(data-count) " ▸"; letter-spacing: 0; font-variant-numeric: tabular-nums; }
    .picker-level[data-count][data-open="true"]::after { content: attr(data-count) " ▾"; }
    .picker-level[data-count]:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
    /* No use or slot left: the row fades, its uses turn red (Boss Actions' exhausted badge). */
    .picker-row[data-exhausted="true"] { opacity: .62; }
    .picker-row-tags .tag-sep { margin: 0 4px; color: var(--dim); }
    .uses-badge { padding: 0 6px; border: 1px solid var(--line); border-radius: var(--obrt-radius-pill); color: var(--info-text); font-weight: var(--obrt-weight-semibold); font-variant-numeric: tabular-nums; }
    .uses-badge[data-zero="true"] { border-color: rgba(239, 68, 68, .45); color: #fecaca; }
    /* A spell level's slots, on the right of its header (data-slots, red when none is left). */
    .picker-level[data-slots] { display: flex; justify-content: space-between; gap: 8px; }
    .picker-level[data-slots]::after { content: attr(data-slots); letter-spacing: 0; text-transform: none; font-weight: var(--obrt-weight-semibold); font-variant-numeric: tabular-nums; color: var(--muted); }
    .picker-level[data-slots-zero="true"]::after { color: #fca5a5; }
    .picker-row-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .picker-row-tags { flex: 0 0 auto; color: var(--muted); font-size: var(--obrt-type-caption); }
    /* Action costs, as in Baldur's Gate 3: Azione green (circle), Azione bonus orange (triangle), Reazione purple
       (diamond), on the list rows, the feature's pill and the fixed row. */
    .cost-tag[data-cost] { font-weight: var(--obrt-weight-bold); white-space: nowrap; }
    .cost-tag[data-cost]::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 4px; vertical-align: 1px; background: currentColor; }
    .cost-tag[data-cost="action"] { color: var(--cost-action); }
    .cost-tag[data-cost="action"]::before { border-radius: 50%; }
    .cost-tag[data-cost="bonus"] { color: var(--cost-bonus); }
    .cost-tag[data-cost="bonus"]::before { width: 8px; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    .cost-tag[data-cost="reaction"] { color: var(--cost-reaction); }
    .cost-tag[data-cost="reaction"]::before { width: 6px; height: 6px; transform: rotate(45deg); }
    .launch-tag.cost-tag[data-cost] { border-color: color-mix(in srgb, currentColor 45%, transparent); background: color-mix(in srgb, currentColor 12%, transparent); }
    /* Cantrips and spells: the slots left and the concentration in progress; a spell the console does not resolve. */
    .caster-state { display: flex; flex-wrap: wrap; gap: 2px 10px; margin: 0; color: var(--muted); font-size: var(--obrt-type-secondary); font-variant-numeric: tabular-nums; }
    .caster-state .concentrating { color: var(--warn-text); }
    /* A long text (Forma Selvatica's details) scrolls inside its card instead of covering the list above it. */
    .launch { gap: 8px; overflow-y: auto; align-content: start; }
    /* A feature's form (the character sheet's inputs): a label over its select or number. */
    .feature-field { display: grid; gap: 3px; }
    .feature-field-label { color: var(--muted); font-size: var(--obrt-type-caption); font-weight: var(--obrt-weight-semibold); }
    .feature-field-hint { color: var(--muted); font-size: var(--obrt-type-caption); }
    .feature-field .inline-select { height: 26px; }
    .feature-field .field { height: 26px; }
    /* Who a feature acting on the map selection reaches ("Su:"), in yellow when a creature must be selected first. */
    .feature-target { display: flex; align-items: baseline; gap: 8px; margin: 0; padding: 5px 8px; border: 1px solid rgba(96, 165, 250, .35); border-radius: var(--obrt-radius-md); background: rgba(30, 64, 175, .18); }
    .feature-target-text { min-width: 0; font-weight: var(--obrt-weight-semibold); overflow-wrap: anywhere; }
    .feature-target[data-warning="true"] { border-color: rgba(253, 230, 138, .45); background: rgba(161, 98, 7, .18); }
    .feature-target[data-warning="true"] .feature-target-text { color: var(--warn-text); font-weight: var(--obrt-weight-regular); }
    .feature-check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .feature-check input { width: 14px; height: 14px; margin: 0; accent-color: var(--obrt-accent); }
    /* The spell's details: an accordion with its facts and its text; Lancia stays in the fixed row below. */
    .spell-details { border-top: 1px solid var(--line); padding-top: 4px; }
    .spell-details summary { cursor: pointer; color: var(--muted); font-size: var(--obrt-type-secondary); font-weight: var(--obrt-weight-semibold); user-select: none; }
    .spell-details summary:hover { color: var(--text); }
    .spell-details[open] summary { margin-bottom: 6px; }
    .spell-details, .spell-details-body { display: grid; gap: 6px; }
    .spell-text { margin: 0; font-size: var(--obrt-type-secondary); line-height: 1.4; white-space: pre-line; }
    .spell-rules { font-size: var(--obrt-type-secondary); line-height: 1.4; }
    /* The turn moved on while an attack is in progress: the console waits for the GM (pcAttackTurnController.js). */
    .follow-bar { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; padding: 6px 10px; border: 1px solid rgba(253, 230, 138, .45); border-radius: var(--obrt-radius-lg); background: rgba(161, 98, 7, .18); color: var(--warn-text); font-size: var(--obrt-type-secondary); }
    /* A long name sends the button to the next line, instead of squeezing the sentence into a column. */
    .follow-bar > span { flex: 1 1 110px; min-width: 0; text-wrap: pretty; }
    .follow-bar > button { flex: 0 1 auto; max-width: 100%; margin-left: auto; }
    /* Off turn only its button: the pill in the header says the rest. */
    .follow-bar[data-kind="off"] { flex: 0 1 auto; flex-wrap: nowrap; min-width: 0; padding: 0; border: 0; border-radius: 0; background: none; }
    .follow-bar.ready { border-color: rgba(96, 165, 250, .55); background: rgba(37, 99, 235, .22); color: var(--info-text); }
    .follow-bar .follow-ready { min-width: 0; min-height: 30px; overflow: hidden; padding: 4px 12px; text-overflow: ellipsis; white-space: nowrap; }
    .launch-meta { display: flex; flex-wrap: wrap; gap: 4px; }
    .launch-tag { padding: 1px 7px; border: 1px solid var(--line); border-radius: var(--obrt-radius-pill); color: var(--muted); font-size: var(--obrt-type-caption); }
    .launch-tag.warning { border-color: rgba(253, 230, 138, .45); color: var(--warn-text); }
    .launch-details { margin: 0; color: var(--muted); font-size: var(--obrt-type-secondary); }
    .launch-note { margin: 0; font-size: var(--obrt-type-secondary); line-height: 1.35; }
    .launch-note.warning { color: var(--warn-text); }
    .launch .apply { justify-self: end; }
    /* The damage card: the cantrip or spell controls, the damage rows and extras, then the notes and Dettagli at the bottom
       (the cantrip row's children join the card's grid to be ordered). */
    .cantrip-row { display: contents; }
    #pc-attack-damage { order: 1; }
    #pc-attack-extras-section { order: 2; }
    .cantrip-note { order: 4; }
    #pc-attack-spell-details { order: 5; }
    .cantrip-note { margin: 0; color: var(--muted); font-size: var(--obrt-type-caption); line-height: 1.3; }
    /* A monster's note: the part of its action the table resolves by hand. */
    .monster-note { margin: 0; color: var(--muted); font-size: var(--obrt-type-caption); line-height: 1.3; }
    .spell-controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .segmented button[aria-pressed="true"][data-outcome=critical] { color: var(--warn-text); background: rgba(161, 98, 7, .45); }
    /* One grid for every damage row (weapon, rider, added component): a lead column (checkbox or remove),
       the name with its secondary line (dice, type, options), the amount always in the same right column. */
    .component-list { display: grid; gap: 4px; }
    .component-list:empty { display: none; }
    .component-row { display: grid; grid-template-columns: var(--obrt-hit-min) minmax(0, 1fr) 72px; column-gap: 8px; align-items: start; }
    .component-lead { width: var(--obrt-hit-min); height: var(--obrt-hit-min); display: flex; align-items: center; justify-content: center; border-radius: var(--obrt-radius-sm); }
    label.component-lead { cursor: pointer; }
    label.component-lead:hover { background: var(--obrt-hover); }
    .component-lead input[type=checkbox] { width: 15px; height: 15px; margin: 0; accent-color: var(--obrt-accent); cursor: pointer; }
    .component-body { min-width: 0; display: grid; gap: 0; }
    .component-title { min-height: 24px; display: flex; align-items: center; font-weight: var(--obrt-weight-semibold); line-height: 1.2; overflow-wrap: anywhere; }
    .component-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; color: var(--muted); font-size: var(--obrt-type-secondary); font-variant-numeric: tabular-nums; line-height: 1.25; }
    .component-meta .separator { color: var(--dim); }
    .component-reason { color: var(--warn-text); font-size: var(--obrt-type-caption); }
    .component-reason:empty { display: none; }
    .component-row[data-unavailable="true"] .component-title, .component-row[data-unavailable="true"] .component-meta { opacity: .5; }
    .component-options { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 3px; color: var(--muted); font-size: var(--obrt-type-secondary); }
    .option-check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .option-check input { width: 14px; height: 14px; margin: 0; accent-color: var(--obrt-accent); }
    .amount::placeholder { color: rgba(255, 255, 255, .42); font-weight: var(--obrt-weight-regular); }
    .amount { width: 72px; height: 26px; padding: 2px 6px; border: 1px solid rgba(148, 163, 184, .28); border-radius: var(--obrt-radius-md); outline: none; background: var(--surface); font-weight: var(--obrt-weight-bold); text-align: center; font-variant-numeric: tabular-nums; }
    .amount:focus, .field:focus { border-color: rgba(96, 165, 250, .7); }
    .amount:disabled { opacity: .45; }
    .inline-select { height: var(--obrt-hit-min); padding: 0 4px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); font-size: var(--obrt-type-secondary); }
    .extras-section { display: grid; gap: 4px; padding-top: 6px; border-top: 1px solid var(--line); }
    /* No damage above it: nothing to separate. */
    .extras-section[data-bare="true"] { padding-top: 0; border-top: 0; }
    /* Below the section's title: what these rows share, in plain words. */
    .subcaption { margin-top: 2px; color: var(--muted); font-size: var(--obrt-type-secondary); font-weight: var(--obrt-weight-semibold); }
    /* An activation's save: the same colours as the outcome buttons, at the height of the inline selects. */
    .segmented.mini { display: inline-grid; grid-auto-columns: max-content; }
    .segmented.mini button { min-height: var(--obrt-hit-min); padding: 0 8px; font-size: var(--obrt-type-secondary); }
    .effect-hint { color: var(--muted); }
    .subcaption-detail { font-weight: var(--obrt-weight-regular); }
    /* Inspiring Smite: one line per creature that receives temporary hit points, on the damage rows' grid: remove in the
       lead column, the creature in the body, its amount under the total. The list spans the whole row (lead + gap on the
       left, gap + amount on the right). */
    .temp-hp-list { grid-column: 1 / -1; display: grid; gap: 4px; margin-top: 4px; }
    .temp-hp-row { display: grid; grid-template-columns: var(--obrt-hit-min) minmax(0, 1fr) 72px; column-gap: 8px; align-items: center; }
    .temp-hp-row .inline-select { min-width: 0; height: 26px; }
    .temp-hp-add { justify-self: start; margin-left: 32px; padding: 2px 8px; border: 1px dashed rgba(148, 163, 184, .35); border-radius: var(--obrt-radius-md); background: transparent; color: var(--info-text); font-size: var(--obrt-type-secondary); cursor: pointer; }
    .temp-hp-add:disabled { opacity: .45; cursor: default; }
    /* Area attacks: the creatures hit, each with its save (one row each: tick, name and HP, outcome). */
    .area { display: grid; gap: 4px; }
    /* The note on its own line, the tools below it. */
    .area-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
    .area-note { flex: 1 1 100%; min-width: 0; color: var(--muted); font-size: var(--obrt-type-secondary); line-height: var(--obrt-leading-normal); }
    .area-tools { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 4px; }
    .mini-button { height: var(--obrt-hit-min); padding: 0 8px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); font-size: var(--obrt-type-secondary); cursor: pointer; }
    .mini-button:disabled { opacity: .45; cursor: default; }
    .area-list { display: grid; gap: 2px; }
    .area-row { display: grid; grid-template-columns: var(--obrt-hit-min) minmax(0, 1fr) auto; column-gap: 8px; align-items: center; min-height: 26px; }
    .area-row .component-lead input { width: 15px; height: 15px; margin: 0; accent-color: var(--obrt-accent); cursor: pointer; }
    .area-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .area-hp { color: var(--muted); font-size: var(--obrt-type-secondary); font-variant-numeric: tabular-nums; }
    .area-row[data-on="false"] .area-name, .area-row[data-on="false"] .area-hp { opacity: .7; }
    /* What the creature takes and why, under its name and its outcome. */
    .area-damage { grid-column: 2 / -1; color: var(--info-text); font-size: var(--obrt-type-secondary); font-variant-numeric: tabular-nums; line-height: 1.3; }
    .area-damage[hidden] { display: none; }
    .area-damage strong { color: #fca5a5; }
    .burst-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; width: 100%; }
    .burst-list .option-check { min-width: 0; }
    .burst-list .option-check span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Quivering Palm: ending the vibrations of the target, below the target picker. */
    .palm { display: grid; gap: 4px; padding-top: 6px; border-top: 1px solid var(--line); }
    .palm-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .palm-title { font-weight: var(--obrt-weight-semibold); }
    .palm-row { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
    /* Grapple and Shove: the contest's card in place of the attack form; the grapples in progress above it. */
    .maneuver { display: grid; gap: 6px; }
    .maneuver[hidden] { display: none; }
    .maneuver-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-top: 4px; }
    .grapple { display: grid; gap: 4px; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); }
    .grapple[hidden] { display: none; }
    .grapple-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .grapple-row .mini-button { flex: 0 0 auto; white-space: nowrap; }
    .grapple-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--obrt-type-secondary); }
    .extra-fields { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 6px; }
    .field { height: 26px; min-width: 0; padding: 2px 6px; border: 1px solid rgba(148, 163, 184, .28); border-radius: var(--obrt-radius-md); outline: none; background: var(--surface); font-size: var(--obrt-type-secondary); }
    .lead-remove { width: var(--obrt-hit-min); height: var(--obrt-hit-min); padding: 0; border: 0; border-radius: var(--obrt-radius-sm); background: transparent; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; }
    .lead-remove:hover { background: var(--obrt-hover); color: #fff; }
    .add-extra { justify-self: start; margin-left: 32px; padding: 4px 10px; border: 1px dashed rgba(148, 163, 184, .35); border-radius: var(--obrt-radius-md); background: transparent; color: var(--info-text); font-size: var(--obrt-type-secondary); cursor: pointer; }
    .add-extra:hover { background: var(--obrt-hover); }
    .add-extra:disabled { opacity: .45; cursor: default; }
    .defense-chips:empty { display: none; }
    .defense-chip { min-height: var(--obrt-hit-min); }
    .defense-note { align-self: center; padding: 0 6px; color: var(--info-text); font-size: var(--obrt-type-caption); font-weight: var(--obrt-weight-semibold); }
    /* Total and Registra stay in view whatever the number of extras: outside the scrolling panel. So do the defenses, on a
       line of their own above the total they explain. */
    .apply-row { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: var(--obrt-space-md); padding: 8px var(--obrt-space-xl); border-top: 1px solid var(--line); background: rgba(15, 23, 42, .32); }
    .apply-row[hidden] { display: none; }
    .apply-row .defense-chips { flex: 1 0 100%; }
    .reaction-row { flex: 0 0 auto; display: flex; align-items: center; padding: 6px var(--obrt-space-xl) 0; border-top: 1px solid var(--line); background: rgba(15, 23, 42, .32); color: var(--muted); font-size: var(--obrt-type-secondary); }
    .reaction-row[hidden] { display: none; }
    .reaction-row:not([hidden]) + .apply-row { border-top: 0; }
    .reaction-toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .reaction-toggle input { width: 14px; height: 14px; margin: 0; accent-color: var(--obrt-accent); cursor: pointer; }
    .reaction-warning { color: var(--warn-text); }
    /* At most two lines beside the button, so the fixed row keeps its height. No basis: a long message stays beside the
       button instead of pushing it to a line of its own. */
    .total { flex: 1 1 0; min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
    .total[data-kind="warning"] { color: var(--warn-text); }
    .apply.primary:not(:disabled) { background: var(--obrt-btn-primary-bg); }
    .apply.primary:hover:not(:disabled) { background: var(--obrt-btn-primary-bg-hover); }
    .status-bar { min-height: 40px; }
    /* Nothing to say, nothing to undo: no bar, and the panel keeps its height. */
    .status:empty::before { content: none; }
    .status-bar:has(.status:empty):has(#pc-attack-undo[hidden]) { display: none; }
    /* The message's kind (setStatus): done, nothing done, failed; an icon before the same text. */
    .status[data-kind="ok"] { color: #bbf7d0; }
    .status[data-kind="warn"] { color: var(--warn-text); }
    .status[data-kind="error"] { color: #fecaca; }
    .status[data-kind="ok"]::before, .status[data-kind="warn"]::before, .status[data-kind="error"]::before { display: inline-grid; place-items: center; width: 14px; height: 14px; margin-right: 6px; border-radius: 50%; color: #fff; font-size: 9px; font-weight: var(--obrt-weight-heavy); vertical-align: 1px; }
    .status[data-kind="ok"]::before { content: "✓"; background: rgba(21, 128, 61, .6); }
    .status[data-kind="warn"]::before { content: "!"; background: rgba(161, 98, 7, .7); }
    .status[data-kind="error"]::before { content: "✕"; background: rgba(185, 28, 28, .7); }
  </style>
</head>
<body>
  <div class="glass-shell" data-glass-popover="1" data-popover-id="com.thebigpicture.initiative/pc-attack">
    <header class="header" data-drag-handle draggable="true" title="Trascina per spostare">
      <div class="header-text"><div class="title-row"><h1 class="title" id="pc-attack-title">Attacco</h1><span class="turn-badge" id="pc-attack-turn" hidden></span></div></div>
      <span class="drag-grip" aria-hidden="true"></span>
      <span id="pc-attack-auto-open-row" hidden><button class="icon-button" id="pc-attack-more" type="button" title="Altre opzioni" aria-label="Altre opzioni" aria-haspopup="true" aria-expanded="false">⋯</button></span>
      <button class="icon-button" id="pc-attack-minimize" type="button" title="Riduci" aria-label="Riduci" aria-expanded="true">&minus;</button>
      <button class="icon-button" id="pc-attack-close" type="button" title="Chiudi" aria-label="Chiudi">&times;</button>
    </header>
    <div class="more-menu" id="pc-attack-more-menu" role="group" aria-label="Apri da sola a ogni turno" hidden>
      <p class="more-title">Apri da sola a ogni turno</p>
      <label class="more-option" title="A ogni turno di un personaggio o alleato con attacchi"><input type="checkbox" id="pc-attack-auto-open" /><span>Personaggi e alleati</span></label>
      <label class="more-option" title="A ogni turno di un mostro con attacchi; ai boss si apre la console Boss"><input type="checkbox" id="pc-attack-auto-open-monsters" /><span>Mostri</span></label>
      <p class="more-hint">Ai boss si apre la console Boss. Vale solo in questo browser.</p>
    </div>
    <div class="switch-row" id="pc-attack-switch-row">
      <div class="follow-bar" id="pc-attack-follow" role="status" hidden></div>
      <div class="use-selected-row" id="pc-attack-use-selected-row" hidden><button class="small use-selected" id="pc-attack-use-selected" type="button" hidden>⇄ Agisci</button></div>
    </div>
    <main class="panel">
      <section class="view" id="pc-attack-form" aria-label="Attacco" hidden>
        <section class="picker" id="pc-attack-picker" aria-label="Scelta dell'attacco" hidden>
          <div class="segmented picker-tabs" id="pc-attack-picker-tabs" role="group" aria-label="Tipo di attacco"></div>
          <div class="picker-dropdown" id="pc-attack-picker-dropdown" hidden>
            <button class="picker-dropdown-button" id="pc-attack-picker-dropdown-button" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Attacco"></button>
            <div class="picker-menu" id="pc-attack-picker-menu" role="group" aria-label="Attacchi" hidden></div>
          </div>
          <select class="target-select" id="pc-attack-picker-select" aria-label="Attacco"></select>
          <input class="picker-search" id="pc-attack-picker-search" type="search" autocomplete="off" spellcheck="false" aria-label="Cerca nell'elenco" hidden />
          <div class="picker-list" id="pc-attack-picker-list" role="group" aria-label="Incantesimi" hidden></div>
        </section>
        <p class="action-facts" id="pc-attack-subtitle"></p>
        <p class="caster-state" id="pc-attack-caster" hidden></p>
        <p class="caster-state" id="pc-attack-multiattack" hidden></p>
        <section class="grapple" id="pc-attack-grapple" aria-label="Presa" hidden></section>
        <section class="card launch" id="pc-attack-launch" aria-label="Incantesimo" hidden></section>
        <section class="card maneuver" id="pc-attack-maneuver" aria-label="Manovra" hidden>
          <span class="caption">Bersaglio</span>
          <select class="target-select" id="pc-attack-maneuver-target" aria-label="Bersaglio della manovra"></select>
          <p class="hint" id="pc-attack-maneuver-hint" hidden></p>
          <div class="segmented" id="pc-attack-maneuver-effects" role="group" aria-label="Effetto della spinta" hidden></div>
          <div class="maneuver-head"><span class="caption">Prova contrapposta</span><span class="card-note" id="pc-attack-maneuver-contest"></span></div>
          <div class="segmented" id="pc-attack-maneuver-outcomes" role="group" aria-label="Esito della prova contrapposta"></div>
          <p class="launch-note" id="pc-attack-maneuver-note"></p>
        </section>
        <div class="view" id="pc-attack-attack-view">
        <section class="card target-card" aria-label="Bersaglio">
          <span class="caption" id="pc-attack-target-caption">Bersaglio</span>
          <select class="target-select" id="pc-attack-target" aria-label="Bersaglio"></select>
          <span class="caption" id="pc-attack-mode-caption" hidden>Tiro</span>
          <select class="target-select" id="pc-attack-mode" aria-label="Tiro" hidden></select>
          <div class="area" id="pc-attack-area" hidden>
            <div class="area-head">
              <span class="area-note" id="pc-attack-area-note"></span>
              <span class="area-tools">
                <button class="mini-button" id="pc-attack-area-propose" type="button" title="Riprendi le creature vicine dalla mappa">Proponi</button>
                <button class="mini-button" id="pc-attack-area-draw" type="button" title="Disegna l'area sulla mappa: le creature al suo interno vengono spuntate" hidden>Disegna</button>
                <button class="mini-button" id="pc-attack-area-all-failed" type="button">Tutti falliti</button>
                <button class="mini-button" id="pc-attack-area-all-passed" type="button">Tutti superati</button>
              </span>
            </div>
            <div class="area-list" id="pc-attack-area-list"></div>
          </div>
          <p class="hint" id="pc-attack-target-hint" hidden></p>
          <div class="mirror-image" id="pc-attack-mirror-image" hidden>
            <p class="mirror-image-note" id="pc-attack-mirror-image-note"></p>
            <button class="mini-button" id="pc-attack-mirror-image-hit" type="button">Duplicato colpito</button>
          </div>
          <div class="attack-reactions" id="pc-attack-reactions" hidden></div>
          <div class="palm" id="pc-attack-palm" hidden>
            <div class="palm-head"><span class="palm-title">Palmo Tremante</span><span class="card-note" id="pc-attack-palm-note"></span></div>
            <div class="segmented mini" id="pc-attack-palm-outcomes" role="group" aria-label="Fine delle vibrazioni"></div>
            <div class="palm-row">
              <input class="amount" id="pc-attack-palm-amount" type="number" min="0" step="1" inputmode="numeric" aria-label="Danni necrotici (10d10)" hidden />
              <button class="small" id="pc-attack-palm-apply" type="button">Termina le vibrazioni</button>
            </div>
          </div>
        </section>
        <section class="block" aria-label="Esito" id="pc-attack-outcome-block">
          <div class="segmented" id="pc-attack-outcomes" role="group" aria-label="Esito dell'attacco"></div>
        </section>
        <section class="card" aria-label="Danno">
          <div class="card-head" id="pc-attack-damage-head"><span class="caption">Danno</span></div>
          <div class="cantrip-row" id="pc-attack-cantrip-row" hidden>
            <select class="target-select" id="pc-attack-cantrip" aria-label="Trucchetto"></select>
            <div class="spell-controls" id="pc-attack-spell-controls" hidden></div>
            <p class="cantrip-note" id="pc-attack-cantrip-note" hidden></p>
            <details class="spell-details" id="pc-attack-spell-details" hidden><summary>Dettagli</summary><div class="spell-details-body" id="pc-attack-spell-details-body"></div></details>
          </div>
          <div class="component-list" id="pc-attack-damage"></div>
          <p class="monster-note" id="pc-attack-monster-note" hidden></p>
          <div class="extras-section" id="pc-attack-extras-section" hidden>
            <span class="caption" id="pc-attack-extras-caption">Extra al colpo</span>
            <div class="component-list" id="pc-attack-woven"></div>
            <div class="component-list" id="pc-attack-riders"></div>
            <span class="subcaption" id="pc-attack-activations-caption" hidden>Attivazioni</span>
            <div class="component-list" id="pc-attack-activations"></div>
            <div class="component-list" id="pc-attack-extras"></div>
            <button class="add-extra" id="pc-attack-add-extra" type="button">+ Danno extra</button>
          </div>
        </section>
        </div>
      </section>
    </main>
    <div class="reaction-row" id="pc-attack-reaction" hidden></div>
    <div class="apply-row" id="pc-attack-apply-row" hidden><div class="defense-chips" id="pc-attack-defenses"></div><span class="total" id="pc-attack-total"></span><button class="apply" id="pc-attack-apply" type="button">Registra</button><button class="apply primary" id="pc-attack-launch-button" type="button" hidden>Lancia</button></div>
    <footer class="status-bar"><p class="status" id="pc-attack-status" role="status" aria-live="polite"></p><button class="small" id="pc-attack-undo" type="button" hidden>Annulla</button></footer>
  </div>
  <script type="module" src="/src/pc-attack.js"></script>
</body>
</html>
