<?xml version="1.0" encoding="UTF-8"?>
<!-- A token the GM keeps hidden from the players: an eye struck through (card mark, GM only). Drawn as a mask glyph. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <mask id="hidden-token-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff" />
      <circle cx="50" cy="50" r="16" fill="none" stroke="#000" stroke-width="7" />
      <line x1="9" y1="16" x2="91" y2="84" stroke="#000" stroke-width="15" />
    </mask>
  </defs>
  <path mask="url(#hidden-token-cut)" fill="#000"
    d="M6 50 C 28 17, 72 17, 94 50 C 72 83, 28 83, 6 50 Z" />
  <line x1="11" y1="18" x2="89" y2="82" stroke="#000" stroke-width="6.5" />
</svg>
