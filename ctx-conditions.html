  <!doctype html>
  <html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        --obrt-text: #fff;         /* popolato dal TS con applyTheme */
        --obrt-hover: rgba(255,255,255,.06);
      }
      html, body {
        margin: 0; padding: 0;
        background: transparent; color: var(--obrt-text);
        font-family: system-ui, Roboto, Arial, sans-serif;
        font-size: 12px; line-height: 1.2;
      }
      .wrap {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 8px;
        min-width: 100px;
        max-width: 360px;
      }
      .chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 3px; border-radius: 10px;
        background: var(--obrt-hover);
        cursor: pointer; user-select: none;
        border: 1px solid rgba(255,255,255,.10);
        white-space: nowrap;
      }
      .chip:hover { background: rgba(255,255,255,.10); }
      .chip .dot {
        width: 10px; height: 10px; border-radius: 999px;
        border: 1px solid rgba(255,255,255,.35);
        background: rgba(255,255,255,.15);
      }
      .chip .dot.on {
      background: #3ba55d;   /* verde acceso; cambia se preferisci */
      border-color: #3ba55d;
      }
      .chip .dot.mixed {
      background: repeating-linear-gradient(
      45deg,
    rgba(255,255,255,.45) 0 3px,
    rgba(255,255,255,.15) 3px 6px
  );
}
      .row { grid-column: 1 / -1; display: flex; gap: 6px; }
      input[type="text"] {
        flex: 1; min-width: 0;
        padding: 6px 8px; border-radius: 8px;
        border: 1px solid rgba(255,255,255,.15);
        background: rgba(0,0,0,.35); color: var(--obrt-text);
      }
      button {
        padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.15);
        background: rgba(255,255,255,.07); color: var(--obrt-text); cursor: pointer;
      }
      button:hover { background: rgba(255,255,255,.12); }
      .footer { grid-column: 1 / -1; display:flex; justify-content: space-between; gap:8px; }
      .muted { opacity: .75; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="wrap" id="wrap">
      <div id="grid"></div>  <!-- ← contenitore dove il TS inietterà i chip -->
      <div class="row">
        <input id="customText" type="text" placeholder="Aggiungi Slot Extra (es. Marchio del Cacciatore)" />
        <button id="btnAdd">Aggiungi</button>
      </div>
      <div class="footer">
        <button id="btnClear">Rimuovi tutte le condizioni</button>
        <div class="muted">Clicca per (dis)attivare</div>
      </div>
    </div>
    <script type="module" src="/src/ctx-conditions.ts"></script>
  </body>
  </html>
