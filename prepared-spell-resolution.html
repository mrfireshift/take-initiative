<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Risolvi incantesimo</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: #f8fafc;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      #app {
        --accent: #a78bfa;
        position: relative;
        display: grid;
        gap: 7px;
        width: calc(100% - 8px);
        height: calc(100% - 8px);
        margin: 4px;
        padding: 11px 12px;
        border: 1px solid rgba(196, 181, 253, .72);
        border-radius: 10px;
        background:
          linear-gradient(135deg, rgba(76, 29, 149, .97), rgba(15, 23, 42, .98) 58%),
          #111827;
        box-shadow:
          0 0 0 1px rgba(15, 23, 42, .9),
          0 8px 24px rgba(0, 0, 0, .48),
          0 0 18px rgba(139, 92, 246, .28);
      }
      #app::after {
        position: absolute;
        right: 50%;
        bottom: -7px;
        width: 12px;
        height: 12px;
        border-right: 1px solid rgba(196, 181, 253, .72);
        border-bottom: 1px solid rgba(196, 181, 253, .72);
        background: #111827;
        content: "";
        transform: translateX(50%) rotate(45deg);
      }
      .eyebrow {
        color: #c4b5fd;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .08em;
        line-height: 1;
        text-transform: uppercase;
      }
      .heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        min-width: 0;
        gap: 8px;
      }
      #close {
        flex: none;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 1px solid rgba(196, 181, 253, .45);
        border-radius: 6px;
        background: rgba(15, 23, 42, .55);
        color: rgba(248, 250, 252, .82);
        cursor: pointer;
        font-size: 15px;
        line-height: 18px;
      }
      #close:hover { background: rgba(139, 92, 246, .5); }
      #spellName {
        overflow: hidden;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 16px;
        line-height: 1.1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #casterName {
        flex: none;
        color: rgba(226, 232, 240, .7);
        font-size: 10px;
        white-space: nowrap;
      }
      #resolutionChoice {
        width: 100%;
        min-height: 27px;
        padding: 3px 7px;
        border: 1px solid rgba(196, 181, 253, .4);
        border-radius: 6px;
        background: rgba(15, 23, 42, .92);
        color: #f8fafc;
        font-size: 11px;
      }
      .action-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
      }
      #status {
        overflow: hidden;
        color: rgba(226, 232, 240, .72);
        font-size: 10px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #resolve {
        min-width: 82px;
        min-height: 30px;
        padding: 5px 11px;
        border: 1px solid #ddd6fe;
        border-radius: 7px;
        background: linear-gradient(#8b5cf6, #6d28d9);
        box-shadow: 0 3px 10px rgba(76, 29, 149, .5);
        color: #fff;
        cursor: pointer;
        font-size: 12px;
        font-weight: 800;
      }
      #resolve:hover:not(:disabled) { filter: brightness(1.12); }
      #resolve:disabled {
        border-color: rgba(148, 163, 184, .35);
        background: rgba(51, 65, 85, .85);
        box-shadow: none;
        color: rgba(226, 232, 240, .55);
        cursor: default;
      }
      #app[data-state="stale"] { --accent: #94a3b8; filter: saturate(.4); }
    </style>
  </head>
  <body>
    <main id="app" data-state="loading">
      <div id="eyebrow" class="eyebrow">Incantesimo preparato</div>
      <div class="heading">
        <strong id="spellName">Caricamento…</strong>
        <span id="casterName"></span>
        <button id="close" type="button" aria-label="Chiudi">×</button>
      </div>
      <select id="resolutionChoice" aria-label="Variante di risoluzione" hidden></select>
      <div class="action-row">
        <span id="status">Seleziona il bersaglio sul tabellone</span>
        <button id="resolve" type="button" disabled>Risolvi</button>
      </div>
    </main>
    <script type="module" src="/src/prepared-spell-resolution.js"></script>
  </body>
</html>
