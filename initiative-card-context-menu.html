<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azioni card</title>
    <link rel="stylesheet" href="/ui-typography.css" />
    <link rel="stylesheet" href="/popover-glass.css" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: auto;
        min-height: 0;
        overflow: hidden;
        background: transparent !important;
      }
      body {
        box-sizing: border-box;
        padding: 0;
        color: #fff;
        font-family: var(--obrt-font-ui, "Helvetica Neue", Helvetica, Arial, sans-serif);
        font-size: 12px;
      }
      .glass-shell {
        box-sizing: border-box;
        width: 100%;
        height: auto;
        min-height: 0 !important;
        overflow: hidden;
        outline: none;
      }
      #menu {
        box-sizing: border-box;
        width: 100%;
        height: auto;
        min-height: 0;
        max-height: 100vh;
        padding: 4px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
      }
      button {
        box-sizing: border-box;
        width: 100%;
        min-height: 31px;
        padding: 5px 7px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #fff;
        font: inherit;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      button:hover:not(:disabled), button[aria-current="true"] {
        background: rgba(255,255,255,.12);
      }
      button:focus-visible {
        outline: 2px solid rgba(147,197,253,.9);
        outline-offset: -2px;
      }
      button:disabled {
        color: rgba(255,255,255,.42);
        cursor: default;
        opacity: .62;
      }
      .title {
        box-sizing: border-box;
        max-width: 100%;
        padding: 5px 7px 7px;
        margin-bottom: 3px;
        overflow: hidden;
        border-bottom: 1px solid rgba(255,255,255,.12);
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .action {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      button.danger:not(:disabled) { color: #fecaca; }
      button.danger:not(:disabled):hover { background: rgba(239,68,68,.12); }
      .action[aria-disabled="true"] { color: rgba(255,255,255,.42); }
      .icon {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        object-fit: contain;
        pointer-events: none;
      }
      .label { min-width: 0; flex: 1 1 auto; }
      .trailing { opacity: .72; }
      .submenu {
        display: none;
        padding: 2px;
        margin: 1px 0 3px 23px;
        border-left: 1px solid rgba(255,255,255,.14);
      }
      .divider {
        height: 1px;
        margin: 3px 5px;
        background: rgba(255,255,255,.12);
      }
      .dot {
        width: 11px;
        height: 11px;
        flex: 0 0 11px;
        border: 1px solid rgba(255,255,255,.55);
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div id="shell" class="glass-shell" data-glass-popover="1" data-popover-id="com.thebigpicture.initiative/initiative-card-context-menu">
      <main id="menu" role="menu" aria-label="Azioni card"></main>
    </div>
    <script type="module" src="/src/initiative-card-context-menu.js"></script>
  </body>
</html>
