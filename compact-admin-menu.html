<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azioni tracker</title>
    <link rel="stylesheet" href="/ui-typography.css" />
    <link rel="stylesheet" href="/popover-glass.css" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: auto;
        min-height: 0;
        overflow: hidden;
        background: transparent !important;
      }
      body {
        box-sizing: border-box;
        color: #fff;
        font-family: var(--obrt-font-ui, "Helvetica Neue", Helvetica, Arial, sans-serif);
        font-size: 12px;
      }
      .glass-shell {
        box-sizing: border-box;
        width: 100%;
        height: 100vh;
        min-height: 100vh !important;
        overflow: hidden;
        outline: none;
      }
      #menu {
        box-sizing: border-box;
        display: grid;
        width: 100%;
        padding: 5px;
        gap: 2px;
      }
      button {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 32px;
        gap: 8px;
        padding: 5px 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #fff;
        font: inherit;
        font-weight: 650;
        text-align: left;
        cursor: pointer;
      }
      button:hover { background: rgba(255,255,255,.12); }
      button:focus-visible {
        outline: 2px solid rgba(147,197,253,.9);
        outline-offset: -2px;
      }
      button.danger { color: #fecaca; }
      button.danger:hover { background: rgba(239,68,68,.12); }
      .icon {
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 17px;
        height: 17px;
        flex: 0 0 17px;
        color: #fff;
        font-size: 17px;
        font-weight: 750;
        line-height: 1;
      }
      .icon img {
        display: block;
        width: 16px;
        height: 16px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        pointer-events: none;
      }
      .label {
        min-width: 0;
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="shell"
      class="glass-shell"
      data-glass-popover="1"
      data-popover-id="com.thebigpicture.initiative/compact-admin-menu"
    >
      <main id="menu" role="menu" aria-label="Altre azioni del tracker"></main>
    </div>
    <script type="module" src="/src/compactAdminMenu.js"></script>
  </body>
</html>
