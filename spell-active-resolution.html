<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attivazione incantesimo</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        width: 100%; margin: 0; overflow: hidden;
        background: transparent; color: #f8fafc;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      #app {
        --accent: #a78bfa;
        display: flex; flex-direction: column; gap: 8px;
        width: calc(100% - 8px); height: auto; min-height: 0; margin: 4px;
        padding: 11px 12px; border: 1px solid rgba(196,181,253,.72);
        border-radius: 10px;
        background: linear-gradient(135deg, rgba(76,29,149,.32), rgba(30,41,59,.18) 62%), rgba(15,23,42,.14);
        -webkit-backdrop-filter: blur(6px) saturate(120%);
        backdrop-filter: blur(6px) saturate(120%);
        box-shadow: 0 0 0 1px rgba(15,23,42,.9), 0 8px 24px rgba(0,0,0,.48), 0 0 18px rgba(139,92,246,.28);
      }
      .eyebrow { color: #c4b5fd; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 0; overflow: hidden; font: 800 17px/1.1 Georgia, "Times New Roman", serif; text-overflow: ellipsis; white-space: nowrap; }
      .heading, .meta, .toolbar, .footer { display: flex; align-items: center; gap: 7px; min-width: 0; }
      .heading { justify-content: space-between; }
      .heading[data-drag-handle] { cursor: move; }
      .heading[data-drag-handle].is-dragging { cursor: grabbing; }
      .heading-actions { display: flex; align-items: center; gap: 6px; flex: none; }
      .close { min-width: 25px; min-height: 25px; padding: 1px 5px; border: 0; background: transparent; color: #ede9fe; font-size: 22px; line-height: 1; }
      .caster, .status, .hint { color: rgba(226,232,240,.74); font-size: 11px; }
      .caster { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .economy { flex: none; padding: 3px 6px; border: 1px solid rgba(196,181,253,.4); border-radius: 5px; color: #ede9fe; font-size: 10px; font-weight: 800; }
      .status { min-height: 16px; line-height: 1.25; }
      .section { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
      .section-title { color: #ddd6fe; font-size: 11px; font-weight: 800; }
      button, select, input {
        min-height: 28px; border: 1px solid rgba(196,181,253,.4); border-radius: 6px;
        background: rgba(15,23,42,.9); color: #f8fafc; font: 700 11px system-ui, sans-serif;
      }
      button { padding: 4px 8px; cursor: pointer; }
      button:hover:not(:disabled) { filter: brightness(1.14); }
      button:disabled { cursor: default; opacity: .45; }
      .primary { border-color: #ddd6fe; background: linear-gradient(#8b5cf6,#6d28d9); }
      .toolbar { flex-wrap: wrap; }
      .toolbar .field { flex: 1 1 150px; }
      .child-depths { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
      .child-depth { display: grid; grid-template-columns: minmax(0, 1fr) 64px; align-items: center; gap: 5px; }
      .child-depth label { overflow: hidden; color: rgba(226,232,240,.78); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .toolbar .field { flex: 1 1 150px; }
      .outcomes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
      .outcomes button.active { border-color: #f5d0fe; background: rgba(126,34,206,.85); }
      .attack-rows { display: flex; flex-direction: column; gap: 7px; }
      .attack-row { display: grid; gap: 5px; padding: 6px; border: 1px solid rgba(196,181,253,.2); border-radius: 6px; background: rgba(15,23,42,.52); }
      .attack-row__title { color: rgba(226,232,240,.78); font-size: 10px; font-weight: 800; }
      .attack-row .outcomes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .targets { display: flex; flex-direction: column; gap: 5px; min-height: 0; max-height: 205px; overflow: auto; padding-right: 2px; }
      .target { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, auto); align-items: center; gap: 4px; padding: 5px; border: 1px solid rgba(196,181,253,.2); border-radius: 6px; background: rgba(15,23,42,.66); }
      .target-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
      .target-name small { display: block; color: rgba(226,232,240,.58); font-size: 9px; font-weight: 500; }
      .target button { min-width: 31px; padding: 3px 4px; font-size: 9px; }
      .target button.active { border-color: #f5d0fe; background: rgba(126,34,206,.85); }
      .field { display: grid; grid-template-columns: minmax(0, 1fr) 100px; align-items: center; gap: 7px; }
      .field label { color: rgba(226,232,240,.78); font-size: 11px; }
      input { width: 100%; padding: 4px 7px; }
      .field select { width: 100%; padding: 4px 7px; }
      .root-note { padding: 6px; border: 1px solid rgba(196,181,253,.25); border-radius: 6px; color: rgba(226,232,240,.75); font-size: 10px; line-height: 1.25; }
      .footer { justify-content: space-between; margin-top: 0; padding-top: 7px; border-top: 1px solid rgba(196,181,253,.2); }
      .footer button { min-width: 88px; }
      #app[data-state="stale"] { filter: saturate(.35); }
    </style>
  </head>
  <body>
    <main id="app" data-state="loading">
      <div id="eyebrow" class="eyebrow">Attivazione incantesimo</div>
      <div class="heading" data-drag-handle draggable="true"><h1 id="title">…</h1><div class="heading-actions"><span id="economy" class="economy"></span><button id="close" class="close" type="button" aria-label="Chiudi">×</button></div></div>
      <div id="caster" class="caster"></div>
      <div id="status" class="status" hidden></div>
      <section id="saveSection" class="section" hidden>
        <div id="saveTitle" class="section-title">Sagoma e tiri salvezza</div>
        <div id="placementToolbar" class="toolbar"><button id="place" type="button">Posiziona sagoma</button><button id="confirmPlacement" class="primary" type="button" hidden>Conferma sagoma</button><button id="cancelPlacement" type="button" hidden>Annulla</button><span id="placementStatus" class="hint"></span></div>
        <div id="childCountField" class="field" hidden><label id="childCountLabel" for="childCount">Numero</label><input id="childCount" type="number" min="1" max="6" step="1" inputmode="numeric" /></div>
        <div id="childDepths" class="child-depths" hidden></div>
        <div id="bulkOutcomes" class="toolbar" hidden>
          <span class="hint">Imposta tutti:</span>
          <button type="button" data-bulk-outcome="passed">Superato</button>
          <button type="button" data-bulk-outcome="failed">Fallito</button>
          <button type="button" data-bulk-outcome="immune">Immune</button>
        </div>
        <div id="targets" class="targets"></div>
        <div id="damageField" class="field" hidden><label id="damageLabel" for="damage">Danno pieno</label><input id="damage" type="number" min="0" step="1" inputmode="numeric" placeholder="Totale" /></div>
      </section>
      <section id="singleSaveSection" class="section" hidden>
        <div id="singleSaveTitle" class="section-title">Tiro salvezza</div>
        <select id="saveTarget" aria-label="Bersaglio del tiro salvezza"><option value="">Seleziona il bersaglio</option></select>
        <div id="saveTargetHint" class="hint"></div>
        <div id="singleSaveOutcomes" class="outcomes">
          <button type="button" data-save-outcome="passed">Superato</button>
          <button type="button" data-save-outcome="failed">Fallito</button>
          <button type="button" data-save-outcome="immune">Immune</button>
        </div>
        <div id="singleSaveDamageField" class="field"><label id="singleSaveDamageLabel" for="saveDamage">Danno</label><input id="saveDamage" type="number" min="0" step="1" inputmode="numeric" placeholder="Totale" /></div>
      </section>
      <section id="attackSection" class="section" hidden>
        <div id="attackTitle" class="section-title">Fulmine</div>
        <div id="attackRows" class="attack-rows" hidden></div>
        <select id="attackTarget" aria-label="Bersaglio del fulmine"><option value="">Seleziona il bersaglio</option></select>
        <div id="attackAdvantage" class="hint"></div>
        <div id="zoneShorteningField" class="field" hidden>
          <label for="zoneShorteningFrom">Porzione da consumare</label>
          <select id="zoneShorteningFrom" aria-label="Porzione del muro da consumare">
            <option value="start">Iniziale</option>
            <option value="end" selected>Finale</option>
          </select>
        </div>
        <div id="attackOutcomes" class="outcomes">
          <button type="button" data-attack-outcome="hit">Colpito</button>
          <button type="button" data-attack-outcome="miss">Mancato</button>
          <button type="button" data-attack-outcome="critical" hidden>Critico</button>
        </div>
        <div class="field"><label id="attackDamageLabel" for="attackDamage">Danno</label><input id="attackDamage" type="number" min="0" step="1" inputmode="numeric" placeholder="Totale" /></div>
      </section>
      <div id="footer" class="footer"><span id="summary" class="hint"></span><button id="apply" class="primary" type="button" disabled>Applica</button></div>
    </main>
    <script type="module" src="/src/spell-active-resolution.js"></script>
  </body>
</html>
