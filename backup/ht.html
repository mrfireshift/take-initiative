<!doctype html>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body  { margin: 6px 8px; font: 600 12px/1.1 system-ui, sans-serif; }
  .row  { display: grid; grid-template-columns: 1fr; gap: 6px; }
  button{
    all: unset; padding: 6px 8px; border: 1px solid #ffffff33;
    border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  button:hover { background: #ffffff14; }
</style>

<div class="row">
  <button data-att="ally">🟢 Add as Ally</button>
  <button data-att="neutral">🟡 Add as Neutral</button>
  <button data-att="enemy">🔴 Add as Enemy</button>
</div>

<script type="module">
  import OBR from "https://unpkg.com/@owlbear-rodeo/sdk/dist/obrsdk.min.js";

  const ID = "com.thebigpicture.initiative";
  const META_KEY = `${ID}/meta`;
  const DEFAULT_INITIATIVE = 10;

  await OBR.onReady();

  // ← prende gli ID degli item su cui è stato aperto il menu
  const ctx = await OBR.contextMenu.getContext(); 
  // ctx.items: string[] (gli stessi che avresti in onClick)

  async function addToInitiative(attitude){
    const ids = ctx?.items || [];
    if (!ids.length) return;

    await OBR.scene.items.updateItems(ids, (items) => {
      for (const it of items) {
        it.metadata = it.metadata || {};
        const prev  = it.metadata[META_KEY] || {};
        it.metadata[META_KEY] = {
          ...prev,
          initiative: DEFAULT_INITIATIVE,
          attitude
        };
      }
    });

    // chiudi il menu (lo stesso “trucco” che usi nel main)
    try { await OBR.player.deselect(); } catch {}
  }

  for (const b of document.querySelectorAll("button[data-att]")) {
    b.addEventListener("click", () => addToInitiative(b.dataset.att));
  }
</script>
