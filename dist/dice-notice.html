      html, body {

        box-sizing: border-box;
        color: #fff;

      }
      .glass-shell {
        box-sizing: border-box;
        width: 100%;
        height: 100vh;
        min-height: 100vh !important;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        cursor: pointer;
      }
      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        margin: 6px 6px 0;
        border-radius: 10px;
        overflow: hidden;

      #tray { display: block; width: 100%; height: 100%; }

      #formula { grid-column: 1; color: rgba(255, 255, 255, .62); font-size: var(--obrt-type-micro, 10px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
