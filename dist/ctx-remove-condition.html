      border-color: rgba(248,113,113,.42);
    }
    .condition-row:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
    .condition-row:disabled { opacity: .6; cursor: default; }
    .condition-name, .condition-target {

      text-overflow: ellipsis;

    .condition-target { color: rgba(255,255,255,.75); font-size: var(--obrt-type-secondary); font-weight: var(--obrt-weight-regular); }
