    /* The surge's own: the plugin's glass tinted fuchsia and the d100's card. The rest is the consoles'. */
    :root { --obrt-popover-glass: rgba(112, 30, 110, .62); }
    /* The glass fills its window: a shadow around it would only show in the corners, cut square by the iframe. */
    .glass-shell { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07); }
    /* When the groups do not fit the panel scrolls: the view keeps its height, and the panel its margin at the bottom. */
    .panel > .view { flex: none; }
    .roll-card { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 14px; padding: var(--obrt-space-xl); border: 1px solid rgba(192, 132, 252, .45); border-radius: var(--obrt-radius-md);
      background: radial-gradient(circle at 12% 30%, rgba(244, 114, 182, .28), transparent 55%), linear-gradient(150deg, rgba(59, 7, 100, .78), rgba(15, 23, 42, .78)); }
    .d100 { width: 72px; height: 72px; display: grid; place-items: center; clip-path: polygon(50% 0, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
      background: linear-gradient(160deg, #a855f7, #831843); box-shadow: inset 0 0 18px rgba(0, 0, 0, .45); }
    .d100 input { width: 60px; padding: 0; border: 0; outline: none; background: transparent; color: #fff; font-size: 26px; font-weight: var(--obrt-weight-heavy); font-variant-numeric: tabular-nums; text-align: center; text-shadow: 0 2px 4px rgba(0, 0, 0, .6); -moz-appearance: textfield; }
    .d100 input::-webkit-outer-spin-button, .d100 input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .d100 input::placeholder { color: rgba(255, 255, 255, .55); font-size: 18px; font-weight: var(--obrt-weight-bold); }
    .d100.flash { animation: flash .5s ease; }
    @keyframes flash { 40% { filter: brightness(1.6) saturate(1.4); transform: rotate(-6deg) scale(1.06); } }
    .roll-side { min-width: 0; display: grid; gap: var(--obrt-space-sm); }
    .roll-side .caption { color: #f5d0fe; }
    .roll-hint { margin: 0; color: rgba(255, 255, 255, .72); font-size: var(--obrt-type-secondary); line-height: 1.3; text-wrap: pretty; }
    .roll-actions { display: flex; gap: var(--obrt-space-sm); }
    /* The row of the table, in a box: its range, its text, what Applica does with it. */
    .outcome { display: grid; gap: var(--obrt-space-sm); padding: var(--obrt-space-lg) var(--obrt-space-xl); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
    .outcome-head { display: flex; align-items: center; justify-content: space-between; gap: var(--obrt-space-md); }
    .range { font-weight: var(--obrt-weight-bold); font-variant-numeric: tabular-nums; }
    .auto-tag { color: var(--muted); font-size: var(--obrt-type-secondary); }
    .auto-tag[data-auto="true"] { color: #bbf7d0; }
    .effect { margin: 0; line-height: 1.4; text-wrap: pretty; }
    .inline { min-width: 0; display: flex; align-items: center; gap: var(--obrt-space-sm); }
    /* The pill of the GM's own, folded in its box until it is asked for. */
    .builder { scroll-margin-bottom: var(--obrt-space-xl); padding: 0 var(--obrt-space-xl); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
    .builder summary { min-height: var(--obrt-h-control-md); }
    .builder[open] { padding-bottom: var(--obrt-space-lg); }
    .builder[open] summary { margin-bottom: 0; }
    .builder-rows { display: grid; gap: var(--obrt-space-sm); }
    .builder input { width: 100%; min-width: 0; min-height: var(--obrt-h-control-md); padding: 0 var(--obrt-space-md); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); outline: none; background: var(--surface); }
    .builder input:focus { border-color: rgba(96, 165, 250, .7); }
    .builder input::placeholder { color: rgba(255, 255, 255, .42); }
    .builder select { min-height: var(--obrt-h-control-md); padding: 0 var(--obrt-space-md); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); }
    .builder .small { flex: none; min-height: var(--obrt-h-control-md); font-weight: var(--obrt-weight-semibold); }
    #pill-icon { flex: 0 0 64px; width: 64px; }
    #pill-duration { flex: 0 0 52px; width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
    #pill-unit { flex: 1 1 0; min-width: 0; }
    /* No chips in this row: its message in the middle, beside the button. */
    .apply-row .total { grid-row: 1 / span 2; }
    /* Messages: a bar at the bottom, only while there is something to say. */
    .status-bar:has(> .status:empty) { display: none; }
  </style>

<body>
  <div class="glass-shell" data-glass-popover="1" data-popover-id="com.thebigpicture.initiative/wild-magic-surge">
    <header class="header" data-drag-handle draggable="true" title="Trascina per spostare">
      <div class="header-text"><h1 class="title">Impulso di Magia Selvaggia</h1><div class="subtitle" id="subtitle">—</div></div>
      <span class="drag-grip" aria-hidden="true"></span>
      <button class="icon-button" id="close" type="button" title="Chiudi" aria-label="Chiudi">&times;</button>
    </header>
    <main class="panel">
      <section class="view">
        <div class="roll-card">
          <label class="d100" id="d100" title="Il d100 tirato al tavolo (00 = 100)">
            <input id="roll" type="number" min="0" max="100" inputmode="numeric" placeholder="d100" aria-label="Risultato del d100" />
          </label>
          <div class="roll-side">
            <span class="caption">Risultato del d100</span>
            <p class="roll-hint">Scrivi il numero tirato al tavolo: il motore trova la riga e applica l'esito dove può.</p>
            <div class="roll-actions"><button class="small" id="random" type="button" title="Tira il d100 qui">🎲 Tira qui</button></div>
          </div>
        </div>
        <section class="outcome" id="outcome" hidden>
          <div class="outcome-head"><span class="range" id="range"></span><span class="auto-tag" id="auto-tag"></span></div>
          <p class="effect" id="effect"></p>
          <p class="action-facts" id="action-line"></p>
          <p class="action-facts" id="note" hidden></p>
          <div class="form-row" id="heal-row" hidden>
            <label class="form-label" for="heal-total">Totale</label>
            <div class="inline"><input class="amount" id="heal-total" type="number" min="1" inputmode="numeric" aria-label="Totale dei PF recuperati" /><button class="mini-button" id="heal-roll" type="button"></button></div>
          </div>
        </section>
        <details class="builder spell-details" id="builder" hidden>
          <summary>Pillola personalizzata sullo Stregone</summary>
          <div class="builder-rows">
            <div class="form-row">
              <label class="form-label" for="pill-name">Pillola</label>
              <div class="inline"><select id="pill-icon" aria-label="Icona"></select><input id="pill-name" maxlength="80" placeholder="Nome della pillola" /></div>
            </div>
            <div class="form-row">
              <label class="form-label" for="pill-notes">Note</label>
              <input id="pill-notes" maxlength="160" placeholder="Promemoria, separati da virgola" />
            </div>
            <div class="form-row">
              <label class="form-label" for="pill-duration">Durata</label>
              <div class="inline"><input id="pill-duration" type="number" min="1" placeholder="—" title="Vuota: fino a rimozione" /><select id="pill-unit" aria-label="Unità"></select><button class="small" id="pill-apply" type="button">Metti la pillola</button></div>
            </div>
          </div>
        </details>
        <label class="more-option" id="tides-row" hidden><input type="checkbox" id="tides" checked /><span>Impulso richiesto dal DM: recupera Onde di Caos</span></label>
      </section>
    </main>
    <div class="apply-row"><span class="total" id="summary">Manca il d100.</span><button class="apply primary" id="apply" type="button" disabled>Applica</button></div>
    <footer class="status-bar"><p class="status" id="status" role="status"></p></footer>
  </div>
</body>
