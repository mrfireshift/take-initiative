        display: flex;

        cursor: pointer;
        font-size: var(--obrt-close-font, 18px);
        line-height: 1;
      }
      #close:hover { background: var(--obrt-close-hover, rgba(255, 255, 255, .08)); }
      #spellName {
        overflow: hidden;
        font-family: var(--obrt-font-display, Georgia, "Times New Roman", serif);

        text-overflow: ellipsis;
        white-space: nowrap;

        border: 1px solid rgba(196, 181, 253, .4);

        background: rgba(15, 23, 42, .92);
        color: #f8fafc;
        font-size: 11px;
      }
      #saveOutcome,

        width: 100%;
        min-height: 27px;
        padding: 3px 7px;
        border: 1px solid rgba(196, 181, 253, .4);
        border-radius: 6px;
        background: rgba(15, 23, 42, .92);
        color: #f8fafc;
        font-size: 11px;
      }
      #damageValue { color-scheme: dark; }
      .action-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
      }
      #status {
        overflow: hidden;
        color: rgba(226, 232, 240, .72);
        font-size: 10px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #resolve {
        min-width: 82px;
        min-height: 30px;
        padding: 5px 11px;
        border: 1px solid #ddd6fe;
        border-radius: 7px;
        background: linear-gradient(#8b5cf6, #6d28d9);
        box-shadow: 0 3px 10px rgba(76, 29, 149, .5);
        color: #fff;
        cursor: pointer;
        font-size: 12px;
        font-weight: 800;
      }
      #resolve:hover:not(:disabled) { filter: brightness(1.12); }
      #resolve:disabled {

        background: rgba(51, 65, 85, .85);
        box-shadow: none;
        color: rgba(226, 232, 240, .55);
        cursor: default;
      }
      #app[data-state="stale"] { --accent: #94a3b8; filter: saturate(.4); }
