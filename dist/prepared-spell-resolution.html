      html, body {

      * { box-sizing: border-box; }
      #app {
        --accent: #a78bfa;
        position: relative;
        display: grid;
        gap: 7px;
        width: calc(100% - 8px);
        height: calc(100% - 8px);
        margin: 4px;
        padding: 11px 12px;
        border: 1px solid rgba(196, 181, 253, .72);
        border-radius: 10px;
        background:

          0 0 0 1px rgba(15, 23, 42, .9),
          0 8px 24px rgba(0, 0, 0, .48),
          0 0 18px rgba(139, 92, 246, .28);
      }
      #app::after {
        position: absolute;
        right: 50%;
        bottom: -7px;
        width: 12px;
        height: 12px;
        border-right: 1px solid rgba(196, 181, 253, .72);
        border-bottom: 1px solid rgba(196, 181, 253, .72);
        background: #111827;
        content: "";
        transform: translateX(50%) rotate(45deg);
      }
      .eyebrow {
        color: #c4b5fd;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .08em;
        line-height: 1;
        text-transform: uppercase;
      }
      .heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        min-width: 0;
        gap: 8px;
      }
      #close {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--obrt-close-size, 28px);
        height: var(--obrt-close-size, 28px);
        padding: 0;
        border: 1px solid transparent;
        border-radius: var(--obrt-close-radius, 8px);
        background: transparent;
        color: rgba(248, 250, 252, .82);
        cursor: pointer;
        font-size: var(--obrt-close-font, 18px);
        line-height: 1;
      }
      #close:hover { background: var(--obrt-close-hover, rgba(255, 255, 255, .08)); }
      #spellName {
        overflow: hidden;
        font-family: var(--obrt-font-display, Georgia, "Times New Roman", serif);
        font-size: 16px;
        line-height: 1.1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #casterName {
        flex: none;
        color: rgba(226, 232, 240, .7);
        font-size: 10px;
        white-space: nowrap;
      }
      #resolutionChoice {
        width: 100%;
        min-height: 27px;
        padding: 3px 7px;
        border: 1px solid rgba(196, 181, 253, .4);
        border-radius: 6px;
        background: rgba(15, 23, 42, .92);
        color: #f8fafc;
        font-size: 11px;
      }
      #saveOutcome,
      #damageValue {
        width: 100%;
        min-height: 27px;
        padding: 3px 7px;
        border: 1px solid rgba(196, 181, 253, .4);
        border-radius: 6px;
        background: rgba(15, 23, 42, .92);
        color: #f8fafc;
        font-size: 11px;
      }
      #damageValue { color-scheme: dark; }
      .action-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
      }
      #status {
        overflow: hidden;
        color: rgba(226, 232, 240, .72);
        font-size: 10px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #resolve {
        min-width: 82px;
        min-height: 30px;
        padding: 5px 11px;
        border: 1px solid #ddd6fe;
        border-radius: 7px;
        background: linear-gradient(#8b5cf6, #6d28d9);
        box-shadow: 0 3px 10px rgba(76, 29, 149, .5);
        color: #fff;
        cursor: pointer;
        font-size: 12px;
        font-weight: 800;
      }
      #resolve:hover:not(:disabled) { filter: brightness(1.12); }
      #resolve:disabled {
        border-color: rgba(148, 163, 184, .35);
        background: rgba(51, 65, 85, .85);
        box-shadow: none;
        color: rgba(226, 232, 240, .55);
        cursor: default;
      }
      #app[data-state="stale"] { --accent: #94a3b8; filter: saturate(.4); }
    </style>
