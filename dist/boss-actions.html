  <style>
    /* What only the Boss console has: its language is console-shell.css's, the same as the attack panel's. */
    /* Riduci: only the header stays, with what is in progress. */
    body[data-minimized="true"] .panel, body[data-minimized="true"] .more-menu, body[data-minimized="true"] .apply-host, body[data-minimized="true"] .status-bar { display: none !important; }
    body:not([data-minimized="true"]) #boss-phase { display: none; }
    .view p { margin: 0; }
    /* The header's ⋯: what is not about the fight. */
    .more-action { width: 100%; min-height: var(--obrt-hit-min); padding: 0 6px; border: 0; border-radius: var(--obrt-radius-md); background: transparent; text-align: left; cursor: pointer; }
    .more-action:hover { background: var(--obrt-hover); }
    /* The actions, as the attack panel's lists: in a box of their own, by group, a row each on the list's columns. The panel scrolls. */
    #boss-action-rows { flex: 0 0 auto; min-height: 0; overflow: visible; }
    .action-group, .action-list { display: contents; }
    .action-group > .picker-level, .action-list > .picker-row { grid-column: 1 / -1; }
    .action-list > .picker-row { display: grid; grid-template-columns: subgrid; }
    .action-group-title { margin: 0; }
    .action-group:not(:first-child) > .picker-level { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); border-top-left-radius: 0; border-top-right-radius: 0; }
    .action-row.is-exhausted { opacity: .62; }
    /* The traits to read: one box, a line between them. */
    .passive-list { display: grid; padding: 0 var(--obrt-space-xl); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
    .passive { padding: var(--obrt-space-md) 0; }
    .passive + .passive { border-top: 1px solid var(--line); }
    .passive-name { margin: 0 0 3px; font-size: var(--obrt-type-body); font-weight: var(--obrt-weight-semibold); }
    .aura-tag { margin-left: 8px; color: var(--muted); font-size: var(--obrt-type-secondary); font-weight: var(--obrt-weight-regular); }
    .aura-tag.is-off { color: var(--warn-text); }
    .passive-text { margin: 0; color: var(--muted); font-size: var(--obrt-type-secondary); line-height: 1.35; text-wrap: pretty; }
    /* The action in progress: back to the list, its name, its uses. */
    .resolve-head { display: flex; align-items: center; gap: var(--obrt-space-sm); }
    .resolve-head .icon-button { width: var(--obrt-hit-min); height: var(--obrt-hit-min); margin-left: -4px; font-size: 16px; }
    .resolve-head .title { flex: 1 1 auto; }
    /* The target: a label and its menu, what it meets under them. */
    #boss-target-box { display: grid; gap: var(--obrt-space-sm); }
    .target-line { display: flex; align-items: center; justify-content: space-between; gap: var(--obrt-space-sm); min-width: 0; min-height: var(--obrt-hit-min); }
    .target-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .target-name.is-empty { color: var(--warn-text); font-size: var(--obrt-type-secondary); white-space: normal; }
    .target-hp { flex: 0 0 auto; color: var(--muted); font-size: var(--obrt-type-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .target-choices { display: flex; flex-wrap: wrap; gap: 4px; max-height: 96px; overflow-y: auto; }
    /* What gets filled in: in a box, with what it is made of on top and the rules at the bottom. */
    .boss-card { display: flex; flex-direction: column; gap: var(--obrt-space-md); padding: var(--obrt-space-lg) var(--obrt-space-xl); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
    .segmented.mode button { min-height: var(--obrt-hit-min); font-size: var(--obrt-type-secondary); }
    .damage-list, .damage-inline { display: grid; gap: var(--obrt-space-xs); }
    .damage-row, .damage-cell { display: grid; grid-template-columns: auto minmax(0, 1fr) 64px; align-items: center; column-gap: 6px; min-height: var(--obrt-hit-min); }
    .damage-type { font-weight: var(--obrt-weight-semibold); }
    .damage-formula { min-width: 0; color: var(--muted); font-size: var(--obrt-type-secondary); font-variant-numeric: tabular-nums; line-height: 1.25; }
    .note { color: var(--muted); font-size: var(--obrt-type-secondary); line-height: 1.35; text-wrap: pretty; }
    .note.warning { color: var(--warn-text); }
    .note.warning:has(> button) { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .note.clamp { display: block; overflow-wrap: anywhere; white-space: pre-line; }
    .manual-step { font-size: var(--obrt-type-secondary); line-height: 1.35; }
    .manual-step label { display: flex; align-items: flex-start; gap: 6px; cursor: pointer; }
    .manual-step input { flex: 0 0 auto; width: 15px; height: 15px; margin: 1px 0 0; accent-color: var(--obrt-accent); cursor: pointer; }
    .spell-details.manual-rules summary { color: var(--warn-text); }
    .spell-details pre, .reference-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: var(--obrt-type-secondary); line-height: 1.4; }
    .reference-text { padding: var(--obrt-space-lg) var(--obrt-space-xl); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
    /* The fixed row, outside the scrolling panel as in the attack panel: the reason it is off, or the total. */
    .apply-host { flex: 0 0 auto; }
    .apply-host:empty { display: none; }
    .total:has(#boss-apply-hint:not(:empty)) #boss-total { display: none; }
    .apply.secondary:not(:disabled) { background: var(--obrt-btn-primary-bg); }
    .apply.secondary:hover:not(:disabled) { background: var(--obrt-btn-primary-bg-hover); }
    /* The profile's management. */
    .manage { display: grid; gap: var(--obrt-space-md); }
    .manage label { display: grid; gap: 3px; }
    .manage select, .manage input[type=file] { width: 100%; min-height: var(--obrt-h-control-md); padding: 4px 7px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); }
    .button-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .button-row button.is-confirming { border-color: #f87171; color: #fecaca; }
    /* A choice with its title on top: distance, landing, what it is thrown against. */
    .decision { display: grid; gap: 4px; }
    .segmented.choices { display: flex; flex-wrap: wrap; }
    .segmented.choices button { flex: 1 1 auto; min-height: var(--obrt-h-control-sm); padding: 0 8px; font-size: var(--obrt-type-secondary); }
    .effect-choices { display: grid; gap: var(--list-gap); max-height: 190px; overflow-y: auto; padding: 4px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
    .effect-choice { display: grid; gap: 1px; justify-items: start; padding: 3px 8px; border-color: transparent; background: transparent; text-align: left; }
    .effect-choice[aria-pressed="true"] { border-color: rgba(96, 165, 250, .55); background: rgba(37, 99, 235, .28); }
    .effect-name { font-weight: var(--obrt-weight-semibold); }
    .effect-detail { color: var(--muted); font-size: var(--obrt-type-caption); }
    /* A step on the map: what it says, its buttons beside it. */
    .area-step { display: flex; align-items: center; gap: 6px; min-height: var(--obrt-hit-min); }
    .area-step .area-label { flex: 1 1 auto; min-width: 0; color: var(--muted); font-size: var(--obrt-type-secondary); line-height: 1.3; text-wrap: pretty; }
    .area-step .small { flex: 0 0 auto; color: var(--info-text); font-size: var(--obrt-type-secondary); }
    /* The creatures of a group: the attack panel's table in its box. Every row on the same columns: the name (the only thing that
       gives way) with its hit points, the outcome, what it takes, its remove; its defenses and its condition on a second line. */
    .group-list { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(26px, auto) auto; align-items: center; gap: var(--list-gap) 3px; padding: var(--obrt-space-md) var(--obrt-space-sm); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
    .group-list > .muted { grid-column: 1 / -1; padding: 2px 4px; }
    .group-row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; row-gap: 1px; }
    .group-row > .group-name { grid-column: 1; grid-row: 1; }
    .group-row > .segmented { grid-column: 2; grid-row: 1; }
    .group-row > .group-damage { grid-column: 3; grid-row: 1; }
    .group-row > .group-remove { grid-column: 4; grid-row: 1; }
    .group-row > .defense-chips { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
    .group-row > .group-tag { grid-column: 1 / -1; grid-row: 2; justify-self: end; }
    .group-name { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-left: 4px; }
    .group-title { min-width: 0; display: flex; overflow: hidden; }
    .group-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group-details { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 3px; }
    .group-hp { color: var(--muted); font-size: var(--obrt-type-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .group-row .segmented.mini button { padding: 0 4px; }
    .group-damage { color: #fca5a5; font-size: var(--obrt-type-secondary); font-weight: var(--obrt-weight-bold); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .group-tag { min-width: 0; overflow: hidden; color: var(--warn-text); font-size: var(--obrt-type-caption); font-weight: var(--obrt-weight-semibold); text-overflow: ellipsis; white-space: nowrap; }
    .group-tag:empty { display: none; }
    .group-row[data-damageless="true"] > .group-tag { grid-column: 3; grid-row: 1; }
    .group-damage:empty { display: none; }
    .group-remove { width: 22px; height: 22px; color: var(--muted); font-size: 15px; }
    .group-row .defense-chip { min-height: 18px; }
    .row-damage { display: inline-flex; align-items: center; gap: 3px; }
    .row-amount { width: 38px; height: 20px; padding: 0 3px; border: 1px solid rgba(148, 163, 184, .28); border-radius: var(--obrt-radius-md); outline: none; background: var(--surface); color: inherit; font-weight: var(--obrt-weight-bold); text-align: center; font-variant-numeric: tabular-nums; }
    .row-amount:focus { border-color: rgba(96, 165, 250, .7); }
    .defense-chips .immune-badge { padding: 0 5px; border: 1px solid #86efac; border-radius: 999px; color: #bbf7d0; background: rgba(21, 128, 61, .35); }
    .defense-chips .mark-badge { padding: 0 5px; border: 1px solid #c4b5fd; border-radius: 999px; color: #ddd6fe; background: rgba(109, 40, 217, .35); }
    .defense-chips .mark-badge.is-spent { border-color: var(--line); background: transparent; color: var(--dim); }
  </style>

  <script>
    // A console reduced before it was closed shows only its header from the first paint; boss-actions.js then
    // sets the popover height. The key is boss-actions.js's MINIMIZED_STORAGE_KEY.
    try { if (sessionStorage.getItem("com.thebigpicture.initiative/boss-actions-minimized") === "true") document.body.dataset.minimized = "true"; } catch {}
  </script>
  <div class="glass-shell" data-glass-popover="1" data-popover-id="com.thebigpicture.initiative/boss-actions">
    <header class="header" data-drag-handle draggable="true" title="Trascina per spostare">
      <div class="header-text"><div class="title-row"><h1 class="title" id="boss-name">Console Boss</h1></div><div class="subtitle" id="boss-phase"></div></div>
      <span class="drag-grip" aria-hidden="true"></span>
      <button class="icon-button" id="boss-more" type="button" title="Altre opzioni" aria-label="Altre opzioni" aria-haspopup="true" aria-expanded="false">⋯</button>
      <button class="icon-button" id="boss-minimize" type="button" title="Riduci" aria-label="Riduci" aria-expanded="true">&minus;</button>
      <button class="icon-button" id="boss-close" type="button" title="Chiudi" aria-label="Chiudi">&times;</button>
    </header>
    <div class="more-menu" id="boss-more-menu" role="group" aria-label="Altre opzioni" hidden>
      <button class="more-action" id="boss-manage-open" type="button">Gestisci profilo</button>
    </div>
    <main class="panel" id="boss-panel">
      <section class="view" id="boss-list-view" aria-label="Azioni">
        <p class="action-facts" id="boss-round-line"></p>
        <div id="boss-abilities" class="view"></div>
      </section>
      <section class="view" id="boss-resolution" aria-label="Risoluzione" hidden></section>
      <section class="view" id="boss-manage-view" aria-label="Gestisci profilo" hidden>
        <div class="resolve-head"><button class="icon-button" id="boss-manage-back" type="button" title="Torna alle azioni" aria-label="Torna alle azioni">&larr;</button><h2 class="title">Gestisci profilo</h2></div>
        <div class="manage" id="boss-library">
          <label><span class="caption">Importa stat block HTML o profilo JSON</span><input id="boss-file" type="file" accept=".html,.htm,.json,text/html,application/json" /></label>
          <div class="button-row"><button class="small" id="boss-import" type="button">Importa</button></div>
          <label><span class="caption">Definizione</span><select id="boss-profile"></select></label>
          <div class="button-row"><button class="small" id="boss-bind" type="button">Collega al token</button><button class="small" id="boss-unbind" type="button">Scollega</button><button class="small" id="boss-export" type="button">Esporta JSON</button><button class="small" id="boss-refresh" type="button">Aggiorna</button></div>
          <p class="note" id="boss-profile-info"></p>
          <p class="note warning" id="boss-profile-warning" hidden></p>
          <span class="caption">Risorse del boss</span>
          <p class="note" id="boss-resource-info"></p>
          <div class="button-row"><button class="small" id="boss-reset-resources" type="button">Azzera risorse</button></div>
          <span class="caption">Aure del profilo</span>
          <p class="note" id="boss-aura-info"></p>
          <div class="button-row"><button class="small" id="boss-restore-auras" type="button">Ripristina aure</button></div>
          <span class="caption">Pulizia della libreria locale</span>
          <div class="button-row"><button class="small" id="boss-delete-revision" type="button">Elimina revisione</button><button class="small" id="boss-prune" type="button">Pulisci superate</button></div>
          <p class="note" id="boss-cleanup-info"></p>
        </div>
      </section>
    </main>
    <div class="apply-host" id="boss-apply-host"></div>
    <footer class="status-bar"><p class="status" id="boss-status" role="status" aria-live="polite"></p><button class="small" id="boss-undo" type="button" hidden>Annulla</button></footer>
  </div>
