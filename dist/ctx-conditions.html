<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Condizioni</title>
  <link rel="stylesheet" href="/ui-typography.css" />
  <style>
    /* "Condizioni…" in OBR's token menu: the quick conditions of the card menu (quickConditionsCore.js), then the
       full panel. Colours follow OBR's theme text (ctx-conditions.ts). */
    :root {
      --obrt-text: #fff;
      --obrt-hover: rgba(255,255,255,.08);
    }
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
      color: var(--obrt-text);
      font-family: var(--obrt-font-ui, "Helvetica Neue", Helvetica, Arial, sans-serif);
      font-size: 12px;
    }
    .wrap {
      box-sizing: border-box;
      display: grid;
      gap: 4px;
      padding: 6px;
    }
    .quick-conditions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2px;
    }
    button {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      min-height: 28px;
      padding: 4px 5px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--obrt-hover); }
    button:focus-visible { outline: 2px solid rgba(147,197,253,.9); outline-offset: -2px; }
    button:disabled { cursor: progress; opacity: .6; }
    .emoji { flex: 0 0 15px; width: 15px; text-align: center; }
    /* 11px: OBR's menu is narrower than the card menu, and "Privo di sensi" has to fit in its column. */
    .name { min-width: 0; flex: 1 1 auto; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    /* Active on every selected token, or on some of them. */
    button[data-state="on"] {
      background: rgba(59,130,246,.34);
      box-shadow: inset 0 0 0 1px rgba(147,197,253,.6);
    }
    button[data-state="mixed"] {
      background: rgba(59,130,246,.12);
      box-shadow: inset 0 0 0 1px rgba(147,197,253,.38);
    }
    .all {
      border-top: 1px solid rgba(255,255,255,.12);
      border-radius: 0 0 7px 7px;
      padding-top: 6px;
    }
  </style>
  <script type="module" crossorigin src="/assets/ctxConditions-XodTxQ-2.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/constants-Cz421rMH.js">
  <link rel="modulepreload" crossorigin href="/assets/preload-helper-BXl3LOEh.js">
  <link rel="modulepreload" crossorigin href="/assets/index-C7oC19nY.js">
  <link rel="modulepreload" crossorigin href="/assets/sceneLifecycle-28TsGb8f.js">
  <link rel="modulepreload" crossorigin href="/assets/quickConditionsCore-bGmUWaV4.js">
</head>
<body>
  <div class="wrap">
    <div class="quick-conditions" id="grid" role="group" aria-label="Condizioni rapide"></div>
    <button type="button" class="all" id="allConditions">Tutte le condizioni…</button>
  </div>
</body>
</html>
