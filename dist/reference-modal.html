<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enciclopedia</title>
  <link rel="stylesheet" href="/ui-typography.css" />
  <link rel="stylesheet" href="/popover-glass.css" />
  <link rel="stylesheet" href="/rules-text.css" />
  <style>
    :root { --muted:rgba(255,255,255,.66); --line:rgba(148,163,184,.20); }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; color:#fff; }
    body { font:var(--obrt-type-body, 12px)/1.3 var(--obrt-font-ui, "Helvetica Neue", Helvetica, Arial, sans-serif); }
    * { box-sizing:border-box; scrollbar-width:thin; scrollbar-color:rgba(148,163,184,.55) transparent; }
    .shell { width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden; }
    .panel { min-height:0; flex:1 1 auto; display:flex; flex-direction:column; gap:9px; padding:12px; overflow:hidden; }
    .heading { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-right:34px; }
    h1 { min-width:0; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--obrt-type-panel-title, 15px); }
    .close { position:fixed; top:8px; right:10px; display:inline-flex; align-items:center; justify-content:center; font:inherit; width: var(--obrt-close-size, 28px); height: var(--obrt-close-size, 28px); min-height: var(--obrt-close-size, 28px); padding: 0; border: 1px solid transparent; border-radius: var(--obrt-close-radius, 8px); background: transparent; color: inherit; font-size: var(--obrt-close-font, 18px); line-height: 1; cursor:pointer; }
    .close:hover { background:var(--obrt-close-hover, rgba(255, 255, 255, .08)); }
    .tabs { display:flex; gap:5px; }
    button, input { font:inherit; color:inherit; }
    button { min-height:30px; padding:6px 10px; border:1px solid var(--line); border-radius:9px; background:rgba(255,255,255,.055); cursor:pointer; }
    button:hover { background:rgba(255,255,255,.12); }
    button.active { background:rgba(37,99,235,.42); border-color:rgba(96,165,250,.72); }
    input { width:100%; min-height:32px; padding:6px 9px; border:1px solid rgba(148,163,184,.28); border-radius:9px; outline:none; background:rgba(0,0,0,.35); }
    .content { min-height:0; flex:1 1 auto; display:grid; grid-template-columns:190px minmax(0,1fr); gap:8px; }
    .results, .detail { min-height:0; overflow-y:auto; padding:6px; border:1px solid var(--line); border-radius:11px; background:rgba(0,0,0,.20); }
    .results { display:flex; flex-direction:column; gap:4px; }
    .result { width:100%; min-height:34px; padding:7px 8px; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .result small { display:block; color:var(--muted); font-size:10px; }
    .empty { padding:16px 8px; text-align:center; color:var(--muted); }
    .detail { padding:12px; }
    .detail h2 { margin:0 0 6px; font-size:18px; }
    .summary { margin:0 0 12px; color:rgba(255,255,255,.78); font-size:13px; }
    .badges { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
    .badge { padding:4px 7px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.055); font-size:11px; }
    .section-title { margin:12px 0 5px; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.07em; }
    .text { margin:0; white-space:pre-wrap; color:rgba(255,255,255,.88); }
    .source-note { margin:14px 0 0; color:var(--muted); font-size:10px; }
    .result[aria-pressed="true"] { background:rgba(37,99,235,.28); border-color:rgba(96,165,250,.55); }
    .topic { width:100%; min-height:32px; display:flex; align-items:center; gap:6px; text-align:left; font-weight:700; }
    .topic::before { content:"▸"; color:var(--muted); font-size:10px; }
    .topic[aria-expanded="true"]::before { content:"▾"; }
    .section-label { margin:6px 2px 0; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
    .more { padding:6px 4px; color:var(--muted); font-size:10px; text-align:center; }
    .crumbs { display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-bottom:6px; color:var(--muted); font-size:11px; }
    .crumb { min-height:0; padding:2px 7px; border-radius:7px; font-size:11px; }
    .back { min-height:26px; padding:3px 9px; margin-bottom:8px; }
    .badge.optional { border-color:rgba(251,191,36,.55); color:#fde68a; }
    .related { display:flex; flex-wrap:wrap; gap:5px; }
    .chip { min-height:26px; padding:3px 9px; font-size:11px; }
    .packs-toggle { flex:0 0 auto; min-height:26px; padding:3px 10px; font-size:11px; }
    .packs-toggle[aria-pressed="true"] { background:rgba(37,99,235,.42); border-color:rgba(96,165,250,.72); }
    .panel.packs-open .tabs, .panel.packs-open #search, .panel.packs-open .content, .panel.packs-open .source-filter { display:none; }
    .source-filter { display:flex; flex-wrap:wrap; align-items:center; gap:5px; }
    .source-filter[hidden] { display:none; }
    .source-chip { min-height:26px; padding:3px 9px; font-size:11px; color:var(--muted); }
    .source-chip[aria-pressed="true"] { color:#fff; background:rgba(37,99,235,.28); border-color:rgba(96,165,250,.55); }
    .packs { min-height:0; flex:1 1 auto; display:flex; flex-direction:column; gap:10px; overflow-y:auto; padding:12px; border:1px solid var(--line); border-radius:11px; background:rgba(0,0,0,.20); }
    .packs[hidden] { display:none; }
    .packs-intro { margin:0; color:rgba(255,255,255,.78); }
    .pack-list { display:flex; flex-direction:column; gap:6px; }
    .pack-row { display:flex; align-items:center; gap:8px; padding:8px; border:1px solid var(--line); border-radius:9px; background:rgba(255,255,255,.04); }
    .pack-info { min-width:0; flex:1 1 auto; display:flex; flex-direction:column; gap:2px; }
    .pack-info small { color:var(--muted); font-size:10px; }
    .pack-actions { display:flex; gap:6px; }
    .packs-message { margin:0; font-size:11px; color:var(--muted); }
    .packs-message.ok { color:#bbf7d0; }
    .packs-message.error { color:#fecaca; }
    @media (max-width:520px) { .content { grid-template-columns:1fr; grid-template-rows:150px minmax(0,1fr); } }
  </style>
  <script type="module" crossorigin src="/assets/referenceModal-huz3XwZ1.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/constants-Cz421rMH.js">
  <link rel="modulepreload" crossorigin href="/assets/index-C7oC19nY.js">
  <link rel="modulepreload" crossorigin href="/assets/popoverDrag-BShgVb6O.js">
  <link rel="modulepreload" crossorigin href="/assets/preload-helper-BXl3LOEh.js">
  <link rel="modulepreload" crossorigin href="/assets/fiveToolsArchiveCore-tLcUxIcx.js">
  <link rel="modulepreload" crossorigin href="/assets/privatePackCore-BvP_zfiY.js">
  <link rel="modulepreload" crossorigin href="/assets/fiveToolsArchiveStore-CYN1Ttv5.js">
  <link rel="modulepreload" crossorigin href="/assets/privatePackStore-cNlhttO7.js">
  <link rel="modulepreload" crossorigin href="/assets/rulesTextView-Cgrjw5AW.js">
</head>
<body>
  <div class="shell" data-glass-popover="1" data-popover-id="com.thebigpicture.initiative/reference-modal">
    <main class="panel">
      <header class="heading" data-drag-handle draggable="true" title="Trascina per spostare"><h1>Enciclopedia DM</h1><button id="packsToggle" class="packs-toggle" type="button" aria-pressed="false" title="Testi privati dei manuali">Pacchetti</button></header>
      <button class="close" id="close" type="button" title="Chiudi">×</button>
      <div class="tabs" role="tablist" aria-label="Tipo di riferimento">
        <button type="button" data-tab="conditions" class="active" aria-selected="true">Condizioni</button>
        <button type="button" data-tab="spells" aria-selected="false">Incantesimi</button>
        <button type="button" data-tab="rules" aria-selected="false">Regole</button>
      </div>
      <input id="search" type="search" placeholder="Cerca una voce…" aria-label="Cerca nell'enciclopedia" autocomplete="off" />
      <div id="sources" class="source-filter" role="group" aria-label="Fonti delle regole" hidden></div>
      <div class="content">
        <section id="results" class="results" aria-label="Risultati"></section>
        <article id="detail" class="detail" aria-live="polite"></article>
      </div>
      <section id="packs" class="packs" aria-label="Pacchetti privati" hidden></section>
    </main>
  </div>
</body>
</html>
