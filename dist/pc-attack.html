<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attacco</title>
  <link rel="stylesheet" href="/ui-typography.css" />
  <link rel="stylesheet" href="/popover-glass.css" />
  <link rel="stylesheet" href="/console-shell.css" />
  <link rel="stylesheet" href="/rules-text.css" />
  <style>
    /* The action costs' colours (Baldur's Gate 3); the console's other colour names are console-shell.css's. */
    :root {
      --cost-action: #4ade80;
      --cost-bonus: #fb923c;
      --cost-reaction: #c084fc;
      /* The panel's grid: the labels' column, the column of a row's checkbox or remove. */
      --form-label: 58px;
      --lead: 16px;
    }
    .glass-shell { position: relative; }
    /* The header says who acts, on one line: what it does is under the picker. Its grip sits in the gutter: the name starts
       on the panel's one left edge. */
    .header { min-height: 40px; padding-top: var(--obrt-space-xs); padding-bottom: var(--obrt-space-xs); padding-left: 0; }
    .header .icon-button { width: var(--obrt-hit-min); height: var(--obrt-hit-min); }
    /* The actor's name; an amber pill when it acts on another's turn. */
    .title-row { min-width: 0; display: flex; align-items: center; gap: 6px; }
    .turn-badge { flex: 0 0 auto; padding: 1px 6px; border: 1px solid rgba(253, 230, 138, .42); border-radius: var(--obrt-radius-pill); background: rgba(161, 98, 7, .30); color: var(--warn-text); font-size: var(--obrt-type-caption); font-weight: var(--obrt-weight-semibold); }
    /* The menu of the header's ⋯: the turn auto-open (pcAttackTurnController.js), local to this browser. */
    .more-menu { position: absolute; z-index: 20; top: 42px; right: var(--obrt-space-xl); width: 220px; display: grid; gap: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); box-shadow: 0 12px 28px rgba(0, 0, 0, .45); }
    .more-title { margin: 0; font-size: var(--obrt-type-secondary); font-weight: var(--obrt-weight-semibold); }
    .more-option { display: flex; align-items: center; gap: 6px; min-height: var(--obrt-hit-min); cursor: pointer; }
    .more-option input { width: 15px; height: 15px; margin: 0; accent-color: var(--obrt-accent); cursor: pointer; }
    .more-hint { margin: 0; color: var(--muted); font-size: var(--obrt-type-secondary); line-height: 1.3; text-wrap: pretty; }
    /* Under the header, only when there is somewhere to go: back to the turn's creature, on to the one selected on the map.
       One line: a long name is cut, and the button's tooltip says it in full. Only the bar of a turn that moved takes a line of its own. */
    .switch-row { flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 6px var(--obrt-space-xl); border-bottom: 1px solid var(--line); }
    .switch-row:not(:has(> :not([hidden]))) { display: none; }
    .switch-row:has(> .follow-bar:not([hidden]):not([data-kind="off"])) { flex-wrap: wrap; }
    .switch-row .small { min-width: 0; min-height: var(--obrt-hit-min); overflow: hidden; padding: 2px 8px; color: var(--info-text); font-size: var(--obrt-type-secondary); text-overflow: ellipsis; white-space: nowrap; }
    /* The header drags the console: six dots say so. */
    .drag-grip { flex: 0 0 auto; order: -1; width: 8px; height: 16px; margin-right: -2px; opacity: .45; background-image: radial-gradient(circle, #fff 1px, transparent 1.4px); background-size: 4px 4px; }
    .header:hover .drag-grip { opacity: .75; }
    /* Riduci: only the header stays. */
    body[data-minimized="true"] .panel, body[data-minimized="true"] .more-menu, body[data-minimized="true"] .switch-row, body[data-minimized="true"] .reaction-row, body[data-minimized="true"] .apply-row, body[data-minimized="true"] .status-bar { display: none !important; }
    /* An off-turn action with the creature selected on the map. */
    .use-selected-row { display: flex; min-width: 0; }
    .use-selected { min-width: 0; overflow: hidden; border-color: rgba(96, 165, 250, .45); text-overflow: ellipsis; }
    /* What the action is, in full (it wraps, it is never cut): its name under the picker when the picker does not say it,
       its figures above the damage. */
    .action-facts { margin: 0; color: var(--muted); font-size: var(--obrt-type-secondary); font-variant-numeric: tabular-nums; line-height: 1.3; text-wrap: pretty; }
    .action-facts:empty { display: none; }
    .picker:not([hidden]) + .action-facts { margin-top: -6px; }
    /* Under the menu it describes, level with its text: not in the labels' column. */
    .picker:has(.picker-dropdown:not([hidden])) + .action-facts, .picker:has(.picker-dropdown:not([hidden])) ~ .caster-state { padding-left: calc(var(--form-label) + var(--obrt-space-md) + 11px); }
    #pc-attack-multiattack { margin-top: -6px; line-height: 1.3; text-wrap: pretty; }
    /* One scroll: the console's view fills the panel, and in the spells and features tabs the list takes the height left. */
    .panel { display: flex; flex-direction: column; padding: var(--obrt-space-xl); }
    .panel > .view { flex: 1 1 auto; min-height: 0; }
    /* Room between what are separate steps: the attack, the target, the outcome, the damage. */
    .view { gap: var(--obrt-space-xl); }
    .muted { margin: 0; color: var(--muted); font-size: var(--obrt-type-secondary); }
    /* Sections: the attack and the target are a form on the panel, what follows them is what gets filled in: in a box. */
    .card { display: grid; gap: var(--obrt-space-md); }
    #pc-attack-attack-view:not([data-area="true"]) > .card:not(.target-card) { display: flex; flex-direction: column; padding: var(--obrt-space-lg) var(--obrt-space-xl); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
    #pc-attack-attack-view[data-area="true"] .area-list { padding: var(--obrt-space-md) var(--obrt-space-sm); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
    .card-note { color: var(--muted); font-size: var(--obrt-type-secondary); line-height: 1.3; text-wrap: pretty; }
    .block { display: grid; gap: 6px; }
    /* A label and its control, on one grid: the attack, the target, the roll. */
    .form-row { display: grid; grid-template-columns: var(--form-label) minmax(0, 1fr); align-items: center; column-gap: var(--obrt-space-md); }
    .form-row:not(:has(> :not(.form-label):not([hidden]))) { display: none; }
    .form-label { color: var(--muted); font-size: var(--obrt-type-secondary); }
    /* The target card: the same two columns; «Creature colpite», the area, the hint and Quivering Palm below, full width. */
    .target-card { grid-template-columns: var(--form-label) minmax(0, 1fr); align-items: center; column-gap: var(--obrt-space-md); }
    .target-card > :not(.form-label):not(.picker-dropdown):not(.target-select) { grid-column: 1 / -1; }
    .target-select { width: 100%; min-height: var(--obrt-h-control-md); padding: 0 10px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); }
    .hint { margin: 0; color: var(--warn-text); font-size: var(--obrt-type-secondary); }
    /* What the target meets or can do about this attack, one row each: the datum that counts and its button, the rule in its
       tooltip. No colour of their own: orange and purple are the costs'. Mirror Image: the d20 to aim at a duplicate. */
    .mirror-image { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: var(--obrt-hit-min); }
    .mirror-image[hidden] { display: none; }
    .mirror-image-note { margin: 0; min-width: 0; font-size: var(--obrt-type-secondary); line-height: 1.3; }
    .mirror-image .mini-button { flex: 0 0 auto; }
    /* CAP-REACTION: the target's Sanctuary, the retaliation of its shield and the reactions it can still cast. */
    .attack-reactions { display: grid; gap: 2px; }
    .attack-reactions[hidden] { display: none; }
    .attack-reaction { display: flex; align-items: center; gap: 6px; min-height: var(--obrt-hit-min); }
    .attack-reaction-note { margin: 0; flex: 1 1 auto; min-width: 0; font-size: var(--obrt-type-secondary); line-height: 1.3; }
    .attack-reaction-amount { flex: 0 0 52px; width: 52px; min-height: 24px; padding: 2px 4px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); color: inherit; }
    .attack-reaction .mini-button { flex: 0 0 auto; }
    /* The picker: weapon attacks, cantrips and attack spells of the actor, one tab each, then the entry. */
    .picker { flex: 0 0 auto; display: flex; flex-direction: column; gap: var(--obrt-space-lg); }
    /* A long list gives way down to its 132 px, never under the card below it: the tabs, the search and that much stay. */
    .picker:has(> .picker-list:not([hidden]):not([data-short="true"])) { flex: 0 1 auto; min-height: calc(var(--obrt-hit-min) + 1px + 10px + 132px); }
    .picker:has(> .picker-list:not([hidden]):not([data-short="true"])):has(> .picker-search:not([hidden])) { min-height: calc(var(--obrt-hit-min) * 2 + 1px + 20px + 132px); }
    /* Only the list gives way: the tabs would otherwise shrink to nothing. */
    .picker > :not(.picker-list) { flex: 0 0 auto; }
    /* Tabs change page: light and underlined, so that the outcome stays the panel's strongest control. */
    .picker-tabs { display: flex; gap: 14px; overflow: visible; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none; }
    .picker-tabs button { min-height: var(--obrt-hit-min); padding: 0; border: 0; background: none; color: var(--muted); }
    .picker-tabs button:hover { color: #fff; }
    .picker-tabs button[aria-pressed="true"] { color: #fff; background: none; box-shadow: inset 0 -2px 0 #60a5fa; }
    /* The spells tab: a list by level instead of a select (every spell in view, one click each), in a box of its own: where
       the list ends and the card of what is chosen begins. A short list is as tall as its rows (filterPicker). The rows take
       the list's columns, so that the cost starts at one point on every row and the uses end on the right. */
    .picker-list, .picker-menu { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-content: start; row-gap: 2px; }
    .picker-list { flex: 0 1 auto; min-height: 132px; overflow-y: auto; padding: 4px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
    .picker-list[data-short="true"] { min-height: 0; }
    .picker-list > .picker-level, .picker-list > .picker-row, .picker-menu > .picker-row { grid-column: 1 / -1; }
    .picker-list > .picker-row, .picker-menu > .picker-row { display: grid; grid-template-columns: subgrid; }
    /* A group starts under a line. */
    .picker-list > .picker-level:not(:first-child) { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); border-top-left-radius: 0; border-top-right-radius: 0; }
    .picker-level { padding: 4px 8px 4px; color: var(--muted); font-size: var(--obrt-type-caption); font-weight: var(--obrt-weight-bold); letter-spacing: var(--obrt-tracking-wide); text-transform: uppercase; }
    .picker-row { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 30px; padding: 3px 8px; border: 1px solid transparent; border-radius: var(--obrt-radius-md); background: transparent; text-align: left; cursor: pointer; }
    .picker-row:hover { background: var(--obrt-hover); }
    .picker-row[aria-pressed="true"] { border-color: rgba(96, 165, 250, .55); background: rgba(37, 99, 235, .28); }
    .picker-row:disabled { cursor: default; opacity: .6; }
    /* The attacks' and cantrips' dropdown: the entry in use with its cost on the right; its menu, the list's rows. */
    .picker-dropdown { position: relative; }
    .picker-dropdown-button { width: 100%; display: flex; align-items: center; gap: 8px; min-height: var(--obrt-h-control-md); padding: 0 10px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); text-align: left; cursor: pointer; }
    .picker-dropdown-button .picker-row-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .picker-dropdown-button[aria-expanded="true"] { border-color: rgba(96, 165, 250, .7); }
    .picker-dropdown-button:disabled { cursor: default; opacity: .6; }
    .picker-dropdown-caret { flex: 0 0 auto; width: 12px; height: 8px; background: var(--obrt-select-caret-image) no-repeat center / 12px 8px; }
    .picker-menu { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0; max-height: 264px; overflow-y: auto; padding: 4px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface); box-shadow: 0 12px 28px rgba(0, 0, 0, .45); }
    /* The rows' text under the text of the menu's button. */
    .picker-menu .picker-row { padding-inline: 5px; }
    /* A target's hit points, on the right of its row and of its menu's button: the name gives way, they never do. */
    .picker-row-hp { flex: 0 0 auto; color: var(--muted); font-size: var(--obrt-type-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .picker-search { width: 100%; min-height: var(--obrt-hit-min); padding: 2px var(--obrt-space-md); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); outline: none; background: var(--surface); font-size: var(--obrt-type-secondary); }
    .picker-search:focus { border-color: rgba(96, 165, 250, .7); }
    /* The features to read, folded under their header (the number of entries, an arrow that turns when open). */
    .picker-level[data-count] { display: flex; align-items: center; gap: 6px; cursor: pointer; border-radius: var(--obrt-radius-md); }
    .picker-level[data-count]:hover { color: var(--text); }
    .picker-level[data-count]::after { content: attr(data-count); order: 1; margin-left: auto; letter-spacing: 0; font-variant-numeric: tabular-nums; }
    /* One arrow in the panel, the menus' chevron: to the right while closed, down when open. */
    .picker-level[data-count]::before, .spell-details summary::after { content: ""; flex: 0 0 auto; width: 9px; height: 6px; background: var(--obrt-select-caret-image) no-repeat center / 9px 6px; opacity: .7; transform: rotate(-90deg); }
    .picker-level[data-count]::before { order: 2; }
    .picker-level[data-count][data-open="true"]::before, .spell-details[open] > summary::after { transform: none; }
    .picker-level[data-count]:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
    /* No use or slot left: the row fades, its uses turn yellow (red is for damage). */
    .picker-row[data-exhausted="true"] { opacity: .62; }
    .picker-row-marks .tag-sep { margin: 0 4px; color: var(--dim); }
    /* The uses left, in one form everywhere: the number, on the right, what it counts in its tooltip. */
    .uses-badge, .component-uses { color: var(--text); font-weight: var(--obrt-weight-semibold); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .uses-badge[data-zero="true"] { color: var(--warn-text); }
    .component-uses { margin-left: auto; font-size: var(--obrt-type-secondary); }
    .component-uses:empty { display: none; }
    /* A spell level's slots, on the right of its header (data-slots, red when none is left). */
    .picker-level[data-slots] { display: flex; justify-content: space-between; gap: 8px; }
    .picker-level[data-slots]::after { content: attr(data-slots); letter-spacing: 0; text-transform: none; font-weight: var(--obrt-weight-semibold); font-variant-numeric: tabular-nums; color: var(--muted); }
    .picker-level[data-slots-zero="true"]::after { color: var(--warn-text); }
    .picker-row-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* After the name: the kind of attack, the cost from one left edge, the marks and the uses against the right. An empty
       cell takes no room. */
    .picker-row-range, .picker-row-cost, .picker-row-marks { flex: 0 0 auto; color: var(--muted); font-size: var(--obrt-type-secondary); white-space: nowrap; }
    .picker-row-range:not(:empty), .picker-row-cost:not(:empty), .picker-row-marks:not(:empty) { padding-left: 10px; }
    .picker-row-marks { justify-self: end; text-align: right; }
    /* On the menu's button the cells only follow each other, and leave all the room they can to the name. */
    .picker-dropdown-button .picker-row-range, .picker-dropdown-button .picker-row-cost, .picker-dropdown-button .picker-row-marks { padding-left: 0; }
    .picker-dropdown-button > :empty:not(.picker-dropdown-caret) { display: none; }
    /* Action costs, as in Baldur's Gate 3: Azione green (circle), Azione bonus orange (triangle), Reazione purple
       (diamond), on the list rows, the feature's pill and the fixed row. */
    .cost-tag[data-cost] { font-weight: var(--obrt-weight-bold); white-space: nowrap; }
    .cost-tag[data-cost]::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 4px; vertical-align: 1px; background: currentColor; }
    .cost-tag[data-cost="action"] { color: var(--cost-action); }
    .cost-tag[data-cost="action"]::before { border-radius: 50%; }
    .cost-tag[data-cost="bonus"] { color: var(--cost-bonus); }
    .cost-tag[data-cost="bonus"]::before { width: 8px; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    .cost-tag[data-cost="reaction"] { color: var(--cost-reaction); }
    .cost-tag[data-cost="reaction"]::before { width: 6px; height: 6px; transform: rotate(45deg); }
    /* Cantrips and spells: the slots left and the concentration in progress; a spell the console does not resolve. */
    .caster-state { display: flex; flex-wrap: wrap; gap: 2px 10px; margin: 0; color: var(--muted); font-size: var(--obrt-type-secondary); font-variant-numeric: tabular-nums; }
    /* A long text (Forma Selvatica's details) scrolls inside its card instead of covering the list above it. */
    .launch { gap: var(--obrt-space-md); overflow-y: auto; align-content: start; padding: var(--obrt-space-lg) var(--obrt-space-xl); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
    /* Its title: the entry chosen, and what its words refer to. */
    .launch-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
    .launch-title { font-size: var(--obrt-type-card-title); font-weight: var(--obrt-weight-semibold); }
    .launch-words { color: var(--muted); font-size: var(--obrt-type-secondary); }
    /* A feature's form (the character sheet's inputs): a label over its select or number. */
    .feature-field { display: grid; gap: 3px; }
    .feature-field-label { color: var(--muted); font-size: var(--obrt-type-secondary); }
    .feature-field-hint { color: var(--muted); font-size: var(--obrt-type-secondary); }
    /* Who a feature acting on the map selection reaches ("Su:"), in yellow when a creature must be selected first. */
    .feature-target { display: flex; align-items: baseline; gap: 8px; margin: 0; }
    .feature-target-text { min-width: 0; font-weight: var(--obrt-weight-semibold); overflow-wrap: anywhere; }
    .feature-target[data-warning="true"] .feature-target-text { color: var(--warn-text); font-weight: var(--obrt-weight-regular); }
    .feature-check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .feature-check input { width: 15px; height: 15px; margin: 0; accent-color: var(--obrt-accent); }
    /* The spell's details: an accordion with its facts and its text; Lancia stays in the fixed row below. */
    .spell-details summary { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: var(--obrt-hit-min); list-style: none; cursor: pointer; color: var(--muted); font-size: var(--obrt-type-secondary); font-weight: var(--obrt-weight-semibold); user-select: none; }
    .spell-details summary:hover { color: var(--text); }
    .spell-details summary::-webkit-details-marker { display: none; }
    .spell-details[open] summary { margin-bottom: 6px; }
    .spell-details, .spell-details-body { display: grid; gap: 6px; }
    /* Closed, nothing to keep apart from its title. */
    .spell-details:not([open]) { gap: 0; }
    .spell-details > :not(summary) + :not(summary) { margin-top: 8px; }
    .spell-text { margin: 0; font-size: var(--obrt-type-secondary); line-height: 1.4; text-wrap: pretty; white-space: pre-line; }
    .spell-rules { font-size: var(--obrt-type-secondary); line-height: 1.4; }
    /* The turn moved on while an attack is in progress: the console waits for the GM (pcAttackTurnController.js). */
    .follow-bar { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 8px; padding: 6px 10px; border: 1px solid rgba(253, 230, 138, .45); border-radius: var(--obrt-radius-md); background: rgba(161, 98, 7, .18); color: var(--warn-text); font-size: var(--obrt-type-secondary); }
    /* A long name sends the button to the next line, instead of squeezing the sentence into a column. */
    .follow-bar > span { flex: 1 1 110px; min-width: 0; text-wrap: pretty; }
    .follow-bar > button { flex: 0 1 auto; max-width: 100%; margin-left: auto; }
    /* Off turn only its button: the pill in the header says the rest. */
    .follow-bar[data-kind="off"] { flex: 0 1 auto; flex-wrap: nowrap; min-width: 0; padding: 0; border: 0; border-radius: 0; background: none; }
    .follow-bar.ready { border-color: rgba(96, 165, 250, .55); background: rgba(37, 99, 235, .22); color: var(--info-text); }
    .follow-bar .follow-ready { min-width: 0; min-height: var(--obrt-h-control-md); overflow: hidden; padding: 4px 12px; text-overflow: ellipsis; white-space: nowrap; }
    .launch-details { margin: 0; color: var(--muted); font-size: var(--obrt-type-secondary); line-height: 1.35; text-wrap: pretty; }
    .launch-note { margin: 0; font-size: var(--obrt-type-secondary); line-height: 1.35; text-wrap: pretty; }
    .launch-note.warning { color: var(--warn-text); }
    .launch .apply { justify-self: end; }
    /* The damage card: the cantrip or spell controls, the damage rows and extras, then the notes and Dettagli at the bottom
       (the cantrip row's children join the card's grid to be ordered). */
    .cantrip-row { display: contents; }
    #pc-attack-facts, #pc-attack-damage { order: 1; }
    #pc-attack-extras-section { order: 2; }
    .cantrip-note { order: 4; }
    #pc-attack-spell-details { order: 5; }
    .cantrip-note { margin: 0; color: var(--muted); font-size: var(--obrt-type-secondary); line-height: 1.35; text-wrap: pretty; }
    /* A monster's note: the part of its action the table resolves by hand, under the damage. */
    .monster-note { order: 3; margin: 0; color: var(--muted); font-size: var(--obrt-type-secondary); line-height: 1.35; text-wrap: pretty; }
    /* What a monster's attack adds on a hit, under its damage rows. */
    .hit-effect { display: grid; gap: 4px; margin-top: 2px; }
    .hit-effect > .segmented { justify-self: start; }
    .spell-controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .segmented button[aria-pressed="true"][data-outcome=critical] { color: var(--warn-text); background: rgba(161, 98, 7, .45); }
    /* One grid for every damage row (weapon, rider, added component): a lead column only with a checkbox or a remove, the
       name with its dice on the same line, the amount always in the same right column, which gives way when it is hidden. */
    .component-list { display: grid; gap: var(--obrt-space-xs); }
    .component-list:empty { display: none; }

      <p class="more-title">Apri da sola a ogni turno</p>
      <label class="more-option" title="A ogni turno di un personaggio o alleato con attacchi"><input type="checkbox" id="pc-attack-auto-open" /><span>Personaggi e alleati</span></label>
      <label class="more-option" title="A ogni turno di un mostro con attacchi; ai boss si apre la console Boss"><input type="checkbox" id="pc-attack-auto-open-monsters" /><span>Mostri</span></label>
      <p class="more-hint">Ai boss si apre la console Boss. Vale solo in questo browser.</p>
    </div>
    <div class="switch-row" id="pc-attack-switch-row">
      <div class="follow-bar" id="pc-attack-follow" role="status" hidden></div>
      <div class="use-selected-row" id="pc-attack-use-selected-row" hidden><button class="small use-selected" id="pc-attack-use-selected" type="button" hidden>⇄ Agisci</button></div>
    </div>
    <main class="panel">
      <section class="view" id="pc-attack-form" aria-label="Attacco" hidden>
        <section class="picker" id="pc-attack-picker" aria-label="Scelta dell'attacco" hidden>
          <div class="segmented picker-tabs" id="pc-attack-picker-tabs" role="group" aria-label="Tipo di attacco"></div>
          <div class="form-row">
            <span class="form-label" id="pc-attack-picker-caption">Attacco</span>
            <div class="picker-dropdown" id="pc-attack-picker-dropdown" hidden>
              <button class="picker-dropdown-button" id="pc-attack-picker-dropdown-button" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Attacco"></button>
              <div class="picker-menu" id="pc-attack-picker-menu" role="group" aria-label="Attacchi" hidden></div>
            </div>
            <select class="target-select" id="pc-attack-picker-select" aria-label="Attacco"></select>
          </div>
          <input class="picker-search" id="pc-attack-picker-search" type="search" autocomplete="off" spellcheck="false" aria-label="Cerca nell'elenco" hidden />
          <div class="picker-list" id="pc-attack-picker-list" role="group" aria-label="Incantesimi" hidden></div>
        </section>
        <p class="action-facts" id="pc-attack-subtitle"></p>
        <p class="caster-state" id="pc-attack-caster" hidden></p>
        <p class="caster-state" id="pc-attack-multiattack" hidden></p>
        <section class="grapple" id="pc-attack-grapple" aria-label="Presa" hidden></section>
        <section class="card launch" id="pc-attack-launch" aria-label="Incantesimo" hidden></section>
        <section class="card maneuver" id="pc-attack-maneuver" aria-label="Manovra" hidden>
          <div class="form-row">
            <span class="form-label">Bersaglio</span>
            <div class="picker-dropdown" id="pc-attack-maneuver-dropdown">
              <button class="picker-dropdown-button" id="pc-attack-maneuver-button" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Bersaglio della manovra"></button>
              <div class="picker-menu" id="pc-attack-maneuver-menu" role="group" aria-label="Bersagli" hidden></div>
            </div>
            <select class="target-select" id="pc-attack-maneuver-target" aria-label="Bersaglio della manovra" hidden></select>
          </div>
          <p class="hint" id="pc-attack-maneuver-hint" hidden></p>
          <div class="segmented" id="pc-attack-maneuver-effects" role="group" aria-label="Effetto della spinta" hidden></div>
          <div class="maneuver-box">
            <div class="maneuver-head"><span class="caption">Prova contrapposta</span><span class="card-note" id="pc-attack-maneuver-contest"></span></div>
            <div class="segmented" id="pc-attack-maneuver-outcomes" role="group" aria-label="Esito della prova contrapposta"></div>
            <p class="launch-note" id="pc-attack-maneuver-note"></p>
          </div>
        </section>
        <div class="view" id="pc-attack-attack-view">
        <div class="form-row"><span class="form-label" id="pc-attack-mode-caption" hidden>Tiro</span><select class="target-select" id="pc-attack-mode" aria-label="Tiro" hidden></select></div>
        <section class="card target-card" aria-label="Bersaglio">
          <span class="form-label" id="pc-attack-target-caption">Bersaglio</span>
          <div class="picker-dropdown" id="pc-attack-target-dropdown">
            <button class="picker-dropdown-button" id="pc-attack-target-button" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Bersaglio"></button>
            <div class="picker-menu" id="pc-attack-target-menu" role="group" aria-label="Bersagli" hidden></div>
          </div>
          <select class="target-select" id="pc-attack-target" aria-label="Bersaglio" hidden></select>
          <div class="area" id="pc-attack-area" hidden>
            <div class="section-head">
              <span class="caption">Creature colpite</span>
              <span class="area-tools">
                <button class="area-tool" id="pc-attack-area-propose" type="button" title="Riprendi le creature vicine dalla mappa">Proponi</button>
                <button class="area-tool" id="pc-attack-area-draw" type="button" title="Disegna l'area sulla mappa: le creature al suo interno vengono spuntate" hidden>Disegna</button>
                <button class="area-tool" id="pc-attack-area-all-failed" type="button">Tutti falliti</button>
                <button class="area-tool" id="pc-attack-area-all-passed" type="button">Tutti superati</button>
              </span>
            </div>
            <div class="area-list" id="pc-attack-area-list"></div>
          </div>
          <p class="hint" id="pc-attack-target-hint" hidden></p>
          <div class="mirror-image" id="pc-attack-mirror-image" hidden>
            <p class="mirror-image-note" id="pc-attack-mirror-image-note"></p>
            <button class="mini-button" id="pc-attack-mirror-image-hit" type="button">Duplicato colpito</button>
          </div>
          <div class="attack-reactions" id="pc-attack-reactions" hidden></div>
          <div class="palm" id="pc-attack-palm" hidden>
            <div class="palm-head"><span class="palm-title">Palmo Tremante</span><span class="card-note" id="pc-attack-palm-note"></span></div>
            <div class="segmented mini" id="pc-attack-palm-outcomes" role="group" aria-label="Fine delle vibrazioni"></div>
            <div class="palm-row">
              <input class="amount" id="pc-attack-palm-amount" type="number" min="0" step="1" inputmode="numeric" aria-label="Danni necrotici (10d10)" hidden />
              <button class="small" id="pc-attack-palm-apply" type="button">Termina le vibrazioni</button>
            </div>
          </div>
        </section>
        <section class="block" aria-label="Esito" id="pc-attack-outcome-block">
          <div class="segmented" id="pc-attack-outcomes" role="group" aria-label="Esito dell'attacco"></div>
        </section>
        <section class="card" aria-label="Danno">
          <div class="cantrip-row" id="pc-attack-cantrip-row" hidden>
            <select class="target-select" id="pc-attack-cantrip" aria-label="Trucchetto"></select>
            <div class="spell-controls" id="pc-attack-spell-controls" hidden></div>
            <p class="cantrip-note" id="pc-attack-cantrip-note" hidden></p>
            <details class="spell-details" id="pc-attack-spell-details" hidden><summary>Dettagli</summary><div class="spell-details-body" id="pc-attack-spell-details-body"></div></details>
          </div>
          <p class="action-facts" id="pc-attack-facts"></p>
          <div class="component-list" id="pc-attack-damage"></div>
          <p class="monster-note" id="pc-attack-monster-note" hidden></p>
          <div class="extras-section" id="pc-attack-extras-section" hidden>
            <div class="section-head"><span class="caption" id="pc-attack-extras-caption">Extra al colpo</span><button class="add-extra" id="pc-attack-add-extra" type="button">+ Danno extra</button></div>
            <div class="component-list" id="pc-attack-woven"></div>
            <div class="component-list" id="pc-attack-riders"></div>
            <span class="subcaption" id="pc-attack-activations-caption" hidden>Attivazioni</span>
            <div class="component-list" id="pc-attack-activations"></div>
            <div class="component-list" id="pc-attack-extras"></div>
          </div>
        </section>
        </div>
      </section>
    </main>
    <div class="reaction-row" id="pc-attack-reaction" hidden></div>
    <div class="apply-row" id="pc-attack-apply-row" hidden><div class="defense-chips" id="pc-attack-defenses"></div><span class="total" id="pc-attack-total"></span><button class="apply" id="pc-attack-apply" type="button">Registra</button><button class="apply primary" id="pc-attack-launch-button" type="button" hidden>Lancia</button></div>
    <footer class="status-bar"><p class="status" id="pc-attack-status" role="status" aria-live="polite"></p><button class="small" id="pc-attack-undo" type="button" hidden>Annulla</button></footer>
  </div>
</body>
</html>
