<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azione incantesimo</title>
    <link rel="stylesheet" href="/ui-typography.css" />
    <link rel="stylesheet" href="/popover-glass.css" />
    <link rel="stylesheet" href="/console-shell.css" />
    <link rel="stylesheet" href="/console-panel.css" />
    <link rel="stylesheet" href="/spell-popover.css" />
    <style>
      .header-copy { display: flex; align-items: center; gap: var(--obrt-space-xs); cursor: grab; }
      .header-copy .drag-grip { order: 0; }
      /* The choices in a box, one per row at the lists' pitch: the name on the left, what it does on the right. */
      .actions { display: grid; grid-template-columns: auto minmax(0, 1fr); row-gap: var(--list-gap); padding: 4px; border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
      .action { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; column-gap: var(--obrt-space-xl); min-height: 30px; padding: 1px 8px; border-color: transparent; background: transparent; font-weight: var(--obrt-weight-regular); text-align: left; }
      .action:hover:not(:disabled) { background: var(--obrt-hover); }
      .action strong { font-weight: var(--obrt-weight-semibold); white-space: nowrap; }
      .action span { min-width: 0; color: var(--muted); font-size: var(--obrt-type-secondary); line-height: 1.25; text-align: right; text-wrap: pretty; }
      /* A single action is no list: the main button. */
      #app[data-mode="compact"] .actions { grid-template-columns: minmax(0, 1fr); padding: 0; border: 0; background: none; }
      .action--compact { display: block; min-height: var(--obrt-h-control-lg); padding: 0 var(--obrt-space-md); border-color: var(--obrt-btn-primary-border); background: var(--obrt-btn-primary-bg); font-weight: var(--obrt-weight-bold); text-align: center; }
      .action--compact:hover:not(:disabled) { background: var(--obrt-btn-primary-bg-hover); }
      .action--compact strong { font:inherit; }
      .field { display:grid; grid-template-columns:var(--form-label) minmax(0,1fr); align-items:center; column-gap:var(--obrt-space-md); }
      .field label { color:var(--muted); font-size:var(--obrt-type-secondary); font-weight:var(--obrt-weight-regular); }
    </style>
    <script type="module" crossorigin src="/assets/spellTurnActionChoice-DUsjhAek.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/constants-Vbp0f9BE.js">
    <link rel="modulepreload" crossorigin href="/assets/index-C7oC19nY.js">
    <link rel="modulepreload" crossorigin href="/assets/distance3dCore-Bt5E3JNv.js">
    <link rel="modulepreload" crossorigin href="/assets/spellAreaPlacementCore-BQf9R4nB.js">
    <link rel="modulepreload" crossorigin href="/assets/popoverDrag--L1JqoSi.js">
  </head>
  <body>
    <main id="app" class="glass-shell" data-glass-popover="1">
      <div class="header">
        <div class="header-copy" data-drag-handle draggable="true" title="Trascina per spostare">
          <span class="drag-grip" aria-hidden="true"></span>
          <div class="heading-title-group">
            <h1 id="title" class="title">Azione</h1>
            <div id="subtitle" class="subtitle" hidden></div>
          </div>
        </div>
        <button id="close" class="icon-button" type="button" title="Chiudi" aria-label="Chiudi">×</button>
      </div>
      <div class="panel"><div class="view">
        <div id="hint" class="hint" hidden></div>
        <div id="targetField" class="field" hidden>
          <label for="target">Bersaglio</label>
          <select id="target"><option value="">Seleziona il bersaglio</option></select>
        </div>
        <div id="actions" class="actions"></div>
      </div></div>
      <footer class="status-bar"><p id="status" class="status" role="status" aria-live="polite" hidden></p></footer>
    </main>
  </body>
</html>
