    .card {
      position:relative; margin:6px; padding:14px 16px 12px; border-radius:14px; overflow:hidden;

      background:
        radial-gradient(circle at 50% -20%, rgba(239,68,68,.35), transparent 60%),
        linear-gradient(160deg, rgba(40,8,12,.97), rgba(10,10,16,.97));
      box-shadow:0 10px 30px rgba(0,0,0,.6), inset 0 0 40px rgba(127,29,29,.35);
      animation:pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { box-shadow:0 10px 30px rgba(0,0,0,.6), inset 0 0 55px rgba(185,28,28,.5); } }
    .close { position:absolute; top:8px; right:8px; width:26px; height:26px; border:0; border-radius:8px; color:#fff; background:transparent; font-size:18px; cursor:pointer; }
    .close:hover { background:rgba(255,255,255,.08); }
    .header { display:flex; align-items:center; gap:12px; }
    .portrait { flex:0 0 54px; width:54px; height:54px; border-radius:50%; overflow:hidden; border:2px solid #0b0b10;
      box-shadow:0 0 0 2px var(--blood), 0 0 16px rgba(239,68,68,.55); background:#1c0b0e; filter:grayscale(.55) brightness(.85); }
    .portrait img { width:100%; height:100%; object-fit:cover; display:block; }
    .eyebrow { color:#fca5a5; font-size:var(--obrt-type-caption); font-weight:var(--obrt-weight-bold); letter-spacing:.09em; text-transform:uppercase; }
    .name { margin-top:2px; font-size:var(--obrt-type-display); font-weight:var(--obrt-weight-bold); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:250px; }
    .tally { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; margin:14px 0 10px; }
    .track { display:flex; flex-direction:column; align-items:center; gap:5px; }
    .track span { color:rgba(255,255,255,.7); font-size:10px; font-weight:var(--obrt-weight-bold); letter-spacing:.08em; text-transform:uppercase; }
    .marks { display:flex; gap:6px; }
    .mark { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:13px; line-height:1;
      border:2px solid rgba(255,255,255,.25); color:transparent; transition:all .3s; }
    .success.on { border-color:var(--life); background:radial-gradient(circle, #86efac, #16a34a); box-shadow:0 0 10px rgba(74,222,128,.7); }
    .failure { border-radius:6px; }
    .failure.on { border-color:var(--blood); background:radial-gradient(circle, #fca5a5, #b91c1c); color:#1a0505; box-shadow:0 0 10px rgba(239,68,68,.8); }
    .d20 { width:58px; height:58px; display:grid; place-items:center; font-size:20px; font-weight:800; color:#fff;
      background:linear-gradient(160deg, #b91c1c, #450a0a); clip-path:polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
      text-shadow:0 1px 2px #000; }
    .rule { text-align:center; color:rgba(255,255,255,.72); font-size:11px; line-height:1.35; }
    .outcomes { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; }
    .outcomes button { min-height:34px; padding:5px 8px; border-radius:10px; color:#fff; cursor:pointer; font:inherit; font-weight:var(--obrt-weight-bold);
      border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.07); }
    .outcomes button small { display:block; font-weight:400; font-size:10px; opacity:.75; }
    .outcomes button[data-outcome="death-success"] { border-color:rgba(74,222,128,.55); background:rgba(22,163,74,.22); }
    .outcomes button[data-outcome="death-nat20"] { border-color:rgba(250,204,21,.6); background:rgba(202,138,4,.22); }
    .outcomes button[data-outcome="death-failure"] { border-color:rgba(239,68,68,.55); background:rgba(185,28,28,.25); }
    .outcomes button[data-outcome="death-nat1"] { border-color:rgba(239,68,68,.8); background:rgba(127,29,29,.45); }
    .outcomes button:disabled { opacity:.5; cursor:default; }
    .status { min-height:16px; margin-top:8px; text-align:center; font-size:12px; color:#fecaca; }
    .card[data-result="stable"] { border-color:rgba(74,222,128,.6); animation:none; }
    .card[data-result="revived"] { border-color:rgba(250,204,21,.7); animation:none; }
    .card[data-result="dead"] { border-color:#000; animation:none; filter:saturate(.6); }
  </style>
