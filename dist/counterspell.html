      .close:hover { color: #fff; background: rgba(255,255,255,.08); }
      .section { display: flex; flex-direction: column; gap: 5px; }
      .section-title { color: #ddd6fe; font-size: 10.5px; font-weight: 800; }
      .row { display: flex; gap: 6px; align-items: center; }
      .row > :first-child { flex: 1 1 auto; min-width: 0; }
      button, select, input { min-height: 28px; border: 1px solid var(--obrt-spell-control-border); border-radius: 5px; background: var(--obrt-spell-control-bg); color: #f8fafc; font: 600 11.5px system-ui, sans-serif; }
      select, input { padding: 3px 7px; width: 100%; }
      #spellLevel { width: 96px; flex: none; }
      #checkTotal { width: 76px; flex: none; }
      button { padding: 3px 8px; cursor: pointer; }
      button:disabled { opacity: .45; cursor: default; }
      .hint { color: rgba(226,232,240,.68); font-size: 10.5px; line-height: 1.3; }
      .hint[data-tone="warn"] { color: #fde68a; }
      .verdict { display: grid; gap: 7px; padding: 9px; border: 1px solid rgba(196,181,253,.3); border-radius: 7px; background: rgba(15,23,42,.6); }
      .verdict-head { display: flex; align-items: center; gap: 8px; }
      .seal { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; font-size: 17px;
        background: radial-gradient(circle at 35% 30%, #c4b5fd, #6d28d9); box-shadow: 0 0 12px rgba(139,92,246,.6); }
      .verdict-text { font-size: 12px; font-weight: 700; line-height: 1.3; }
      .verdict-text small { display: block; color: rgba(226,232,240,.7); font-weight: 500; }
      .verdict[data-state="countered"] { border-color: rgba(134,239,172,.5); }
      .verdict[data-state="countered"] .seal { background: radial-gradient(circle at 35% 30%, #bbf7d0, #15803d); box-shadow: 0 0 12px rgba(74,222,128,.55); }
      .verdict[data-state="failed"] { border-color: rgba(252,165,165,.5); }
      .verdict[data-state="failed"] .seal { background: radial-gradient(circle at 35% 30%, #fecaca, #b91c1c); box-shadow: 0 0 12px rgba(239,68,68,.5); }
      .outcomes { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
      .outcomes button[aria-pressed="true"][data-result="passed"] { border-color: #86efac; background: rgba(21,128,61,.5); }
      .outcomes button[aria-pressed="true"][data-result="failed"] { border-color: #fca5a5; background: rgba(185,28,28,.5); }
      .check-row { display: flex; align-items: center; gap: 6px; color: rgba(226,232,240,.8); font-size: 11px; }
      .toggle { display: flex; align-items: center; gap: 7px; color: #ede9fe; font-size: 11px; }
      .toggle input { width: 15px; min-height: 15px; height: 15px; accent-color: #a855f7; }
      .primary { min-height: 32px; border-color: var(--obrt-spell-cta-border); background: var(--obrt-spell-cta-bg); box-shadow: var(--obrt-spell-cta-shadow); color: #fff; font-weight: 800; font-size: 12px; }
      .status { min-height: 14px; color: #ddd6fe; font-size: 11px; line-height: 1.3; }
      .status[data-tone="error"] { color: #fca5a5; }
      .status[data-tone="ok"] { color: #bbf7d0; }

  <body>
    <main id="app">
      <header class="heading" data-drag-handle draggable="true">
        <div>
          <div class="eyebrow">Controincantesimo · Abiurazione</div>
          <h1 id="title">…</h1>
        </div>
        <span class="economy" title="Si lancia con la reazione">Reazione</span>
        <button id="close" class="close" type="button" aria-label="Chiudi">×</button>
      </header>
      <section class="section">
        <span class="section-title">Chi sta lanciando l'incantesimo</span>
        <select id="target" aria-label="Lanciatore contrastato"></select>
        <span class="hint" id="rangeHint"></span>
      </section>
      <section class="section">
        <span class="section-title">Incantesimo contrastato</span>
        <div class="row">
          <input id="spell" list="spellList" autocomplete="off" spellcheck="false" placeholder="Cerca o scrivi il nome" aria-label="Incantesimo contrastato" />
          <select id="spellLevel" aria-label="Livello dell'incantesimo"></select>
        </div>
        <datalist id="spellList"></datalist>
        <span class="hint" id="spellHint"></span>
      </section>
      <section class="section">
        <span class="section-title">Slot del Controincantesimo</span>
        <select id="slot" aria-label="Slot del Controincantesimo"></select>
      </section>
      <section class="verdict" id="verdict" data-state="pending">
        <div class="verdict-head"><span class="seal" aria-hidden="true">✦</span><div class="verdict-text" id="verdictText"></div></div>
        <div id="checkBlock" hidden>
          <div class="outcomes" role="group" aria-label="Esito della prova">
            <button type="button" data-result="passed" aria-pressed="false">Prova riuscita</button>
            <button type="button" data-result="failed" aria-pressed="false">Prova fallita</button>
          </div>
          <label class="check-row" style="margin-top:6px">Totale della prova (facoltativo)<input id="checkTotal" type="number" inputmode="numeric" /></label>
        </div>
      </section>
      <label class="toggle" id="targetSlotRow" hidden><input type="checkbox" id="targetSlot" checked /><span id="targetSlotText"></span></label>
      <button id="cast" class="primary" type="button" disabled>Lancia Controincantesimo</button>
      <div class="status" id="status" role="status"></div>
    </main>
