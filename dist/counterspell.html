      .check-row { display: flex; align-items: center; justify-content: space-between; gap: var(--obrt-space-md); color: var(--muted); font-size: var(--obrt-type-secondary); }
      .toggle { display: flex; align-items: center; gap: var(--obrt-space-sm); font-size: var(--obrt-type-secondary); }

  <body>
    <main id="app" class="glass-shell" data-glass-popover="1" data-popover-id="com.thebigpicture.initiative/counterspell">
      <header class="header heading" data-drag-handle draggable="true" title="Trascina per spostare">
        <div class="heading-title-group">
          <h1 id="title" class="title">Controincantesimo</h1>
          <div id="subtitle" class="subtitle" hidden></div>
        </div>
        <span class="drag-grip" aria-hidden="true"></span>
        <div class="heading-actions">
          <span class="cost-tag" data-cost="reaction" title="Si lancia con la reazione">Reazione</span>
          <button id="close" class="icon-button" type="button" title="Chiudi" aria-label="Chiudi">×</button>
        </div>
      </header>
      <div class="panel"><div class="view">
      <div class="form-row"><label class="form-label" for="target">Contro</label><select id="target" aria-label="Lanciatore contrastato"></select></div>
      <div class="hint" id="rangeHint"></div>
      <div class="form-row"><label class="form-label" for="spell">Lancia</label><div class="row">
        <input id="spell" list="spellList" autocomplete="off" spellcheck="false" placeholder="Cerca o scrivi il nome" aria-label="Incantesimo contrastato" />
        <select id="spellLevel" aria-label="Livello dell'incantesimo"></select>
        <datalist id="spellList"></datalist>
      </div></div>
      <div class="hint" id="spellHint"></div>
      <div class="form-row"><label class="form-label" for="slot">Slot</label><select id="slot" aria-label="Slot del Controincantesimo"></select></div>
      <section class="verdict" id="verdict" data-state="pending">
        <div class="verdict-text" id="verdictText"></div>
        <div id="checkBlock" hidden>
          <div class="outcomes segmented" role="group" aria-label="Esito della prova">
            <button type="button" data-result="passed" data-outcome="passed" aria-pressed="false">Prova riuscita</button>
            <button type="button" data-result="failed" data-outcome="failed" aria-pressed="false">Prova fallita</button>
          </div>
          <label class="check-row">Totale della prova (facoltativo)<input id="checkTotal" type="number" inputmode="numeric" /></label>
        </div>
      </section>
      <label class="toggle" id="targetSlotRow" hidden><input type="checkbox" id="targetSlot" checked /><span id="targetSlotText"></span></label>
      </div></div>
      <div class="apply-row"><div class="defense-chips"></div><span id="summary" class="total"></span><button id="cast" class="apply primary" type="button" disabled>Lancia</button></div>
      <footer class="status-bar"><p id="status" class="status" role="status" aria-live="polite" hidden></p></footer>
    </main>
