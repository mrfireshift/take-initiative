            <button type="button" data-save-outcome="passed">Superato</button>
            <button type="button" data-save-outcome="failed">Fallito</button>
            <button type="button" data-save-outcome="immune">Immune</button>
          </div>
        </div>
      </section>
      <section id="singleHealSection" class="section" hidden>
        <div id="singleHealTitle" class="section-title">Bersaglio: —</div>
        <div id="healAmountField" class="field"><label id="healAmountLabel" for="healAmount">Cura · 2d6</label><input id="healAmount" type="number" min="0" step="1" inputmode="numeric" placeholder="Totale" /></div>
      </section>
      <section id="telekinesisSection" class="section" hidden>
        <div id="telekinesisTitle" class="section-title">Contesa di caratteristica</div>
        <select id="telekinesisTarget" aria-label="Bersaglio creatura di Telecinesi"><option value="">Seleziona la creatura</option></select>
        <div id="telekinesisHint" class="hint"></div>
        <div id="telekinesisOutcomes" class="outcomes">
          <button type="button" data-telekinesis-outcome="passed">Contesa vinta</button>
          <button type="button" data-telekinesis-outcome="failed">Contesa persa</button>
        </div>
      </section>
      <section id="prismaticWallSection" class="section" hidden>
        <div id="prismaticWallTitle" class="section-title">Muro prismatico</div>
        <select id="prismaticWallTarget" aria-label="Creatura del muro prismatico"><option value="">Seleziona la creatura</option></select>
        <div id="prismaticWallHint" class="hint"></div>
        <div id="prismaticWallLayers" class="prismatic-wall-layers"></div>
        <div id="prismaticWallLayerDetail" class="root-note" hidden></div>
      </section>
      <section id="blinkReturnSection" class="section" hidden>
        <div class="section-title">Piano Etereo · ritorno</div>
        <div id="blinkReturnHint" class="root-note" hidden>Scegli la destinazione del ritorno sulla mappa.</div>
        <div class="toolbar">
          <button id="blinkPlace" class="primary" type="button">Scegli destinazione</button>
          <span id="blinkPlacementStatus" class="hint"></span>
        </div>
      </section>
      <div id="footer" class="footer"><button id="apply" class="primary" type="button" disabled>Cura</button><span id="summary" class="hint"></span></div>
    </main>
  </body>
</html>
