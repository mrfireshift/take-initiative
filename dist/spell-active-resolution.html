    <style>
      /* What only this popup has: its language is the common sheets'. */
      /* The target, once: its menu when there is one, otherwise the creature selected on the map, with its hit points. */
      .target-value { display: flex; align-items: center; justify-content: space-between; gap: var(--obrt-space-md); min-width: 0; min-height: var(--obrt-hit-min); }
      #targetLine[data-empty="true"] .target-name { color: var(--muted); }
      .view:has(.section:not([hidden]) .form-row > :is(#attackTarget, #saveTarget, #telekinesisTarget, #prismaticWallTarget):not([hidden])) #targetLine { display: none; }
      /* The facts above the damage, in its box; at the top of the panel when the section in view has no box. */
      .view:has(.section:not([hidden]) .damage-outcome-row) #micropills { display: none; }
      /* Several attacks have a damage row each: the facts at the top, for all of them. */
      .view:has(#attackRows:not([hidden])) #micropills { display: block; }
      #attackRows:not([hidden]) ~ .damage-outcome-row { display: none; }
      .back { min-height: var(--obrt-hit-min); padding: 0 var(--obrt-space-md); color: var(--info-text); font-size: var(--obrt-type-secondary); font-weight: var(--obrt-weight-regular); }
      #saveSection { flex: 0 1 auto; }
      .toolbar { display: flex; align-items: center; gap: var(--obrt-space-sm); min-width: 0; flex-wrap: wrap; }
      .toolbar .field { flex: 1 1 150px; }
      /* The area's step, as in the Boss console: what has been drawn on the left, the button that draws it on the right. */
      #placementToolbar { flex-wrap: nowrap; justify-content: flex-end; min-height: var(--obrt-h-control-md); }
      #placementToolbar button { flex: none; }
      #placementStatus { flex: 1 1 auto; min-width: 0; line-height: 1.3; }
      #place { min-height: var(--obrt-hit-min); padding: 2px 9px; color: var(--info-text); font-size: var(--obrt-type-secondary); font-weight: var(--obrt-weight-regular); }
      .child-depths { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--obrt-space-sm); }
      .child-depth { display: grid; grid-template-columns: minmax(0, 1fr) 64px; align-items: center; gap: var(--obrt-space-sm); }
      .child-depth label { overflow: hidden; color: var(--muted); font-size: var(--obrt-type-secondary); text-overflow: ellipsis; white-space: nowrap; }
      .attack-rows { display: flex; flex-direction: column; gap: var(--obrt-space-md); }
      .attack-row { display: grid; gap: var(--obrt-space-md); padding: var(--obrt-space-lg) var(--obrt-space-xl); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
      .attack-row__title { color: var(--muted); font-size: var(--obrt-type-secondary); font-weight: var(--obrt-weight-semibold); }
      .damage-defenses { display: flex; flex-wrap: wrap; gap: var(--obrt-space-xs); }
      #prismaticWallSection { flex: 0 1 auto; }
      #prismaticWallHint:empty { display: none; }
      /* The layers in a box, as the creatures of an area: the name, the outcome, the number. */
      .prismatic-wall-layers { flex: 0 1 auto; min-height: 120px; display: flex; flex-direction: column; overflow: auto; padding: var(--obrt-space-xs) var(--obrt-space-md); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); background: var(--surface-soft); }
      .prismatic-wall-layers:empty { display: none; }
      .prismatic-wall-layers:has(> :only-child) { min-height: 0; }
      .prismatic-wall-layer { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto 58px; align-items: center; gap: 2px var(--obrt-space-sm); padding: var(--obrt-space-xs) 0; }
      .prismatic-wall-layer + .prismatic-wall-layer { border-top: 1px solid var(--line); }
      .prismatic-wall-layer__name { display: grid; min-width: 0; line-height: 1.25; }
      .prismatic-wall-layer__name strong { font-weight: var(--obrt-weight-semibold); }
      .prismatic-wall-layer__meta { overflow: hidden; color: var(--muted); font-size: var(--obrt-type-secondary); text-overflow: ellipsis; white-space: nowrap; }
      .prismatic-wall-layer__meta .dice { margin-left: 4px; }
      .prismatic-wall-layer input[type="number"] { width: 100%; }
      .prismatic-wall-layer__detail, .prismatic-wall-layer .damage-defenses { grid-column: 1 / -1; }
      .prismatic-wall-layer__detail { color: var(--muted); font-size: var(--obrt-type-secondary); line-height: var(--obrt-leading-normal); text-wrap: pretty; }
      .root-note { padding: var(--obrt-space-md) var(--obrt-space-lg); border: 1px solid var(--line); border-radius: var(--obrt-radius-md); color: var(--muted); font-size: var(--obrt-type-secondary); line-height: var(--obrt-leading-normal); }
      #sharedHpControls { grid-column: 1 / -1; }
    </style>

  <body>
    <main id="app" class="glass-shell" data-glass-popover="1" data-state="loading">
      <header class="header heading" data-drag-handle draggable="true" title="Trascina per spostare">
        <div class="heading-title-group">
          <h1 id="title" class="title">…</h1>
          <div id="subtitle" class="subtitle" hidden></div>
        </div>
        <span class="drag-grip" aria-hidden="true"></span>
        <div class="heading-actions">
          <button id="backToChoice" class="back" type="button" title="Torna alla scelta delle azioni" aria-label="Torna alla scelta delle azioni" hidden>‹ Azioni</button>
          <span id="economy" class="cost-tag" hidden></span>
          <button id="close" class="icon-button" type="button" title="Chiudi" aria-label="Chiudi">×</button>
        </div>
      </header>
      <div class="panel"><div class="view">
      <p id="micropills" class="action-facts" data-facts></p>
      <div id="targetLine" class="form-row" hidden><span class="form-label">Bersaglio</span><div class="target-value"><span id="targetLineName" class="target-name"></span><span id="targetLineHp" class="target-hp"></span></div></div>
      <section id="saveSection" class="section" hidden>
        <div id="saveTitle" class="section-title" hidden>Sagoma e tiri salvezza</div>
        <div id="childCountField" class="field" hidden><label id="childCountLabel" for="childCount">Numero</label><input id="childCount" type="number" min="1" max="6" step="1" inputmode="numeric" /></div>
        <div id="placementToolbar" class="toolbar"><span id="placementStatus" class="hint"></span><button id="place" type="button">Posiziona area</button><button id="confirmPlacement" class="primary" type="button" hidden>Conferma sagoma</button><button id="cancelPlacement" type="button" hidden>Annulla</button></div>
        <div id="childDepths" class="child-depths" hidden></div>
        <div id="damageField" class="field" hidden><label id="damageLabel" for="damage">Danno pieno</label><input id="damage" type="number" min="0" step="1" inputmode="numeric" placeholder="Totale" /></div>
        <div id="bulkOutcomes" class="section-head" role="group" aria-label="Imposta tutti" hidden>
          <span class="caption">Creature colpite</span>
          <span class="area-tools">
            <button class="area-tool" type="button" data-bulk-outcome="passed">Tutti superati</button>
            <button class="area-tool" type="button" data-bulk-outcome="failed">Tutti falliti</button>
            <button class="area-tool" type="button" data-bulk-outcome="immune">Tutti immuni</button>
          </span>
        </div>
        <div id="targets" class="targets"></div>
      </section>
      <section id="attackSection" class="section" hidden>
        <div id="attackTitle" class="section-title" hidden>Fulmine</div>
        <div id="attackRows" class="attack-rows" hidden></div>
        <div class="form-row"><span class="form-label">Variante</span><select id="preparedChoice" aria-label="Variante di risoluzione" hidden>
          <option value="">Seleziona variante</option>
        </select></div>
        <div class="form-row"><span class="form-label">Bersaglio</span><select id="attackTarget" aria-label="Bersaglio dell'attacco"><option value="">Seleziona il bersaglio</option></select></div>
        <div id="attackAdvantage" class="hint"></div>
        <div id="zoneShorteningField" class="form-row" hidden>
          <label class="form-label" for="zoneShorteningFrom">Consuma</label>
          <select id="zoneShorteningFrom" aria-label="Porzione del muro da consumare">
            <option value="start">Parte iniziale</option>
            <option value="end" selected>Parte finale</option>
          </select>
        </div>
        <div id="attackOutcomes" class="outcomes segmented">
          <button type="button" data-attack-outcome="hit" data-outcome="hit">Colpito</button>
          <button type="button" data-attack-outcome="critical" data-outcome="critical" hidden>Critico</button>
          <button type="button" data-attack-outcome="miss" data-outcome="miss">Mancato</button>
        </div>
        <div id="preparedSaveOutcomes" class="outcomes segmented" hidden>
          <button type="button" data-save-outcome="passed" data-outcome="passed">Superato</button>
          <button type="button" data-save-outcome="failed" data-outcome="failed">Fallito</button>
          <button type="button" data-save-outcome="immune" data-outcome="immune">Immune</button>
        </div>
        <div class="damage-outcome-row">
          <p class="action-facts" data-facts></p>
          <div class="field"><label id="attackDamageLabel" for="attackDamage">Danno</label><input id="attackDamage" type="number" min="0" step="1" inputmode="numeric" placeholder="Totale" /></div>
        </div>
      </section>
      <section id="singleSaveSection" class="section" hidden>
        <div id="singleSaveTitle" class="section-title" hidden>Tiro salvezza</div>
        <div class="form-row"><span class="form-label">Bersaglio</span><select id="saveTarget" aria-label="Bersaglio del tiro salvezza"><option value="">Seleziona il bersaglio</option></select></div>
        <div id="saveTargetHint" class="hint"></div>
        <div id="singleSaveAbilityField" class="form-row" hidden>
          <label class="form-label" for="saveAbility">Prova</label>
          <select id="saveAbility" aria-label="Caratteristica della prova"></select>
        </div>
        <div id="singleSaveOutcomes" class="outcomes segmented">
          <button type="button" data-save-outcome="passed" data-outcome="passed">Superato</button>
          <button type="button" data-save-outcome="failed" data-outcome="failed">Fallito</button>
          <button type="button" data-save-outcome="immune" data-outcome="immune">Immune</button>
        </div>
        <div class="damage-outcome-row">
          <p class="action-facts" data-facts></p>
          <div id="singleSaveDamageField" class="field"><label id="singleSaveDamageLabel" for="saveDamage">Danno</label><input id="saveDamage" type="number" min="0" step="1" inputmode="numeric" placeholder="Totale" /></div>
        </div>
      </section>
      <section id="singleHealSection" class="section" hidden>
        <div class="damage-outcome-row"><p class="action-facts" data-facts></p><div id="healAmountField" class="field"><label id="healAmountLabel" for="healAmount">Cura · 2d6</label><input id="healAmount" type="number" min="0" step="1" inputmode="numeric" placeholder="Totale" /></div></div>
      </section>
      <section id="telekinesisSection" class="section" hidden>
        <div class="form-row"><span class="form-label">Bersaglio</span><select id="telekinesisTarget" aria-label="Bersaglio creatura di Telecinesi"><option value="">Seleziona la creatura</option></select></div>
        <div id="telekinesisHint" class="hint"></div>
        <div id="telekinesisOutcomes" class="outcomes segmented">
          <button type="button" data-telekinesis-outcome="passed" data-outcome="passed">Contesa vinta</button>
          <button type="button" data-telekinesis-outcome="failed" data-outcome="failed">Contesa persa</button>
        </div>
      </section>
      <section id="prismaticWallSection" class="section" hidden>
        <div class="form-row"><span class="form-label">Bersaglio</span><select id="prismaticWallTarget" aria-label="Creatura del muro prismatico"><option value="">Seleziona la creatura</option></select></div>
        <div id="prismaticWallHint" class="hint"></div>
        <div id="prismaticWallLayers" class="prismatic-wall-layers"></div>
        <div id="prismaticWallLayerDetail" class="root-note" hidden></div>
      </section>
      <section id="blinkReturnSection" class="section" hidden>
        <div class="section-title">Piano Etereo · ritorno</div>
        <div id="blinkReturnHint" class="root-note" hidden>Scegli la destinazione del ritorno sulla mappa.</div>
        <div class="toolbar">
          <button id="blinkPlace" class="primary" type="button">Scegli destinazione</button>
          <span id="blinkPlacementStatus" class="hint"></span>
        </div>
      </section>
      </div></div>
      <div id="footer" class="apply-row"><button id="apply" class="apply primary" type="button" disabled>Applica</button><span id="summary" class="total" hidden></span><div id="damageDefenses" class="defense-chips" hidden></div></div>
      <footer class="status-bar"><p id="status" class="status" role="status" aria-live="polite" hidden></p></footer>
    </main>
