      html, body, #app { width: 100%; height: 100%; margin: 0; background: transparent; }

      body {
        position: relative;
        overflow: hidden;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        pointer-events: none;

      .warning {
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, .40);
        --accent-deep: rgba(12, 52, 82, .94);
        position: absolute;
        top: 4px;
        left: 4px;
        width: calc(100% - 8px);
        min-height: 110px;
        padding: 14px 66px 14px 106px;
        border: 2px solid #080b10;
        border-radius: 8px;
        background: linear-gradient(115deg, var(--accent-deep) 0%, rgba(14, 22, 30, .97) 48%, rgba(10, 11, 14, .98) 100%);
        cursor: pointer;
        pointer-events: auto;
        box-shadow:
          0 0 0 2px var(--accent),
          0 0 22px 5px var(--accent-soft),
          0 18px 48px rgba(0,0,0,.68),
          inset 0 0 0 1px rgba(255,255,255,.12),
          inset 0 -28px 44px rgba(0,0,0,.25);
      }
      .warning.broken {
        --accent: #f97316;
        --accent-soft: rgba(249, 115, 22, .42);
        --accent-deep: rgba(96, 40, 10, .94);
      }
      .warning::before {
        position: absolute;
        inset: 6px 8px;
        border: 1px solid rgba(255,255,255,.10);
        border-radius: 4px;
        content: "";
      }
      .portrait {
        position: absolute;
        top: 50%;
        left: 13px;
        width: 83px;
        height: 83px;
        overflow: hidden;
        border: 2px solid #080b10;
        border-radius: 50%;

      }

        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 35px;
        font-weight: 800;
        text-shadow: 0 2px 4px #000;
      }
      .copy { position: relative; min-width: 0; z-index: 1; }
      .eyebrow {
        color: var(--accent);

      .title {

        line-height: 1.05;
        text-overflow: ellipsis;
        text-shadow: 0 2px 3px rgba(0,0,0,.9);

      }
      .detail {

        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid var(--accent-soft);
        color: rgba(255,255,255,.78);
        font-size: 11px;
        line-height: 1.45;
        z-index: 1;
      }
      .detail p { margin: 0; }
      .detail strong { color: #fff; font-family: var(--obrt-font-display, Georgia, "Times New Roman", serif); }
      .round-badge {

        top: 14px;
        right: 15px;
        width: 44px;
        height: 44px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 2px solid #080b10;
        border-radius: 50%;
        background: rgba(5,9,14,.88);
        box-shadow: 0 0 0 1px var(--accent), inset 0 0 12px var(--accent-soft);
        line-height: 1;
        z-index: 1;
      }
      .round-badge span { color: var(--accent); font-size: var(--obrt-type-micro, 10px); font-weight: 900; letter-spacing: 0; }
      .round-badge strong { margin-top: 2px; font-family: var(--obrt-font-display, Georgia, "Times New Roman", serif); font-size: 14px; }
      .timer {
        position: absolute;
        right: 0;
        bottom: -2px;
        left: 0;
        height: 4px;
        overflow: hidden;
        border-radius: 0 0 6px 6px;
        background: rgba(255,255,255,.07);
      }
      .timer::after {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        content: "";
        transform-origin: left;
        animation: expire 8s linear forwards;
      }
      @keyframes expire { to { transform: scaleX(0); } }
      @media (max-width: 520px) {
