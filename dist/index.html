      .tbp-loading {
        box-sizing: border-box;
        display: grid;
        place-items: center;
        gap: 10px;
        height: 100%;
        padding: 24px;
        color: rgba(226, 232, 240, 0.86);
        font: 600 13px/1.4 var(--obrt-font-ui, "Helvetica Neue", Helvetica, Arial, sans-serif);
        text-align: center;
      }

      .tbp-loading__spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(148, 163, 184, 0.28);
        border-top-color: rgba(226, 232, 240, 0.9);
        border-radius: 50%;
        animation: tbp-loading-spin 0.8s linear infinite;
      }

      @keyframes tbp-loading-spin {
        to { transform: rotate(360deg); }
      }

      /* The halo of the active card (initiativeCardClassicBuilder.js): only its opacity moves. */
      @keyframes tbp-active-turn-pulse {
        from { opacity: 0.35; }
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        [data-active-turn-halo] { animation: none !important; opacity: 0.8; }
      }
    </style>
