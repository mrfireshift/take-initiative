    <style>
      html,
      body,
      #app {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: transparent;
      }

      #app {
        height: 100vh;
      }

      /* The tracker is a set of controls, never text to select: fast clicks (▲/▼, a card) selected the whole document,
         painted blue, html and body included. The fields typed in (initiative, HP, a rename) keep their selection;
         initiativeList.js also stops any selection that starts outside them (selectstart). */
      html,
      body,
      #app {
        -webkit-user-select: none;
        user-select: none;
      }

      #app input:not([type]),
      #app input[type="text"],
      #app input[type="number"],
      #app input[type="search"],
      #app textarea,
      #app [contenteditable="true"] {
        -webkit-user-select: text;
        user-select: text;
      }

      .tbp-loading {
        box-sizing: border-box;
        display: grid;
        place-items: center;
        gap: 10px;
        height: 100%;
        padding: 24px;
        color: rgba(226, 232, 240, 0.86);
        font: 600 13px/1.4 var(--obrt-font-ui, "Helvetica Neue", Helvetica, Arial, sans-serif);
        text-align: center;
      }

      .tbp-loading__spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(148, 163, 184, 0.28);
        border-top-color: rgba(226, 232, 240, 0.9);
        border-radius: 50%;
        animation: tbp-loading-spin 0.8s linear infinite;
      }

      @keyframes tbp-loading-spin {
        to { transform: rotate(360deg); }
      }

      /* The halo of the active card (initiativeCardClassicBuilder.js): only its opacity moves. */
      @keyframes tbp-active-turn-pulse {
        from { opacity: 0.35; }
        to { opacity: 1; }
      }

      /* The round in the compact bar's left column: a small caption over a number large enough for the table. */
      [data-tracker-layout="compact"] #tbp-round-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        margin: 6px 0 0;
        line-height: 1;
        text-align: center;
      }
      [data-tracker-layout="compact"] #tbp-round-label [data-round-caption] {
        color: rgba(226, 232, 240, .7);
        font-size: var(--obrt-type-micro, 10px);
        font-weight: 600;
        letter-spacing: .02em;
      }
      [data-tracker-layout="compact"] #tbp-round-label [data-round-number] {
        color: #fff;
        /* The UI font, not Georgia: Georgia's old-style figures make a lone 1 look small. */
        font-size: 22px;
        font-weight: var(--obrt-weight-heavy, 800);
        font-variant-numeric: tabular-nums;
      }

      /* The reorder grip of the cards in a real initiative tie (tieReorderCore.js): shown on hover. */
      [data-tie-reorder-handle="1"] {
        opacity: 0;
        transition: opacity 120ms ease;
      }
      [data-tracker-card="1"]:hover [data-tie-reorder-handle="1"],
      [data-tie-reorder-handle="1"]:active {
        opacity: .8;
      }
      @media (hover: none) {
        [data-tie-reorder-handle="1"] { opacity: .55; }
      }

      /* The compact card's initiative badge while its inline editor is open: a field the size of the badge (the shared
         editor writes 15px, made for the extended card's larger badge). */
      [data-compact-card="1"] [data-badge="init"][data-init-editing="1"] {
        /* A fixed width: the field is 100% wide and would otherwise take a text input's natural width. */
        width: 30px !important;
        min-width: 30px !important;
        padding: 0 !important;
        outline: 1px solid rgba(147, 197, 253, .72);
        outline-offset: 1px;
      }
      [data-compact-card="1"] [data-badge="init"] input {
        font-size: 12px !important;
      }

      /* The compact card's HP text while its inline editor is open: still "HP 78 / 100" in place, no field around it,
         but all white at the maximum's weight, with a faint line under the two numbers that can be typed. The shared
         editor (initiativeEditors.js) drops the caption and writes two 22px fields: these rules shape the text. */
      [data-card-hp-text="1"][data-hp-editing="1"] {
        color: #fff !important;
      }
      [data-card-hp-text="1"][data-hp-editing="1"] > div {
        justify-content: center;
        gap: 0 !important;
      }
      [data-card-hp-text="1"][data-hp-editing="1"] > div::before {
        content: "PF\00a0";
        font-weight: 600;
      }
      [data-card-hp-text="1"][data-hp-editing="1"] input {
        width: 3ch !important;
        color: inherit !important;
        font-weight: 600 !important;
        font-variant-numeric: tabular-nums;
        box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .5);
      }
      [data-card-hp-text="1"][data-hp-editing="1"] input:first-child {
        text-align: right !important;
      }
      [data-card-hp-text="1"][data-hp-editing="1"] input:last-child {
        opacity: 1 !important;
        text-align: left !important;
      }
      [data-card-hp-text="1"][data-hp-editing="1"] span {
        padding: 0 .28em;
        font-weight: 600;
        opacity: 1 !important;
      }
      /* Each field as wide as its number, where the browser can size fields to their content. */
      @supports (field-sizing: content) {
        [data-card-hp-text="1"][data-hp-editing="1"] input {
          field-sizing: content;
          width: auto !important;
          min-width: 1ch;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        [data-active-turn-halo] { animation: none !important; opacity: 0.8; }
      }
    </style>
