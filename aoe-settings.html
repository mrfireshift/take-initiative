<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aspetto area</title>
    <link rel="stylesheet" href="/ui-typography.css" />
    <link rel="stylesheet" href="/popover-glass.css" />
    <link rel="stylesheet" href="/aoe-settings.css" />
  </head>
  <body>
    <main class="aoe-style-shell" data-glass-popover="1" data-popover-id="com.thebigpicture.initiative/aoe-style-popover">
      <header>
        <div>
          <h1>Aspetto area</h1>
          <p>Tutte le aree</p>
        </div>
        <button id="close" class="icon-button" type="button" aria-label="Chiudi">&times;</button>
      </header>

      <label class="setting-row setting-row--color">
        <span class="setting-label">Area</span>
        <span class="color-copy">Colore del riempimento</span>
        <input id="fill-color" type="color" aria-label="Colore del riempimento" />
      </label>

      <label class="setting-row setting-row--color">
        <span class="setting-label">Linea</span>
        <span class="color-copy">Colore del contorno</span>
        <input id="stroke-color" type="color" aria-label="Colore del contorno" />
      </label>

      <label class="setting-row setting-row--range">
        <span class="setting-label">Opacità</span>
        <input id="opacity" type="range" min="5" max="45" step="1" />
        <output id="opacity-value"></output>
      </label>

      <label class="setting-row setting-row--range">
        <span class="setting-label">Spessore</span>
        <input id="stroke-width" type="range" min="0.4" max="3" step="0.1" />
        <output id="stroke-value"></output>
      </label>
    </main>
    <script type="module" src="/src/popoverDrag.js"></script>
    <script type="module" src="/src/aoeSettings.js"></script>
  </body>
</html>
