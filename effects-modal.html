<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Effects</title>
    <link rel="stylesheet" href="/ui-typography.css" />
    <link rel="stylesheet" href="/popover-glass.css" />
    <style>
      :root {

        --obrt-text: #fff;
        --obrt-hover: rgba(255,255,255,.06);
      }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      .glass-shell {
        width: 100%; height: 100%; min-height: 0 !important;
        display: flex; flex-direction: column; overflow: hidden;
      }
      .panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; position: relative; }
      * { scrollbar-width: thin; scrollbar-color: rgba(148,163,184,.55) transparent; }
    </style>
  </head>
  <body>
    <div class="glass-shell" data-glass-popover="1" data-popover-id="com.thebigpicture.initiative/effects-modal">
      <main id="app" class="panel"></main>
    </div>
    <script type="module" src="/src/popoverDrag.js"></script>
    <script type="module" src="/src/effects-modal.ts"></script>
  </body>
</html>
