<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libreria JB2A</title>
  <style>
    :root { --bg: #14171c; --panel: #1d2128; --line: #2e3440; --text: #e8eaee; --muted: #9aa3b2; --accent: #f0a04b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px;
      background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { font-size: 16px; margin: 0 8px 0 0; }
    input, select, button { font: inherit; color: var(--text); background: #252a33; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
    input[type="search"] { flex: 1 1 220px; min-width: 0; }
    button { cursor: pointer; }
    label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
    #count { color: var(--muted); }
    main { padding: 12px 16px 64px; }
    h2 { font-size: 15px; margin: 22px 0 8px; color: var(--accent); }
    h2 small { color: var(--muted); font-weight: 400; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .card { position: relative; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; cursor: pointer; }
    .card:hover { border-color: var(--accent); }
    .thumb { aspect-ratio: 1; display: grid; place-items: center; background: #3a4a3a repeating-conic-gradient(#344334 0 25%, #3c4c3c 0 50%) 0 0 / 30px 30px; }
    .thumb img { max-width: 100%; max-height: 100%; }
    .thumb span { color: var(--muted); font-size: 11px; padding: 8px; text-align: center; }
    .label { padding: 6px 8px; font-size: 12px; line-height: 1.3; word-break: break-word; }
    .label small { display: block; color: var(--muted); }
    .star { position: absolute; top: 4px; right: 6px; font-size: 18px; color: rgba(255,255,255,.35); text-shadow: 0 1px 2px #000; }
    .card.starred .star { color: var(--accent); }
    dialog { width: min(920px, 96vw); max-height: 94vh; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 0; }
    dialog::backdrop { background: rgba(0,0,0,.7); }
    .viewer { display: grid; grid-template-columns: minmax(0, 1fr) 280px; }
    .stage { min-height: 420px; display: grid; place-items: center; background: #3a4a3a repeating-conic-gradient(#344334 0 25%, #3c4c3c 0 50%) 0 0 / 40px 40px; }
    .stage video { max-width: 100%; max-height: 70vh; }
    .side { padding: 12px; display: grid; gap: 8px; align-content: start; max-height: 94vh; overflow: auto; }
    .side h3 { margin: 0; font-size: 14px; word-break: break-word; }
    .meta { color: var(--muted); font-size: 12px; }
    .variants { display: grid; gap: 4px; }
    .variants button { text-align: left; font-size: 12px; padding: 4px 6px; word-break: break-all; }
    .variants button[aria-pressed="true"] { border-color: var(--accent); }
    #picked { white-space: pre; font-size: 11px; max-height: 160px; overflow: auto; color: var(--muted); }
    @media (max-width: 700px) { .viewer { grid-template-columns: 1fr; } .stage { min-height: 260px; } }
  </style>
</head>
<body>
  <header>
    <h1>Libreria JB2A</h1>
    <input id="search" type="search" placeholder="Cerca (es. skull, poison, heart, ice, vine…)" autocomplete="off">
    <select id="family"><option value="">Tutte le famiglie</option></select>
    <label><input id="hide" type="checkbox" checked autocomplete="off"> Nascondi armi, trappole, UI, sci-fi</label>
    <label><input id="only-starred" type="checkbox" autocomplete="off"> Solo segnati</label>
    <button id="copy" type="button">Copia segnati</button>
    <span id="count"></span>
  </header>
  <main id="list"><p>Caricamento dell'indice…</p></main>
  <dialog id="viewer">
    <div class="viewer">
      <div class="stage"><video id="video" autoplay loop muted playsinline></video></div>
      <div class="side">
        <h3 id="title"></h3>
        <div class="meta" id="meta"></div>
        <button id="star" type="button">☆ Segna</button>
        <div class="meta">Varianti (colore, dimensione, distanza):</div>
        <div class="variants" id="variants"></div>
        <div class="meta">Segnati:</div>
        <div id="picked"></div>
        <button id="close" type="button">Chiudi</button>
      </div>
    </div>
  </dialog>
  <script type="module" src="./library.js"></script>
</body>
</html>
