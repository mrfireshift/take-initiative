<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Boss Actions preview (SDK simulato)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; font: 12px "Helvetica Neue", Arial, sans-serif; color: #fff; }
  #map { position: absolute; inset: 0; background-color: #2b3a2f;
    background-image: linear-gradient(rgba(0,0,0,.28) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.28) 1px, transparent 1px),
      radial-gradient(ellipse at 60% 40%, #5b6b58 0, #39463a 45%, #232a24 100%);
    background-size: 70px 70px, 70px 70px, 100% 100%; }
  .token { position: absolute; border-radius: 50%; border: 3px solid #e5e7eb; box-shadow: 0 4px 10px rgba(0,0,0,.5); cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: rgba(255,255,255,.9); user-select: none; }
  .token.selected { outline: 3px solid #60a5fa; outline-offset: 4px; }
  .token .label { position: absolute; top: 100%; margin-top: 6px; white-space: nowrap; padding: 2px 6px; border-radius: 6px; background: rgba(15,23,42,.8); font-size: 11px; font-weight: 600; }
  .token .hp { position: absolute; bottom: 100%; margin-bottom: 4px; width: 100%; height: 6px; border-radius: 3px; background: rgba(0,0,0,.6); overflow: hidden; }
  .token .hp > i { display: block; height: 100%; background: #22c55e; }
  #toolbar { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 12px; background: rgba(42,47,64,.85); border: 1px solid rgba(255,255,255,.16); }
  #toolbar button { padding: 4px 9px; border-radius: 8px; border: 1px solid rgba(148,163,184,.3); background: #0f172a; color: #fff; cursor: pointer; }
  iframe.popover { position: absolute; border: 0; background: transparent; color-scheme: normal; }
</style>
</head>
<body>
<div id="map"></div>
<div id="toolbar"><span id="round">Round</span><button id="next-round" type="button">Round +1</button><button id="open-boss" type="button">Boss Actions</button><button id="open-hp" type="button">Console HP</button><button id="undo-last" type="button">Undo History</button></div>
<script type="module" src="/test-support/boss-actions-browser/host.js"></script>
</body>
</html>
