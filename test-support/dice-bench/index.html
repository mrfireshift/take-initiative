<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Banco dadi 3D</title>
    <style>
      body { margin: 0; display: flex; gap: 16px; padding: 12px; background: #1d2127; color: #eee; font: 13px system-ui, sans-serif; }
      canvas { width: 300px; height: 600px; border-radius: 10px; background: #2a2f36; }
      #side { display: grid; gap: 8px; align-content: start; width: 340px; }
      input, select, button { font: inherit; padding: 4px 6px; }
      #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas id="tray"></canvas>
    <div id="side">
      <label>Formula <input id="formula" value="1d4+1d6+1d8+1d10+1d12+1d20+1d100" /></label>
      <label>Stile <select id="style"></select></label>
      <button id="roll" type="button">Tira</button>
      <div id="log"></div>
    </div>
    <script type="module" src="./bench.js"></script>
  </body>
</html>
